['Hallenbeleuchtung: LED statt Halogen',r=>{const n=rg(r,20,60,5),Pa=250,Pn=rg(r,40,80,10),h=rg(r,2500,4500,500),pr=rg(r,25,40,5),Ka=n*Pa/1000,Wa=Ka*h,Wn=n*Pn/1000*h,dW=Wa-Wn,sp=dW*pr/100;return{intro:`In einer Halle werden ${n} Halogenstrahler (je ${Pa} W) durch LED-Strahler (je ${Pn} W) ersetzt. Die Beleuchtung brennt ${h} Stunden pro Jahr. Strompreis: ${pr} ct/kWh.`,steps:[STP('Wie groß ist der Jahresverbrauch der Halogenstrahler?',Wa,'kWh',[`P_alt = ${n} · ${Pa} W = ${nf(Ka)} kW`,`W_alt = P · t = ${nf(Ka)} · ${h} = ${nf(Wa)} kWh`],'W = P · t. Leistung in kW, Zeit in h.'),STP('Wie groß ist der Jahresverbrauch der LED-Strahler?',Wn,'kWh',[`P_neu = ${n} · ${Pn} W = ${nf(n*Pn/1000)} kW`,`W_neu = ${nf(n*Pn/1000)} · ${h} = ${nf(Wn)} kWh`],'Gleiche Rechnung mit der neuen Leistung.'),STP('Wie viel Energie wird jährlich gespart?',dW,'kWh',[`ΔW = ${nf(Wa)} − ${nf(Wn)} = ${nf(dW)} kWh`],'Differenz der beiden Verbräuche.'),STP('Wie viel Euro spart das pro Jahr?',sp,'€',[`Ersparnis = ${nf(dW)} kWh · ${pr/100} €/kWh = ${nf(sp)} €`],'ct in € umrechnen: 100 ct = 1 €.')]}}],
['NTC-Fühler im Spannungsteiler',r=>{const T=[[20,10000],[40,5000],[60,2500],[80,1200],[100,650],[130,330]],q=pk(r,T.slice(2)),U=pk(r,[5,12,24]),R2=pk(r,[500,1000,2000]),R1=q[1],Rg=R1+R2,I=U/Rg,U2=I*R2,U20=U*R2/(10000+R2);return{intro:`Ein temperaturabhängiger Widerstand (NTC) R₁ liegt in Reihe mit einem Festwiderstand R₂ = ${R2} Ω an ${U} V. Kennwerte des NTC (aus der Tabelle): ${T.map(x=>x[0]+' °C: '+x[1]+' Ω').join('; ')}. Der Fühler hat gerade ϑ = ${q[0]} °C.`,steps:[STP('Welchen Widerstand hat R₁ bei dieser Temperatur?',R1,'Ω',[`Aus der Tabelle: R₁(${q[0]} °C) = ${R1} Ω`],'Lies den Wert direkt aus der Tabelle in der Aufgabe ab.'),STP('Wie groß ist der Gesamtwiderstand?',Rg,'Ω',[`R_ges = R₁ + R₂ = ${R1} + ${R2} = ${Rg} Ω`],'Reihenschaltung: Widerstände addieren.'),STP('Welcher Strom fließt?',I*1000,'mA',[`I = U / R_ges = ${U} / ${Rg} = ${nf(I*1000)} mA`],'Ohmsches Gesetz.'),STP('Welche Spannung U₂ liegt an R₂?',U2,'V',[`U₂ = I · R₂ = ${nf(I)} A · ${R2} Ω = ${nf(U2)} V`],'Spannung am Festwiderstand.'),STP('Welche Spannung U₂ stellt sich bei 20 °C ein (R₁ = 10 000 Ω)?',U20,'V',[`R_ges = 10 000 + ${R2} = ${10000+R2} Ω`,`U₂ = U · R₂ / R_ges = ${U} · ${R2} / ${10000+R2} = ${nf(U20)} V`,'Je kälter, desto größer R₁ und desto kleiner U₂.'],'Spannungsteiler: U₂ = U · R₂ / (R₁ + R₂).')]}}],
['Kupplungsbetätigung: Pedal und Hydraulik',r=>{const Fp=rg(r,60,200,10),lp=rg(r,200,320,20),lk=rg(r,40,80,10),dG=rg(r,16,22,2),dN=rg(r,22,32,2),sG=rg(r,20,35,5),FG=Fp*lp/lk,AG=PI*dG*dG/4,AN=PI*dN*dN/4,p=FG/AG*10,FN=FG*AN/AG,sN=sG*AG/AN;return{intro:`Das Kupplungspedal wirkt als Hebel: Die Pedalkraft F_P = ${Fp} N greift im Abstand ${lp} mm vom Drehpunkt an, die Kolbenstange des Geberzylinders sitzt ${lk} mm vom Drehpunkt. Der Geberkolben hat d₁ = ${dG} mm, der Nehmerkolben d₂ = ${dN} mm, der Geberhub beträgt ${sG} mm. Reibung bleibt unberücksichtigt.`,steps:[STP('Welche Kraft F_G wirkt auf den Geberkolben?',FG,'N',[`Hebelgesetz: F_P · l_P = F_G · l_K`,`F_G = ${Fp} · ${lp} / ${lk} = ${nf(FG)} N`],'Hebelgesetz: Kraft mal Hebelarm links gleich Kraft mal Hebelarm rechts.'),STP('Welcher Druck entsteht im Hydrauliksystem?',p,'bar',[`A₁ = π · d₁² / 4 = ${nf(AG)} mm²`,`p = F_G / A₁ = ${nf(FG)} / ${nf(AG)} = ${nf(p/10)} N/mm² = ${nf(p)} bar`],'1 N/mm² = 10 bar.'),STP('Welche Kraft liefert der Nehmerzylinder?',FN,'N',[`A₂ = π · d₂² / 4 = ${nf(AN)} mm²`,`F_N = p · A₂ = ${nf(p/10)} · ${nf(AN)} = ${nf(FN)} N`],'Der Druck ist überall gleich: F₂ = p · A₂.'),STP('Wie groß ist der Weg des Nehmerkolbens?',sN,'mm',[`Das verdrängte Volumen ist gleich: A₁ · s₁ = A₂ · s₂`,`s₂ = ${sG} · ${nf(AG)} / ${nf(AN)} = ${nf(sN)} mm`],'Das Volumen bleibt gleich: Der größere Kolben bewegt sich weniger weit.')]}}],
['Vakuumheber für Blechtafeln',r=>{const dp=rg(r,.4,.8,.1),d=rg(r,60,120,10),n=pk(r,[2,3,4]),S=pk(r,[2,2.5,3]),A=PI*d*d/4/100,F1=dp*1e5*(A/1e4),F=n*F1,mz=F/(S*9.81);return{intro:`Ein Vakuumheber hält Blechtafeln mit ${n} kreisförmigen Saugern (Durchmesser je ${d} mm). Im Sauger herrscht ein Unterdruck von ${de(dp)} bar gegenüber der Umgebung. Als Sicherheit wird der Faktor ${de(S)} verlangt.`,steps:[STP('Wie groß ist die wirksame Fläche eines Saugers?',A,'cm²',[`A = π · d² / 4 = π · ${d}² / 4 = ${nf(A*100)} mm² = ${nf(A)} cm²`],'Kreisfläche mit d in mm, dann in cm² umrechnen (100 mm² = 1 cm²).'),STP('Welche Haltekraft hat ein Sauger?',F1,'N',[`F = Δp · A = ${de(dp)} bar · ${nf(A)} cm² = ${nf(dp*10*A)} N`],'1 bar = 10 N/cm².'),STP('Welche Haltekraft haben alle Sauger zusammen?',F,'N',[`F_ges = ${n} · ${nf(F1)} = ${nf(F)} N`],'Die Kräfte der Sauger addieren sich.'),STP('Welche Masse darf der Heber höchstens tragen?',mz,'kg',[`F_zul = F_ges / S = ${nf(F/S)} N`,`m = F_zul / g = ${nf(F/S)} / 9,81 = ${nf(mz)} kg`],'Erst durch die Sicherheit teilen, dann durch g.')]}}],
['Werkstück auf dem Drehteller',r=>{const mu=rg(r,.2,.5,.05),R=rg(r,.2,.6,.05),m=rg(r,.5,5,.5),v=Math.sqrt(mu*9.81*R),w=v/R,n=w*60/(2*PI),F=mu*m*9.81;return{intro:`Ein Werkstück (${de(m)} kg) liegt im Abstand r = ${de(R)} m von der Drehachse auf einem Drehteller. Die Haftreibungszahl beträgt μ₀ = ${de(mu)}. Die Drehzahl wird langsam gesteigert, bis das Werkstück abrutscht.`,steps:[STP('Bei welcher Bahngeschwindigkeit rutscht das Werkstück ab?',v,'m/s',[`Zentripetalkraft F_z = Haftreibung F_R`,`m · v² / r = μ₀ · m · g ⇒ v = √(μ₀ · g · r)`,`v = √(${de(mu)} · 9,81 · ${de(R)}) = ${nf(v)} m/s`],'Die Haftreibung liefert die Zentripetalkraft. Die Masse kürzt sich.'),STP('Welche Winkelgeschwindigkeit entspricht das?',w,'rad/s',[`ω = v / r = ${nf(v)} / ${de(R)} = ${nf(w)} rad/s`],'v = ω · r.'),STP('Welche Drehzahl in U/min ist das?',n,'U/min',[`n = ω · 60 / (2π) = ${nf(w)} · 60 / 6,283 = ${nf(n)} U/min`],'Eine Umdrehung entspricht 2π rad, eine Minute 60 s.'),STP('Wie groß ist die Zentripetalkraft kurz vor dem Rutschen?',F,'N',[`F_z = F_R = μ₀ · m · g = ${de(mu)} · ${de(m)} · 9,81 = ${nf(F)} N`],'Kurz vor dem Rutschen ist die Zentripetalkraft gleich der maximalen Haftreibung.')]}}],
['Pneumatikzylinder: Kolbenkraft und Luftverbrauch',r=>{const d=pk(r,[32,40,50,63]),p=rg(r,4,8,.5),s=rg(r,100,300,50),n=rg(r,10,40,5),A=PI*d*d/4/100,F=p*10*A,V=A*s/10/1000*(p+1),Q=V*n;return{intro:`Ein einfachwirkender Pneumatikzylinder (Kolbendurchmesser ${d} mm, Hub ${s} mm) arbeitet mit einem Überdruck von ${de(p)} bar und macht ${n} Hübe pro Minute. Umgebungsdruck 1 bar, Reibung wird vernachlässigt. Gezählt wird nur der Ausfahrhub.`,steps:[STP('Wie groß ist die Kolbenfläche?',A,'cm²',[`A = π · d² / 4 = π · ${d}² / 4 = ${nf(A*100)} mm² = ${nf(A)} cm²`],'Fläche in mm² berechnen und durch 100 teilen.'),STP('Welche Kolbenkraft entsteht beim Ausfahren?',F,'N',[`F = p_e · A = ${de(p)} bar · ${nf(A)} cm² = ${de(p)} · 10 N/cm² · ${nf(A)} cm² = ${nf(F)} N`],'1 bar = 10 N/cm².'),STP('Wie viel Luft (im Ansaugzustand) braucht ein Hub?',V,'l',[`V_Zylinder = A · s = ${nf(A)} cm² · ${s/10} cm = ${nf(A*s/10)} cm³`,`Verbrauch = V · (p_e + p_amb) / p_amb = ${nf(A*s/10/1000)} l · ${de(p+1)} = ${nf(V)} l`],'Die Luft wird auf den Betriebsdruck verdichtet. Faktor (p_e + 1 bar) / 1 bar.'),STP('Wie hoch ist der Luftverbrauch pro Minute?',Q,'l/min',[`Q = V · n = ${nf(V)} · ${n} = ${nf(Q)} l/min`],'Verbrauch je Hub mal Hübe pro Minute.')]}}],
['Verlängerungskabel am Schweißgerät: Spannungsfall',r=>{const P=rg(r,2000,3200,200),L=rg(r,20,50,5),A=pk(r,[1.5,2.5]),U=230,rho=.0178,I=P/U,Rl=rho*2*L/A,dU=Rl*I,pc=dU/U*100,Rdev=U*U/P,Pr=(U-dU)**2/Rdev;return{intro:`Ein Schweißgerät (Bemessungsleistung ${P} W bei ${U} V) wird über ein Kupferkabel mit ${L} m Länge und ${de(A)} mm² Querschnitt angeschlossen (spezifischer Widerstand ρ = 0,0178 Ω·mm²/m). Hin- und Rückleiter werden mitgerechnet. Zulässig ist ein Spannungsfall von 3 %.`,steps:[STP('Welcher Strom fließt bei Bemessungsleistung?',I,'A',[`I = P / U = ${P} / ${U} = ${nf(I)} A`],'P = U · I.'),STP('Wie groß ist der Leitungswiderstand?',Rl,'Ω',[`R_L = ρ · 2L / A = 0,0178 · ${2*L} / ${de(A)} = ${nf(Rl)} Ω`],'Der Strom fließt hin und zurück, also gilt die doppelte Länge.'),STP('Wie groß ist der Spannungsfall auf der Leitung?',dU,'V',[`ΔU = R_L · I = ${nf(Rl)} · ${nf(I)} = ${nf(dU)} V`],'Ohmsches Gesetz an der Leitung.'),STP('Wie viel Prozent der Spannung gehen auf der Leitung verloren?',pc,'%',[`ΔU / U = ${nf(dU)} / ${U} = ${nf(pc)} %`,pc<=3?'Das liegt innerhalb der Toleranz von 3 %.':'Das liegt über der Toleranz von 3 %. Die Leitung ist zu dünn oder zu lang.'],'Prozent = Teil durch Ganzes mal 100.'),STP('Welche Leistung nimmt das Gerät tatsächlich auf?',Pr,'W',[`Geräte-Widerstand R = U² / P = ${nf(Rdev)} Ω`,`U_K = ${U} − ${nf(dU)} = ${nf(U-dU)} V`,`P = U_K² / R = ${nf(Pr)} W`],'An den Klemmen liegt weniger Spannung. Der Geräte-Widerstand bleibt gleich.')]}}],
['Abschrecken im Wasserbad: Mischungstemperatur',r=>{const ms=rg(r,2,6),c1=.49,t1=rg(r,780,860,20),mw=rg(r,40,80,10),c2=4.18,t2=rg(r,15,25),tm=(ms*c1*t1+mw*c2*t2)/(ms*c1+mw*c2),Q=mw*c2*(tm-t2);return{intro:`Ein Stahlteil (m₁ = ${ms} kg, c₁ = 0,49 kJ/(kg·K), ϑ₁ = ${t1} °C) wird in ${mw} kg Wasser (c₂ = 4,18 kJ/(kg·K), ϑ₂ = ${t2} °C) abgeschreckt. Wärmeverluste an die Umgebung werden vernachlässigt.`,steps:[STP('Wie groß ist die Wärmekapazität m₁ · c₁ des Stahlteils?',ms*c1,'kJ/K',[`m₁ · c₁ = ${ms} · 0,49 = ${nf(ms*c1)} kJ/K`],'Wärmekapazität = Masse mal spezifische Wärmekapazität.'),STP('Wie groß ist die Wärmekapazität m₂ · c₂ des Wassers?',mw*c2,'kJ/K',[`m₂ · c₂ = ${mw} · 4,18 = ${nf(mw*c2)} kJ/K`],'Gleiche Rechnung für das Wasser.'),STP('Welche Mischungstemperatur ϑ_m stellt sich ein?',tm,'°C',[`ϑ_m = (m₁c₁ϑ₁ + m₂c₂ϑ₂) / (m₁c₁ + m₂c₂)`,`= (${nf(ms*c1)} · ${t1} + ${nf(mw*c2)} · ${t2}) / (${nf(ms*c1)} + ${nf(mw*c2)}) = ${nf(tm)} °C`],'Abgegebene Wärme gleich aufgenommene Wärme: m₁c₁(ϑ₁ − ϑ_m) = m₂c₂(ϑ_m − ϑ₂).',{abs:.5}),STP('Wie viel Wärme nimmt das Wasser dabei auf?',Q,'kJ',[`Q = m₂ · c₂ · (ϑ_m − ϑ₂) = ${nf(mw*c2)} · ${nf(tm-t2)} = ${nf(Q)} kJ`],'Q = m · c · ΔT für das Wasser.')]}}],
['Auslegerkran: Gegengewicht und Standkraft',r=>{const mL=rg(r,400,1200,100),a=rg(r,3,6),b=rg(r,1.5,3,.5),mG=mL*a/b,ML=mL*9.81*a/1000,Ft=(mL+mG)*9.81/1000,Mg=mG*9.81*b/1000;return{intro:`Bei einem Auslegerkran hängt die Last (${mL} kg) ${de(a)} m vom Drehpunkt des Turms entfernt. Auf der anderen Seite sitzt das Gegengewicht im Abstand ${de(b)} m vom Drehpunkt. Das Eigengewicht des Auslegers wird nicht beachtet.`,steps:[STP('Welches Drehmoment erzeugt die Last um den Turm?',ML,'kN·m',[`M_L = F_L · a = ${mL} · 9,81 · ${de(a)} = ${nf(ML*1000)} N·m = ${nf(ML)} kN·m`],'Drehmoment = Kraft mal Hebelarm. Kraft = m · g.'),STP('Welche Masse muss das Gegengewicht für Momentengleichgewicht haben?',mG,'kg',[`F_L · a = F_G · b ⇒ m_G = m_L · a / b = ${mL} · ${de(a)} / ${de(b)} = ${nf(mG)} kg`],'Hebelgesetz: linksdrehendes Moment gleich rechtsdrehendes Moment.'),STP('Welche senkrechte Kraft muss der Turm insgesamt tragen?',Ft,'kN',[`F = (m_L + m_G) · g = (${mL} + ${nf(mG)}) · 9,81 = ${nf(Ft*1000)} N = ${nf(Ft)} kN`],'Beide Massen drücken auf den Turm.'),STP('Welches Moment wirkt auf den Turm, wenn die Last abgenommen wird?',Mg,'kN·m',[`M = F_G · b = ${nf(mG*9.81)} N · ${de(b)} m = ${nf(Mg)} kN·m`,'Es ist genauso groß wie vorher das Lastmoment, aber in die andere Richtung.'],'Jetzt wirkt nur noch das Gegengewicht.')]}}],
['Last an zwei Seilen: Kräftezerlegung',r=>{const m=rg(r,200,1000,100),al=rg(r,30,60,5),G=m*9.81,Fy=G/2,Fs=Fy/Math.sin(al*PI/180),Fx=Fs*Math.cos(al*PI/180);return{intro:`Eine Last (${m} kg) hängt symmetrisch an zwei Seilen. Jedes Seil bildet mit der Waagerechten den Winkel α = ${al}°.`,steps:[STP('Wie groß ist die Gewichtskraft G?',G,'N',[`G = m · g = ${m} · 9,81 = ${nf(G)} N`],'G = m · g.'),STP('Welche senkrechte Kraftkomponente F_y muss jedes Seil tragen?',Fy,'N',[`Zwei Seile teilen sich das Gewicht: F_y = G / 2 = ${nf(Fy)} N`],'Bei symmetrischer Aufhängung trägt jedes Seil die Hälfte der Gewichtskraft senkrecht.'),STP('Wie groß ist die Seilkraft F_S?',Fs,'N',[`F_y = F_S · sin α ⇒ F_S = F_y / sin α`,`= ${nf(Fy)} / sin ${al}° = ${nf(Fs)} N`],'Die senkrechte Komponente ist die Gegenkathete: F_y = F_S · sin α.'),STP('Wie groß ist die waagerechte Komponente F_x in jedem Seil?',Fx,'N',[`F_x = F_S · cos α = ${nf(Fs)} · cos ${al}° = ${nf(Fx)} N`,'Die beiden F_x heben sich gegenseitig auf und ziehen die Aufhängepunkte nach innen.'],'Waagerechte Komponente: F_x = F_S · cos α.')]}}],
['Energiespeicher: Wirkungsgradkette',r=>{const Ei=rg(r,20,80,5),e1=rg(r,92,98),e2=rg(r,88,95),e3=rg(r,94,98),P=rg(r,5,20,1),eg=e1*e2*e3/1e6,Eo=Ei*eg,Ev=Ei-Eo,t=Eo/P;return{intro:`Ein Batteriespeicher wird mit ${Ei} kWh aus dem Netz geladen. Auf dem Weg arbeiten das Ladegerät (η₁ = ${e1} %), die Batterie (η₂ = ${e2} %) und der Wechselrichter (η₃ = ${e3} %). Anschließend versorgt er eine Maschine mit ${P} kW.`,steps:[STP('Wie groß ist der Gesamtwirkungsgrad?',eg*100,'%',[`η_ges = η₁ · η₂ · η₃ = ${e1/100} · ${e2/100} · ${e3/100} = ${nf(eg,4)} = ${nf(eg*100)} %`],'Wirkungsgrade hintereinander werden multipliziert (als Dezimalzahl).',{abs:.3}),STP('Wie viel Energie steht am Ende nutzbar zur Verfügung?',Eo,'kWh',[`E_nutz = E_zu · η_ges = ${Ei} · ${nf(eg,4)} = ${nf(Eo)} kWh`],'W_ab = W_zu · η.'),STP('Wie viel Energie geht als Verlust (Wärme) verloren?',Ev,'kWh',[`E_Verlust = ${Ei} − ${nf(Eo)} = ${nf(Ev)} kWh`],'Zugeführte minus nutzbare Energie.'),STP('Wie lange kann die Maschine damit laufen?',t,'h',[`t = E / P = ${nf(Eo)} kWh / ${P} kW = ${nf(t)} h`],'Zeit = Energie durch Leistung.')]}}],
['Palette im Hochregal: Lageenergie und Fall',r=>{const m=rg(r,80,400,20),h=rg(r,6,14),t=rg(r,20,60,5),E=m*9.81*h,P=E/t,v=Math.sqrt(2*9.81*h),vh=Math.sqrt(2*9.81*h/2);return{intro:`Ein Regalbediengerät hebt eine Palette (${m} kg) in ${t} s auf ${h} m Höhe.`,steps:[STP('Welche Lageenergie hat die Palette oben?',E,'J',[`E_pot = m · g · h = ${m} · 9,81 · ${h} = ${nf(E)} J`],'Lageenergie = Gewichtskraft mal Höhe.'),STP('Welche mechanische Leistung wird beim Heben erbracht?',P,'W',[`P = E_pot / t = ${nf(E)} / ${t} = ${nf(P)} W`],'Leistung = Arbeit durch Zeit.'),STP('Mit welcher Geschwindigkeit würde die Palette beim freien Fall unten aufschlagen?',v,'m/s',[`E_pot = E_kin ⇒ v = √(2 · g · h) = √(2 · 9,81 · ${h}) = ${nf(v)} m/s`],'Die Lageenergie wird vollständig in Bewegungsenergie umgewandelt.'),STP('Wie schnell ist sie nach der halben Fallhöhe?',vh,'m/s',[`Gefallene Höhe: ${nf(h/2)} m`,`v = √(2 · g · ${nf(h/2)}) = ${nf(vh)} m/s`],'Es sind erst h/2 gefallen.')]}}],
['Pufferfeder am Ende der Rollenbahn',r=>{const m=rg(r,2,8),v=rg(r,.5,2.5,.5),R=rg(r,2000,8000,500),Ek=.5*m*v*v,s=v*Math.sqrt(m/R),F=R*s;return{intro:`Am Ende einer Rollenbahn fängt eine Pufferfeder (Federrate R = ${R} N/m) eine Kiste (${m} kg) ab, die mit ${de(v)} m/s ankommt. Reibung wird vernachlässigt.`,steps:[STP('Wie groß ist die Bewegungsenergie der Kiste?',Ek,'J',[`E_kin = ½ · m · v² = 0,5 · ${m} · ${de(v)}² = ${nf(Ek)} J`],'Bewegungsenergie: ½ · m · v².'),STP('Wie weit wird die Feder zusammengedrückt?',s*100,'cm',[`E_kin = E_Feder ⇒ ½ · m · v² = ½ · R · s²`,`s = v · √(m / R) = ${de(v)} · √(${m} / ${R}) = ${nf(s)} m = ${nf(s*100)} cm`],'Die gesamte Bewegungsenergie steckt zum Schluss in der Spannenergie ½ · R · s².'),STP('Welche größte Federkraft tritt auf?',F,'N',[`F = R · s = ${R} · ${nf(s)} = ${nf(F)} N`],'Hooke: F = R · s.'),STP('Wie weit wird die Feder bei doppelter Geschwindigkeit zusammengedrückt?',2*s*100,'cm',[`s ist proportional zu v ⇒ s₂ = 2 · ${nf(s*100)} cm = ${nf(2*s*100)} cm`],'Die Formel s = v · √(m/R) ist linear in v.')]}}],
['Notstromaggregat: Wirkungsgrad',r=>{const V=rg(r,6,25),eg=rg(r,28,40),Qz=.83*V*42000/3600,Pe=Math.round(Qz*eg/100*2)/2,e=Pe/Qz*100,Pv=Qz-Pe;return{intro:`Ein Dieselaggregat verbraucht ${V} Liter Diesel pro Stunde (ρ = 0,83 kg/l, Heizwert H_i = 42 000 kJ/kg) und gibt dabei eine elektrische Leistung von ${de(Pe)} kW ab.`,steps:[STP('Welche Leistung wird dem Motor mit dem Brennstoff zugeführt?',Qz,'kW',[`ṁ = ρ · V̇ = 0,83 · ${V} = ${nf(.83*V)} kg/h`,`P_zu = ṁ · H_i = ${nf(.83*V)} kg/h · 42 000 kJ/kg / 3600 s/h = ${nf(Qz)} kW`],'Stündliche Brennstoffmasse mal Heizwert, geteilt durch 3600 s/h.'),STP('Wie groß ist der Gesamtwirkungsgrad?',e,'%',[`η = P_el / P_zu = ${de(Pe)} / ${nf(Qz)} = ${nf(e/100,4)} = ${nf(e)} %`],'η = Nutzen durch Aufwand.',{abs:.5}),STP('Wie groß ist die Verlustleistung (hauptsächlich Abwärme)?',Pv,'kW',[`P_V = P_zu − P_el = ${nf(Qz)} − ${de(Pe)} = ${nf(Pv)} kW`],'Energieerhaltung: Zufuhr = Nutzen + Verlust.')]}}],
['Ausschuss je Schicht: Kennwerte aus Strichliste',r=>{const n=20,N=rg(r,400,800,50),v=[...Array(n)].map(()=>rg(r,0,7)),d=SS(v),q=d.sum/(n*N)*100;return{intro:`In ${n} Schichten wurde jeweils der Ausschuss (Stückzahl) gezählt: ${v.join('; ')}. In jeder Schicht werden ${N} Teile gefertigt.`,steps:[STP('Wie groß ist die Summe aller Ausschussteile?',d.sum,'Stück',[`Σx = ${v.join(' + ')} = ${d.sum}`],'Alle Werte addieren.',{abs:.01}),STP('Wie groß ist der Mittelwert x̄ je Schicht?',d.m,'Stück',[`x̄ = Σx / n = ${d.sum} / ${n} = ${nf(d.m)}`],'Summe durch Anzahl der Werte.'),STP('Wie groß ist die Spannweite R?',d.R,'Stück',[`R = x_max − x_min = ${d.v[n-1]} − ${d.v[0]} = ${d.R}`],'Größter minus kleinster Wert.',{abs:.01}),STP('Wie groß ist der Median?',d.md,'Stück',[`Sortiert: ${d.v.join('; ')}`,`Bei gerader Anzahl: Mittel der 10. und 11. Zahl = (${d.v[9]} + ${d.v[10]}) / 2 = ${nf(d.md)}`],'Werte sortieren. Bei gerader Anzahl den Mittelwert der beiden mittleren Werte bilden.',{abs:.01}),STP('Wie groß ist die Ausschussquote in Prozent?',q,'%',[`Ausschuss gesamt: ${d.sum}`,`Teile gesamt: ${n} · ${N} = ${n*N}`,`Quote = ${d.sum} / ${n*N} · 100 % = ${nf(q)} %`],'Quote = Ausschussteile durch gefertigte Teile mal 100 %.')]}}],
['Stichprobenkontrolle: Fehler je Stichprobe',r=>{const n=25,ns=pk(r,[100,150,200]),N=rg(r,600,1200,100),v=[...Array(n)].map(()=>rg(r,1,8)),d=SS(v),fa=d.m/ns*100,ft=d.m/ns*N;return{intro:`Bei einer Stichprobenprüfung mit je ${ns} Teilen wurden in ${n} Stichproben folgende Fehlerzahlen gefunden: ${v.join('; ')}. Die Tagesproduktion beträgt ${N} Teile.`,steps:[STP('Wie viele Fehler wurden insgesamt gefunden?',d.sum,'',[`Σx = ${d.sum}`],'Alle Fehlerzahlen addieren.',{abs:.01}),STP('Wie groß ist die durchschnittliche Fehlerzahl x̄ je Stichprobe?',d.m,'',[`x̄ = ${d.sum} / ${n} = ${nf(d.m)}`],'Summe durch Anzahl der Stichproben.'),STP('Wie groß ist die Spannweite R?',d.R,'',[`R = x_max − x_min = ${d.v[n-1]} − ${d.v[0]} = ${d.R}`],'Größter minus kleinster Wert.',{abs:.01}),STP('Wie hoch ist der durchschnittliche Fehleranteil?',fa,'%',[`p = x̄ / n_Stichprobe = ${nf(d.m)} / ${ns} = ${nf(fa/100,4)} = ${nf(fa)} %`],'Fehleranteil = durchschnittliche Fehler durch Stichprobenumfang.'),STP('Mit wie vielen fehlerhaften Teilen ist in der Tagesproduktion zu rechnen?',ft,'',[`Fehler/Tag = p · N = ${nf(fa/100,4)} · ${N} = ${nf(ft)}`],'Fehleranteil mal Tagesproduktion.')]}}],
['Dosieranlage: Prozessfähigkeit',r=>{const nom=pk(r,[20,50,100]),tp=pk(r,[1,2]),tm=pk(r,[.5,1]),U=nom-tm,O=nom+tp,T=O-U,cp=rg(r,1,1.8,.1),sd=T/(6*cp),M=(O+U)/2,mu=M+rg(r,-.2,.2,.05)*T,Cp=T/(6*sd),Ck=Math.min(O-mu,mu-U)/(3*sd),dm=mu-M;return{intro:`Eine Dosieranlage füllt Klebstoff. Das Sollmaß ist ${nom} g mit den Grenzen USG = ${de(U)} g und OSG = ${de(O)} g. Die Messreihe ergibt x̄ = ${de(mu)} g und s = ${de(+sd.toFixed(3))} g.`,steps:[STP('Wie groß ist die Toleranz T?',T,'g',[`T = OSG − USG = ${de(O)} − ${de(U)} = ${de(T)} g`],'Obere minus untere Grenze.'),STP('Wie groß ist die Prozessfähigkeit Cp?',T/(6*(+sd.toFixed(3))),'',[`Cp = T / (6 · s) = ${de(T)} / (6 · ${de(+sd.toFixed(3))}) = ${nf(T/(6*(+sd.toFixed(3))))}`],'Toleranz durch die sechsfache Standardabweichung.'),STP('Wie groß ist Cpk?',Math.min(O-mu,mu-U)/(3*(+sd.toFixed(3))),'',[`Abstand zur nächsten Grenze: min(${nf(O-mu)}; ${nf(mu-U)}) = ${nf(Math.min(O-mu,mu-U))} g`,`Cpk = ${nf(Math.min(O-mu,mu-U))} / (3 · ${de(+sd.toFixed(3))}) = ${nf(Math.min(O-mu,mu-U)/(3*(+sd.toFixed(3))))}`],'Cpk = kleinster Abstand von x̄ zu einer Grenze, geteilt durch 3 · s.'),STP('Wie weit liegt der Mittelwert von der Toleranzmitte entfernt (Betrag)?',Math.abs(dm),'g',[`Toleranzmitte = (OSG + USG) / 2 = ${nf(M)} g`,`|x̄ − Mitte| = ${nf(Math.abs(dm))} g`],'Mitte der Toleranz ist der Mittelwert von OSG und USG.',{abs:.02})]}}],
['Zwei Heizstäbe parallel: Stromaufteilung',r=>{const k=pk(r,[2,3]),U=pk(r,[24,48,230]),I=rg(r,2,10,.5),Rp=U/I,R2=Rp*(k+1)/k,R1=k*R2,P1=U*U/R1,P2=U*U/R2,Ir=U/(R1+R2),Pr=U*Ir;return{intro:`Zwei Heizstäbe R₁ und R₂ liegen parallel an ${U} V. Der Widerstand R₁ ist ${k}-mal so groß wie R₂. Der Gesamtstrom beträgt ${de(I)} A.`,steps:[STP('Wie groß ist der Gesamtwiderstand der Schaltung?',Rp,'Ω',[`R_ges = U / I_ges = ${U} / ${de(I)} = ${nf(Rp)} Ω`],'Ohmsches Gesetz mit dem Gesamtstrom.'),STP('Wie groß ist R₂?',R2,'Ω',[`R_ges = R₁ · R₂ / (R₁ + R₂) mit R₁ = ${k} · R₂`,`R_ges = ${k} · R₂ / ${k+1} ⇒ R₂ = R_ges · ${k+1} / ${k} = ${nf(R2)} Ω`],'Setze R₁ = k · R₂ in die Parallelformel ein und löse nach R₂ auf.'),STP('Wie groß ist die Leistung im Widerstand R₁?',P1,'W',[`R₁ = ${k} · ${nf(R2)} = ${nf(R1)} Ω`,`P₁ = U² / R₁ = ${U}² / ${nf(R1)} = ${nf(P1)} W`],'Bei Parallelschaltung liegt an jedem Widerstand die volle Spannung: P = U² / R.'),STP('Welcher Strom fließt, wenn beide Heizstäbe in Reihe geschaltet werden?',Ir,'A',[`R_Reihe = R₁ + R₂ = ${nf(R1+R2)} Ω`,`I = U / R_Reihe = ${nf(Ir)} A`],'In Reihe addieren sich die Widerstände.'),STP('Welche Gesamtleistung ergibt sich in der Reihenschaltung?',Pr,'W',[`P = U · I = ${U} · ${nf(Ir)} = ${nf(Pr)} W`],'P = U · I mit dem Reihenstrom.')]}}],
['Zwei Zugkräfte am Haken: Kräfteparallelogramm',r=>{const F1=rg(r,200,600,50),F2=rg(r,200,600,50),Fr=Math.hypot(F1,F2),al=Math.atan(F2/F1)*180/PI,pct=(Fr/Math.max(F1,F2)-1)*100;return{intro:`An einem Ringhaken ziehen zwei Seile im rechten Winkel zueinander: Seil 1 waagerecht mit F₁ = ${F1} N, Seil 2 senkrecht nach oben mit F₂ = ${F2} N.`,steps:[STP('Wie groß ist die resultierende Kraft F_Res?',Fr,'N',[`F_Res = √(F₁² + F₂²) = √(${F1}² + ${F2}²) = ${nf(Fr)} N`],'Rechtwinkliges Kräfteparallelogramm: Satz des Pythagoras.'),STP('Unter welchem Winkel zur Waagerechten wirkt F_Res?',al,'°',[`tan α = F₂ / F₁ = ${F2} / ${F1} ⇒ α = ${nf(al)}°`],'Gegenkathete F₂, Ankathete F₁: tan α = G / A.',{abs:.3}),STP('Um wie viel Prozent ist F_Res größer als die größere Einzelkraft?',pct,'%',[`${nf(Fr)} / ${Math.max(F1,F2)} − 1 = ${nf(pct/100,4)} = ${nf(pct)} %`],'Prozentualer Anstieg = (neu / alt − 1) · 100 %.',{abs:.5})]}}]
];
/* Muendliche Pruefung */
const ORAL=[
['Chemie','Was versteht man unter Oxidation? Wie heißt das Reaktionsprodukt?','Oxidation ist die Reaktion eines Stoffes mit Sauerstoff, allgemeiner die Abgabe von Elektronen (die Oxidationszahl steigt). Das Produkt ist ein Oxid, z. B. 2 Mg + O₂ → 2 MgO.'],
['Chemie','Erkläre FeO + C → Fe + CO. Welche Rolle hat der Kohlenstoff?','Eisen(II)-oxid wird zu Eisen reduziert, es gibt seinen Sauerstoff ab. Kohlenstoff nimmt den Sauerstoff auf und wird zu Kohlenmonoxid oxidiert. Kohlenstoff ist das Reduktionsmittel, FeO das Oxidationsmittel. Beide Vorgänge laufen gleichzeitig ab (Redoxreaktion, Hochofenprozess).'],
['Chemie','Was ist ein Reduktionsmittel, was ein Oxidationsmittel? Beispiel Fe₂O₃ + 2 Al → 2 Fe + Al₂O₃','Das Reduktionsmittel gibt Elektronen ab (nimmt Sauerstoff auf) und wird dabei selbst oxidiert. Das Oxidationsmittel nimmt Elektronen auf (gibt Sauerstoff ab) und wird reduziert. Hier ist Aluminium das Reduktionsmittel und Eisen(III)-oxid das Oxidationsmittel (Thermitverfahren).'],
['Chemie','Wie unterscheidet man Säuren von Laugen? Welchen pH-Wert hat destilliertes Wasser?','Mit Indikatoren (Lackmus, Universalindikator) oder einem pH-Messgerät: Säuren haben pH < 7, Laugen pH > 7. Destilliertes Wasser ist neutral mit pH 7. Die pH-Skala reicht üblicherweise von 0 bis 14.'],
['Chemie','Ordne zu: Na₂SO₄, H₃PO₄, KOH, CuCl₂, H₂CO₃, Ca(OH)₂. Säure, Lauge oder Salz?','Säuren: H₃PO₄ (Phosphorsäure) und H₂CO₃ (Kohlensäure). Laugen: KOH (Kalilauge) und Ca(OH)₂ (Kalkwasser). Salze: Na₂SO₄ (Natriumsulfat) und CuCl₂ (Kupferchlorid). Merkhilfe: Säuren beginnen meist mit H, Laugen enden auf OH.'],
['Chemie','Wie entsteht Saurer Regen und welche Folgen hat er?','Schwefeldioxid und Stickstoffoxide aus Verbrennungen lösen sich im Regenwasser zu schwefliger Säure und Salpetersäure. Der pH-Wert fällt unter etwa 5,6. Folgen: schnellere Korrosion von Metallen, Angriff auf Kalkstein und Beton, schnellere Alterung von Kunststoffen, Schäden an Wald und Boden.'],
['Chemie','Beschreibe einen Vorgang, bei dem eine Säure entsteht.','Nichtmetalloxide reagieren mit Wasser zu Säuren, zum Beispiel SO₂ + H₂O → H₂SO₃ (schweflige Säure) oder CO₂ + H₂O → H₂CO₃ (Kohlensäure). Auch Chlorwasserstoff ergibt in Wasser Salzsäure.'],
['Chemie','Was ist elektrochemische Korrosion? Was passiert bei verletzter Zink- oder Zinnschicht auf Eisen?','Zwei Metalle mit unterschiedlichem Potenzial sind leitend verbunden, ein Elektrolyt (z. B. Regenwasser) schließt den Stromkreis. Das unedlere Metall ist die Anode und löst sich auf. Zink ist unedler als Eisen: Zink löst sich auf und schützt das Eisen (Opferanode). Zinn ist edler als Eisen: Das Eisen löst sich unter der Schicht auf (Unterrostung).'],
['Chemie','Welche Voraussetzungen hat Korrosion und wie schützt man sich?','Voraussetzungen: Metall, Sauerstoff und Feuchtigkeit (Elektrolyt), bei Kontaktkorrosion zwei verschiedene Metalle. Schutz: geeignete Werkstoffwahl (z. B. Edelstahl), Beschichten (Lackieren, Verzinken, Einölen), Spalten und Wasseransammlungen vermeiden, trocken lagern, Opferanoden.'],
['Chemie','Was ist die Anomalie des Wassers?','Wasser hat bei 4 °C seine größte Dichte. Beim weiteren Abkühlen dehnt es sich aus. Eis ist leichter als Wasser und schwimmt. Folge: Gewässer frieren von oben zu, gefrierende Rohre können platzen.'],
['Chemie','Was ist ein Lösungsmittel? Welche Mineralstoffe enthält Leitungswasser?','Ein Lösungsmittel löst oder verdünnt andere Stoffe ohne chemische Reaktion (Lösen ist ein physikalischer Vorgang), Wasser ist das wichtigste. Leitungswasser enthält z. B. Calcium-, Magnesium-, Natrium- und Kalium-Ionen sowie Chloride, Sulfate und Hydrogencarbonate.'],
['Chemie','2 H₂ + O₂ → 2 H₂O: Welche Reaktionsart ist das und warum muss die Gleichung ausgeglichen sein?','Es ist eine Synthese (Verbrennung von Wasserstoff, exotherm) und zugleich eine Redoxreaktion. Ausgeglichen muss sie sein, weil keine Atome verloren gehen (Massenerhaltung): links 4 H und 2 O, rechts 4 H und 2 O.'],
['Chemie','Was bewirkt der Wasserstoff in CuO + H₂ → Cu + H₂O?','Wasserstoff nimmt den Sauerstoff vom Kupferoxid auf und wird zu Wasser oxidiert, das Kupferoxid wird zu Kupfer reduziert. Wasserstoff ist hier das Reduktionsmittel, CuO das Oxidationsmittel.'],
['Chemie','Beschreibe die Aggregatzustände und ihre Übergänge.','Fest (Teilchen an festen Plätzen), flüssig (Teilchen verschiebbar), gasförmig (frei beweglich, große Abstände). Übergänge: Schmelzen und Erstarren (fest und flüssig), Verdampfen und Kondensieren (flüssig und gasförmig), Sublimieren und Resublimieren (fest und gasförmig).'],
['Physik','Wovon hängt die Längenänderung bei Temperaturänderung ab? Warum steht in der Volumenformel eine 3?','ΔL = α · L₀ · ΔT: Sie hängt von der Ausgangslänge, der Temperaturänderung und dem Werkstoff (α) ab. Das Volumen dehnt sich in drei Raumrichtungen aus: ΔV = γ · V₀ · ΔT mit γ ≈ 3 · α. Bei Gasen ist γ ≈ 1/273 K⁻¹.'],
['Physik','Erläutere die gleichförmige Bewegung und skizziere das v-t-Diagramm.','Die Geschwindigkeit ist konstant, es gibt keine Beschleunigung: s = v · t. Im v-t-Diagramm ist das eine waagerechte Gerade, im s-t-Diagramm eine ansteigende Gerade durch den Ursprung. Die Fläche unter der v-t-Linie ist der Weg.'],
['Physik','Was für eine Bewegung ist der freie Fall? Wie sieht das v-t-Diagramm aus?','Eine gleichmäßig beschleunigte Bewegung mit a = g ≈ 9,81 m/s²: v = g · t und s = ½ · g · t². Das v-t-Diagramm ist eine Ursprungsgerade, das s-t-Diagramm eine Parabel.'],
['Physik','Welche Reibungsarten gibt es und wovon hängt die Reibkraft ab?','Haftreibung, Gleitreibung und Rollreibung (Haft > Gleit > Roll). F_R = μ · F_N: Sie hängt von der Normalkraft und der Werkstoffpaarung (Reibungszahl) ab, nicht von der Größe der Auflagefläche.'],
['Physik','Ein Stahlkörper (100 kg) wird gleichmäßig über eine Stahlschiene gezogen. Wie bestimmst Du die Zugkraft?','Bei gleichmäßiger Bewegung ist die Zugkraft gleich der Gleitreibungskraft: F_Z = μ · F_N = μ · m · g. Mit F_N = 100 kg · 9,81 m/s² ≈ 981 N und der Gleitreibungszahl Stahl auf Stahl aus der Tabelle (etwa 0,1 bis 0,2) ergeben sich rund 100 bis 200 N.'],
['Physik','Zeichne die Kräfte an einer schiefen Ebene und erkläre ihre Bedeutung.','Gewichtskraft F_G senkrecht nach unten, Normalkraft F_N = F_G · cos α senkrecht zur Ebene, Hangabtriebskraft F_H = F_G · sin α parallel zur Ebene, dazu die Reibkraft F_R = μ · F_N gegen die Bewegung. Beim Hochschieben müssen F_H und F_R überwunden werden, beim Abrutschen halten Haftreibung und F_H sich die Waage.'],
['Physik','Wie berechnet man die Arbeit, wenn eine Last auf die Höhe h gebracht wird, direkt oder über eine schiefe Ebene?','Ohne Reibung ist die Arbeit gleich: W = m · g · h. Über die schiefe Ebene braucht man eine kleinere Kraft (F = F_G · h / l), dafür ist der Weg l länger. Mit Reibung ist die aufgewendete Arbeit größer (Goldene Regel der Mechanik).'],
['Physik','Was versteht man unter Druck? Formel und Einheiten?','Druck ist Kraft pro Fläche: p = F / A. Basiseinheit ist das Pascal (1 Pa = 1 N/m²), gebräuchlich sind bar (1 bar = 10⁵ Pa) und mbar bzw. hPa.'],
['Physik','Wo spielen F₁/A₁ = F₂/A₂ und Q = v₁ · A₁ = v₂ · A₂ eine Rolle?','Die erste Gleichung beschreibt die Hydraulik (Presse, Bremsanlage): Der Druck ist überall gleich, kleine Kraft auf kleine Fläche ergibt große Kraft auf große Fläche. Die zweite ist die Kontinuitätsgleichung für strömende Flüssigkeiten und Gase: Wird der Querschnitt kleiner, steigt die Strömungsgeschwindigkeit.'],
['Physik','Erkläre den Wirkungsgrad: Formel, Einheit, größtmöglicher Wert.','η = P_ab / P_zu = W_nutz / W_zu. Er hat keine Einheit (oder wird in % angegeben) und ist immer kleiner als 1 bzw. 100 %, weil immer Verluste (meist Wärme) auftreten.'],
['Physik','Was bedeuten c(Wasser) = 4,19 J/(g·K) und c(Eisen) = 0,49 J/(g·K) für die Erwärmung von je 1 kg?','Q = m · c · ΔT: Wasser braucht pro Kelvin etwa 8,5-mal mehr Energie als Eisen (4,19 / 0,49). Wasser erwärmt sich langsam, speichert aber viel Wärme, Eisen erwärmt sich schnell.'],
['Physik','Was geschieht an den Haltepunkten der Erwärmungskurve von Wasser?','Bei 0 °C (Schmelzen) und bei 100 °C (Verdampfen) bleibt die Temperatur trotz Wärmezufuhr konstant. Die Energie wird für den Phasenwechsel gebraucht (Q = m · q_s bzw. m · q_v), nicht für eine höhere Temperatur.'],
['Physik','Zwei Kräfte unterschiedlicher Größe und Richtung greifen an einem Punkt an. Wie bestimmt man die Resultierende?','Zeichnerisch mit dem Kräfteparallelogramm (oder Kräftedreieck) im Kräftemaßstab, rechnerisch durch Zerlegen in Komponenten und vektorielles Addieren. Bei 90° zwischen den Kräften gilt F_res = √(F₁² + F₂²).'],
['Physik','Auf einer Wippe sitzen drei Personen im Gleichgewicht. Wie lautet die Momentengleichung?','Die Summe der linksdrehenden Momente ist gleich der Summe der rechtsdrehenden Momente: ΣM_links = ΣM_rechts, zum Beispiel F₁ · l₁ = F₂ · l₂ + F₃ · l₃ mit F = m · g.'],
['Physik','Ist die Aussage richtig: Leistung ist Arbeitsgeschwindigkeit?','Ja, im Sinn von Arbeit pro Zeit: P = W / t. Eine größere Leistung heißt, dass dieselbe Arbeit schneller verrichtet wird. Einheit ist das Watt (1 W = 1 J/s).'],
['Elektrotechnik','Welche Größe steht auf der Stromrechnung? Wie berechnen sich elektrische Arbeit und Leistung?','Abgerechnet wird die elektrische Arbeit in Kilowattstunden (kWh). W = P · t und P = U · I, also W = U · I · t. 1 kWh = 3,6 MJ.'],
['Elektrotechnik','Wie hängen die elektrischen Grundgrößen zusammen?','Ohmsches Gesetz U = R · I, Leistung P = U · I = I² · R = U² / R, Arbeit W = P · t. Einheiten: Volt, Ampere, Ohm, Watt.'],
['Elektrotechnik','Zwei Widerstände in Reihe beziehungsweise parallel: Welche Gesetze gelten? Wie sind Haushaltsgeräte geschaltet?','Reihe: gleicher Strom, Spannungen addieren sich, R_ges = R₁ + R₂. Parallel: gleiche Spannung, Ströme addieren sich, 1/R_ges = 1/R₁ + 1/R₂. Im Haushalt sind Verbraucher parallel geschaltet, damit jedes Gerät 230 V bekommt und unabhängig von den anderen arbeitet.'],
['Elektrotechnik','Unterscheide Gleichspannung und Wechselspannung.','Gleichspannung hat konstante Größe und Richtung (Batterie), Wechselspannung ändert periodisch Größe und Richtung (Sinusform, im Netz 50 Hz, 230 V Effektivwert, Drehstrom 400 V). Im Diagramm: waagerechte Linie bzw. Sinuskurve.'],
['Elektrotechnik','Wofür stehen die Schutzklassen I, II und III?','Schutzklasse I: Gehäuse mit Schutzleiter verbunden. Schutzklasse II: Schutzisolierung, kein Schutzleiter nötig (Zeichen: Doppelquadrat). Schutzklasse III: Schutzkleinspannung (z. B. bis 50 V Wechselspannung).'],
['Elektrotechnik','Unterschied zwischen Primär- und Sekundärenergie? Brennwert und Heizwert?','Primärenergie kommt direkt aus Quellen (Kohle, Erdöl, Erdgas, Sonne, Wind), Sekundärenergie entsteht durch Umwandlung (Strom, Benzin, Fernwärme). Der Heizwert ist die nutzbare Wärme ohne die Kondensationswärme des Wasserdampfs im Abgas, der Brennwert enthält sie und ist daher etwas größer.'],
['Statistik','Was zeigt die Gaußsche Glockenkurve? Wo liegen die Wendepunkte?','Die Normalverteilung der Messwerte um den Mittelwert. Sie ist symmetrisch, die Wendepunkte liegen bei x̄ ± s. Im Bereich ±1σ liegen etwa 68,3 %, bei ±2σ 95,4 % und bei ±3σ 99,73 % der Werte.'],
['Statistik','Wie bestimmt man aus einer Häufigkeitstabelle den Mittelwert und eine fehlende Häufigkeit?','x̄ = Σ(xᵢ · hᵢ) / Σhᵢ. Ist der Mittelwert bekannt, setzt man die unbekannte Häufigkeit als x an, stellt die Gleichung (Summe + Wert · x) / (n + x) = x̄ auf und löst nach x auf.'],
['Chemie','Was versteht man unter Neutralisation? Beschreibe 2 HNO₃ + Ca(OH)₂ → 2 H₂O + Ca(NO₃)₂ allgemein und sage, woran Du den Endpunkt erkennst.','Bei der Neutralisation heben sich Säure und Lauge in ihrer Wirkung gegenseitig auf. Allgemein: Säure + Lauge → Wasser + Salz. Hier reagieren Salpetersäure und Calciumhydroxid zu Wasser und Calciumnitrat. Der Endpunkt ist erreicht, wenn das pH-Messgerät 7 anzeigt. Mit Indikatoren: Lackmus wird violett, Phenolphthalein entfärbt sich gerade, wenn man eine Lauge mit Säure titriert.'],
['Chemie','Was ist chemische Korrosion? Nenne drei Schutzmaßnahmen in Lagerung, Fertigung oder Versand und die Reihenfolge beim Lackieren.','Bei chemischer Korrosion greifen Sauerstoff, Salze, Gase oder Säuren die Metalloberfläche an, es entsteht zum Beispiel ein Metalloxid wie Rost. Schutz: Lacküberzug, Korrosionsschutzöl, Wachsschicht, Einwickeln in Ölpapier. Lackierreihenfolge: Oberfläche reinigen und entfetten, Haftgrund auftragen, Lackgrundschicht, Lackdeckschicht.'],
['Chemie','Welche Ionen bestimmen die Wasserhärte? Warum ist hartes Wasser für Dampfkessel ungeeignet, und was ist VE-Wasser?','Calcium- und Magnesiumionen sind die Härtebildner. Beim Erhitzen fallen sie als schwer lösliche Salze (Kesselstein) aus. Der Belag leitet Wärme schlecht, die Leistung sinkt, und beim Abplatzen kann es zu Schäden bis zur Explosion kommen. VE-Wasser (vollentsalztes Wasser, Deionat) wird im Ionentauscher gewonnen: Die positiven Ionen werden durch Wasserstoffionen, die negativen durch Hydroxidionen ersetzt. Bei 0 bis 1,5 mmol/l gilt Wasser als weich.'],
['Chemie','Welche Ionen liegen in einer Kupfersulfat-Lösung vor, und was passiert, wenn man ein Eisenblech eintaucht?','In der Lösung liegen Cu²⁺- und SO₄²⁻-Ionen vor. Eisen ist unedler als Kupfer: Es gibt Elektronen ab und geht als Fe²⁺ in Lösung (Anode, Oxidation). Die Cu²⁺-Ionen nehmen die Elektronen auf und scheiden sich als metallisches Kupfer ab (Kathode, Reduktion). Die Lösung enthält danach Fe²⁺ und SO₄²⁻.'],
['Physik','Wann kippt ein Körper auf einer schiefen Ebene, wann rutscht er? Wie bestimmst Du beide Winkel?','Rutschen beginnt, wenn die Hangabtriebskraft F_H = G · sin α die Haftreibung μ₀ · G · cos α erreicht: tan α = μ₀. Kippen beginnt, wenn die Wirkungslinie der Gewichtskraft durch die Kippkante läuft: tan α = Abstand Kippkante zu Schwerpunkt (waagerecht) / Schwerpunkthöhe. Der kleinere der beiden Winkel wird zuerst erreicht.'],
['Physik','Wie berechnet man die Kraft beim Stanzen oder Scherschneiden?','Scherfläche S = Schnittlänge (Umfang) · Blechdicke. Schneidkraft F = S · τ_aB mit der Scherfestigkeit τ_aB des Werkstoffs. Bei Bohrungen und Formteilen den ganzen Umfang der Schnittlinie ansetzen. Die Einheit N/mm² mal mm² ergibt N.'],
['Physik','Was ist Wärmeausdehnung? Unterschied zwischen Längen- und Volumenausdehnung?','Mit steigender Temperatur nimmt der Raumbedarf der Teilchen zu. Festkörper: Δl = l₀ · α_L · ΔT. Das Volumen eines Festkörpers dehnt sich mit α_V ≈ 3 · α_L. Flüssigkeiten haben eine eigene, viel größere Volumenausdehnungszahl: ΔV = V₀ · α_V · ΔT. Folgen: Dehnungsfugen, Überlaufen von Behältern, Spiel bei Passungen.'],
['Physik','Wie zerlegst Du eine schräg wirkende Kraft, und welche Komponente verrichtet Arbeit?','Mit dem Winkel α zur Waagerechten gilt F_x = F · cos α (Ankathete) und F_y = F · sin α (Gegenkathete). Arbeit verrichtet nur die Komponente in Wegrichtung: W = F_x · s. Die Resultierende zweier rechtwinkliger Kräfte ist F_Res = √(F₁² + F₂²).'],
['Elektrotechnik','Ein NTC-Widerstand liegt in Reihe mit einem Festwiderstand an konstanter Spannung. Wie ändert sich die Spannung am Festwiderstand, wenn der NTC wärmer wird?','Ein NTC leitet in der Wärme besser, sein Widerstand sinkt. Der Gesamtwiderstand sinkt, der Strom steigt, und damit steigt auch die Spannung U₂ = I · R₂ am Festwiderstand. Wird es kälter, ist es umgekehrt.'],
['Statistik','Was sagen Mittelwert, Median, Spannweite und Fehleranteil aus, und wie rechnet man eine Stichprobe auf die Tagesproduktion hoch?','Mittelwert x̄ = Σx / n beschreibt die Mitte, der Median ist der mittlere Wert der sortierten Reihe und weniger empfindlich gegen Ausreißer. Die Spannweite R = x_max − x_min zeigt die Streuung. Fehleranteil p = Fehler je Stichprobe / Stichprobenumfang. Hochrechnung: erwartete Fehler = p · Tagesproduktion.'],
['Statistik','Was bedeuten Cp und Cpk, und wann ist ein Prozess fähig?','Cp = (OSG − USG) / (6 · s) vergleicht die Toleranz mit der Streuung und ignoriert die Lage. Cpk = min(OSG − x̄, x̄ − USG) / (3 · s) berücksichtigt zusätzlich, wie gut der Mittelwert zentriert ist, und ist höchstens so groß wie Cp. Ein Prozess gilt meist als fähig bei Cpk ≥ 1,33, eine Maschine bei Cmk ≥ 1,67.']];

['Physik','Was ist der Unterschied zwischen Steuern und Regeln? Nenne je ein Beispiel.','Steuern ist ein offener Wirkungsweg: Sensor → Steuergerät → Aktor. Eine Rückmeldung der Ausgangsgröße gibt es nicht, Störungen werden nicht ausgeglichen (z. B. Heizung nach Außentemperatur, Ampel mit Festprogramm). Regeln ist ein geschlossener Kreis: Der Istwert wird ständig gemessen und mit dem Sollwert verglichen; bei Regelabweichung stellt der Regler nach (z. B. Raumthermostat).'],

['Chemie','Wie funktioniert eine Bleibatterie und woran erkennt man den Ladezustand?','Minuspol Blei, Pluspol Bleidioxid, Elektrolyt verdünnte Schwefelsäure. Beim Entladen entsteht an beiden Platten Bleisulfat, die Säure wird verdünnt (Dichte sinkt von ca. 1,28 auf 1,10 g/cm³). Beim Laden läuft die Reaktion umgekehrt. Pro Zelle ca. 2 V; sechs Zellen ergeben 12 V. Der Ladezustand zeigt sich an der Säuredichte (Aräometer) und an der Klemmenspannung.'],
['Physik','Wie rechnet man die Beanspruchung eines Bolzens auf Abscheren und die Flächenpressung nach?','Scherspannung τ = F / S mit S = n · π/4 · d² (n = Zahl der Scherflächen). Flächenpressung p = F / (d · t) mit der projizierten Fläche aus Bolzendurchmesser und Blechdicke. Beide Werte werden mit den zulässigen Werten verglichen; die Sicherheit ist ν = τ_aB / τ.'],
['Physik','Wie berechnet man den Luftverbrauch eines Pneumatikzylinders?','Q = k · A · s · n · (p_e + p_amb) / p_amb mit k = 1 (einfach wirkend) bzw. 2 (doppelt wirkend), Kolbenfläche A, Hub s, Hubzahl n. Der Faktor (p_e + p_amb)/p_amb rechnet die verdichtete Luft auf Umgebungsdruck um (Boyle-Mariotte, p · V = konst.).'],

'Windkraftanlage':r=>{const D=rg(r,40,120,10),v=rg(r,5,12,1),cp=pk(r,[.35,.4,.45]),A=PI*D*D/4,P=.5*1.225*A*v**3*cp/1000;return[`Eine Windkraftanlage (Rotordurchmesser ${D} m, c_p = ${de(cp)}) steht in einem Wind von ${v} m/s (ρ = 1,225 kg/m³). Welche Leistung gibt sie ab?`,P,'kW',[`A = π · D² / 4 = ${nf(A)} m²`,`P = ½ · ρ · A · v³ · c_p = ½ · 1,225 · ${nf(A)} · ${v}³ · ${de(cp)} = ${nf(P*1000)} W = ${nf(P)} kW`]]},
'Photovoltaik':r=>{const A=rg(r,10,60,5),e=pk(r,[.15,.18,.2]),H=pk(r,[950,1000,1050]),Y=A*H*e;return[`Eine PV-Anlage hat ${A} m² Modulfläche (η = ${de(e)}) bei einer Jahreseinstrahlung von ${H} kWh/m². Welcher Jahresertrag ist zu erwarten (Wechselrichter vernachlässigt)?`,Y,'kWh',['E = A · H · η',`= ${A} · ${H} · ${de(e)} = ${nf(Y)} kWh`]]},
'Solarthermie':r=>{const m=rg(r,200,500,50),dT=rg(r,30,50,5),A=rg(r,4,10,1),Gs=pk(r,[600,700,800]),e=pk(r,[.5,.55,.6]),P=A*Gs*e,t=m*4190*dT/P/3600;return[`Ein Kollektor (${A} m², η = ${de(e)}) bei ${Gs} W/m² soll ${m} kg Wasser um ${dT} K erwärmen. Wie lange dauert das?`,t,'h',[`P = A · G · η = ${A} · ${Gs} · ${de(e)} = ${nf(P)} W`,`Q = m · c · ΔT = ${m} · 4190 · ${dT} = ${nf(m*4190*dT/1e6)} MJ`,`t = Q / P = ${nf(t)} h`]]},
'Geothermie':r=>{const z=rg(r,1000,5000,500),g=pk(r,[3,3.5,4]),T0=10,Te=T0+g*z/100;return[`Die Oberflächentemperatur beträgt ${T0} °C, die Temperatur steigt um ${de(g)} K je 100 m. Welche Temperatur herrscht in ${z} m Tiefe?`,Te,'°C',['ϑ = ϑ₀ + Gradient · z / 100 m',`= ${T0} + ${de(g)} · ${z/100} = ${nf(Te)} °C`]]},
'Brennstoffzelle (Wasserstoff)':r=>{const n=rg(r,20,100,10),U=pk(r,[.6,.65,.7,.75]),I=rg(r,20,100,10),P=n*U*I;return[`Ein Brennstoffzellenstack aus ${n} Zellen liefert je Zelle ${de(U)} V bei ${I} A. Welche elektrische Leistung gibt er ab?`,P,'W',['P = n · U · I',`= ${n} · ${de(U)} V · ${I} A = ${nf(P)} W`]]},
'Biogasanlage mit BHKW':r=>{const t=rg(r,5,50,5),y=pk(r,[100,150,200]),x=pk(r,[55,60]),V=t*y,E=V*x/100*9.97;return[`Eine Biogasanlage verarbeitet täglich ${t} t Substrat mit einer Gasausbeute von ${y} m³/t. Das Biogas enthält ${x} % Methan (H_i = 9,97 kWh/m³). Welche Energie steckt täglich im Methan?`,E,'kWh',[`V_Biogas = ${t} · ${y} = ${V} m³`,`V_CH₄ = ${V} · ${x/100} = ${nf(V*x/100)} m³`,`E = ${nf(V*x/100)} · 9,97 = ${nf(E)} kWh`]]},
'Verbrennungsmotor (Viertakt)':r=>{const M=rg(r,80,300,10),n=rg(r,1500,5000,500),P=M*2*PI*n/60/1000;return[`Ein Motor gibt bei ${n} min⁻¹ ein Drehmoment von ${M} N·m ab. Welche Leistung ist das?`,P,'kW',['P = M · ω = M · 2π · n',`= ${M} · 2π · ${nf(n/60)} 1/s = ${nf(P*1000)} W = ${nf(P)} kW`]]}
});

'Biogasanlage mit BHKW':r=>{const t=rg(r,10,40,5),y=pk(r,[100,150,200]),x=pk(r,[55,60]),ee=pk(r,[.35,.38,.4]),et=pk(r,[.45,.5]),V=t*y,E=V*x/100*9.97;return{intro:`${t} t Substrat je Tag, Gasausbeute ${y} m³/t, ${x} % Methan (H_i = 9,97 kWh/m³). Das BHKW hat η_el = ${de(ee)} und η_th = ${de(et)}.`,steps:[['Wie viel Biogas entsteht pro Tag?',V,'m³',[`V = ${t} · ${y} = ${V} m³`]],['Welche Energie steckt im Methan (pro Tag)?',E,'kWh',[`E = ${V} · ${x/100} · 9,97 = ${nf(E)} kWh`]],['Wie viel Strom erzeugt das BHKW pro Tag?',E*ee,'kWh',[`W_el = ${nf(E)} · ${de(ee)} = ${nf(E*ee)} kWh`]],['Wie viel Wärme steht pro Tag zur Verfügung?',E*et,'kWh',[`W_th = ${nf(E)} · ${de(et)} = ${nf(E*et)} kWh`]]]}}
});

ORAL.push(
['Energie','Erkläre den Aufbau und die Wirkungsweise eines Dampfkraftwerks.','Im Dampferzeuger wird die Primärenergie (Kohle, Gas, Kernbrennstoff) in Wärme umgesetzt und damit Wasser zu Frischdampf (ca. 550 °C, 250 bar) erhitzt. Der Dampf dehnt sich in der Turbine aus und versetzt sie in Rotation. Der Generator wandelt die Rotation in Strom. Im Kondensator wird der Abdampf wieder zu Wasser, die Speisewasserpumpe schließt den Kreislauf. Der Gesamtwirkungsgrad ist das Produkt der Teilwirkungsgrade (Wärmeübertragung, Kreisprozess, Turbine, Generator).'],

['Energie','Welche Arten von Wasserkraftwerken gibt es, und wie berechnet man ihre Leistung?','Laufwasserkraftwerke (Grund- und Mittellast, hoher Wirkungsgrad bis ca. 85 %), Speicherkraftwerke (großes Gefälle), Pumpspeicherkraftwerke (speichern Überschussstrom durch Hochpumpen) und Gezeiten-/Wellenkraftwerke. Leistung: P = ρ · g · H · Q · η.'],
['Energie','Wie nutzt man Windenergie, und was begrenzt den Wirkungsgrad?','Der Wind versetzt den Rotor in Drehung, der über Getriebe und Generator Strom liefert: P = ½ · ρ · A · v³ · c_p. Die Leistung wächst mit v³ und mit der Rotorfläche. Der Leistungsbeiwert ist durch die Betz-Grenze auf ca. 59 % beschränkt. Wind ist schwankend, bei Sturm wird die Anlage abgeschaltet.'],
['Energie','Wie unterscheiden sich Photovoltaik und Solarthermie?','Photovoltaik wandelt Licht über den photoelektrischen Effekt in Gleichstrom (p-n-Übergang im Silizium, Wirkungsgrad ca. 11–20 %), ein Wechselrichter liefert Wechselstrom. Solarthermie nutzt die Strahlung als Wärme: Kollektoren erwärmen Brauchwasser, Spiegelkraftwerke erzeugen Dampf für Turbinen. Beide liefern nachts nichts und brauchen Speicher.'],
['Energie','Was ist eine Brennstoffzelle, und worin unterscheidet sie sich von einer Batterie?','Eine Brennstoffzelle wandelt chemische Energie von zugeführtem Wasserstoff und Sauerstoff direkt in Strom um (Anode: H₂ → 2 H⁺ + 2 e⁻, Kathode: ½ O₂ + 2 H⁺ + 2 e⁻ → H₂O). Abfall ist Wasser. Anders als die Batterie speichert sie nichts, sie braucht ständig Brennstoff. Der Wirkungsgrad liegt bei 40–60 %, da kein Umweg über Wärme nötig ist.'],
['Energie','Wie funktioniert eine Biogasanlage mit BHKW?','Mikroorganismen zersetzen Biomasse (Gülle, Mais, Bioabfälle) im luftdichten Fermenter ohne Sauerstoff. Es entsteht Biogas aus Methan und CO₂. Das Gas wird gespeichert und im BHKW in einem Motor verbrannt, der einen Generator antreibt. Die Abwärme wird als Heizwärme genutzt (Kraft-Wärme-Kopplung). Der Gärrest dient als Dünger.'],
['Energie','Wie funktioniert ein Viertaktmotor, und was ist der Unterschied zwischen Otto- und Dieselmotor?','Takte: Ansaugen, Verdichten, Arbeiten (Verbrennung und Expansion), Ausstoßen; ein Arbeitsspiel entspricht zwei Kurbelwellenumdrehungen. Beim Ottomotor zündet ein Zündfunke das Kraftstoff-Luft-Gemisch, beim Diesel zündet der eingespritzte Kraftstoff in der heiß verdichteten Luft von selbst. Der Wirkungsgrad liegt bei ca. 30–42 %.']
);

MCQ.push(['Wahrscheinlichkeitsnetz','Wie bestimmt man die Standardabweichung σ aus der Geraden?',['Wert bei 84,13 % minus Wert bei 50 %','Wert bei 50 % geteilt durch 2','Abstand zwischen USG und OSG','Wert bei 100 % minus Wert bei 0 %'],'Bei 84,13 % ist z = +1, der Wert beträgt also μ + σ. Die Differenz zum Wert bei 50 % ist σ. Alternativ: halber Abstand zwischen den Werten bei 97,72 % und 2,28 % (z = ±2) durch 2.']);
MCQ.push(['Wahrscheinlichkeitsnetz','Die Gerade im Netz verläuft sehr steil (Werte auf der waagerechten Achse). Was sagt das über die Streuung?',['Die Streuung σ ist klein','Die Streuung σ ist groß','Der Mittelwert ist groß','Es gibt viel Ausschuss'],'Eine steile Gerade bedeutet: Die Wertachse ändert sich nur wenig, während die Prozentachse stark durchlaufen wird. Fast alle Werte liegen dicht beieinander, also ist σ klein.']);
MCQ.push(['Wahrscheinlichkeitsnetz','Wie liest man den Ausschussanteil unterhalb der unteren Grenze USG im Netz ab?',['Von USG senkrecht zur Geraden, dann waagerecht zur Prozentachse','Bei 50 % waagerecht bis zur USG','Den Abstand USG–OSG in Prozent umrechnen','Die Steigung der Geraden mit USG multiplizieren'],'Der Punkt der Geraden über der USG gibt die Summenhäufigkeit bis zur USG an. Das ist genau der Anteil, der kleiner als USG ist, also der untere Ausschuss.']);
ORAL.push(['Statistik','Wie bestimmt man Mittelwert und Standardabweichung mit dem Wahrscheinlichkeitsnetz?','Zwei bekannte Punkte (Wert | Summenhäufigkeit) eintragen und mit dem Lineal verbinden. Normalverteilte Werte liegen auf einer Geraden. Bei 50 % liest man μ ab, bei 84,13 % den Wert μ + σ; σ ist die Differenz. Den Ausschuss liest man ab, indem man von USG bzw. OSG senkrecht zur Geraden und waagerecht zur Prozentachse geht. Bei "größer als"-Angaben zuerst 100 % minus Anteil bilden.']);

['Elektrotechnik','Was ist der Unterschied zwischen Gleich- und Wechselstrom? Nenne je ein Beispiel.','Bei Gleichstrom fließt der Strom immer in dieselbe Richtung mit gleichbleibendem Betrag, zum Beispiel aus Batterie, Akku oder Solarzelle. Bei Wechselstrom ändern Richtung und Betrag periodisch, im Netz 50-mal pro Sekunde (50 Hz). Wechselstrom lässt sich mit dem Transformator einfach auf andere Spannungen bringen, deshalb wird Energie als Wechselstrom verteilt.'],
['Elektrotechnik','Was bedeutet 230 V an der Steckdose? Wie groß ist der Scheitelwert?','230 V ist der Effektivwert. Er heizt einen Widerstand so stark wie 230 V Gleichspannung. Der Scheitelwert ist û = U_eff · √2 ≈ 325 V, die Spitze-Spitze-Spannung etwa 650 V. Die Frequenz beträgt 50 Hz, die Periodendauer 20 ms.'],
['Elektrotechnik','Warum wird elektrische Energie meist als Wechselstrom übertragen? Wie wandelt man ihn um?','Wechselspannung lässt sich mit dem Transformator verlustarm hoch- und heruntertransformieren. Hohe Spannung bedeutet bei gleicher Leistung kleinen Strom und damit kleine Leitungsverluste (P_V = I² · R). Für Elektronik und Akkus wandelt ein Gleichrichter Wechselstrom in Gleichstrom um, ein Wechselrichter macht es umgekehrt.'],

['Mathematik','Erkläre den Dreisatz am Beispiel von Maschinen und Arbeitszeit.','Zuerst entscheidet man, ob proportional oder umgekehrt proportional. Mehr Maschinen brauchen weniger Zeit: umgekehrt proportional, das Produkt aus Maschinen und Zeit bleibt gleich. Mit 3 Maschinen und 8 Stunden hat man 24 Maschinenstunden. Sind es 6 Maschinen, braucht man 24 / 6 = 4 Stunden.'],
['Mathematik','Wann nimmst Du den Satz des Pythagoras und wann Sinus, Kosinus oder Tangens?','Der Satz des Pythagoras (a² + b² = c²) verbindet nur die drei Seiten eines rechtwinkligen Dreiecks. Sind ein Winkel und eine Seite im Spiel, nutzt man sin, cos oder tan: sin α = Gegenkathete / Hypotenuse, cos α = Ankathete / Hypotenuse, tan α = Gegenkathete / Ankathete. Taschenrechner auf DEG stellen.']

['Windenantrieb: reicht der Drehstrommotor?',r=>{const m=pk(r,[300,400,500,800]),v=pk(r,[.3,.4,.5]),eg=pk(r,[.55,.6,.65]),I=pk(r,[7,8.2,9.2,10.5]),cp=pk(r,[.8,.85,.88]),em=pk(r,[.8,.83,.86]),F=m*9.81,Pn=F*v,Pz=Pn/eg,Pm=Math.sqrt(3)*400*I*cp*em,res=Pm-Pz;return{intro:`Eine Seilwinde wird über ein Getriebe von einem Drehstrommotor angetrieben. Typenschild: U = 400 V, I = ${de(I)} A, cos φ = ${de(cp)}, Motorwirkungsgrad ${de(em)}. Eine Masse von ${m} kg wird gleichförmig mit ${de(v)} m/s gehoben. Getriebe und Winde haben zusammen einen Wirkungsgrad von ${nf(eg*100,2)} %. g = 9,81 m/s².`,steps:[STP('Wie groß ist die Seilkraft?',F,'N',[`F = m · g = ${m} · 9,81 = ${nf6(F)} N`],'Gleichförmiges Heben: Seilkraft = Gewichtskraft.'),STP('Welche Nutzleistung braucht die Last?',Pn,'W',[`P_nutz = F · v = ${nf6(F)} N · ${de(v)} m/s = ${nf6(Pn)} W`],'P = F · v.'),STP('Welche Leistung muss am Getriebeeingang zugeführt werden?',Pz,'W',[`P_zu = P_nutz / η = ${nf6(Pn)} W / ${nf6(eg)} = ${nf6(Pz)} W`],'Wirkungsgrad von Getriebe und Winde.'),STP('Welche Leistung gibt der Motor an der Welle ab?',Pm,'W',[`P_ab = √3 · U · I · cos φ · η = √3 · 400 · ${de(I)} · ${de(cp)} · ${de(em)} = ${nf6(Pm)} W`],'Drehstrom: P = √3 · U · I · cos φ, dann Motorwirkungsgrad.'),STP('Wie groß ist die Leistungsreserve des Motors? (negativ: reicht nicht)',res,'W',[`Reserve = ${nf6(Pm)} W − ${nf6(Pz)} W = ${nf6(res)} W`,res>=0?'Der Motor reicht aus.':'Der Motor reicht nicht aus.'],'Motorleistung minus benötigte Leistung.')]}}],

['Notstromdiesel im Probelauf: Wirkungsgrad',r=>{const P=pk(r,[100,200,300,400]),t=pk(r,[10,15,20,30]),eta0=pk(r,[.32,.35,.38]),Hi=42000,rho=.83,V=Math.max(1,Math.round(P*t*60/(eta0*Hi)/rho)),m=V*rho,Q=m*Hi,Pz=Q/(t*60),eta=P/Pz;return{intro:`Ein Notstromdiesel mit einer Nennleistung von ${P} kW verbraucht im ${t}-minütigen Probelauf bei Nennlast ${V} l Dieselkraftstoff. Heizwert H_i = 42 000 kJ/kg, Dichte ρ = 0,83 kg/dm³.`,steps:[STP('Welche Masse Kraftstoff wurde verbraucht?',m,'kg',[`m = ρ · V = 0,83 kg/dm³ · ${V} dm³ = ${nf6(m)} kg`],'1 l = 1 dm³.'),STP('Welche Wärmeenergie steckt darin?',Q,'kJ',[`Q = m · H_i = ${nf6(m)} kg · 42 000 kJ/kg = ${nf6(Q)} kJ`],'Energie = Masse mal Heizwert.'),STP('Wie groß ist die zugeführte Leistung?',Pz,'kW',[`P_zu = Q / t = ${nf6(Q)} kJ / ${t*60} s = ${nf6(Pz)} kW`],'1 kJ/s = 1 kW.'),STP('Wie groß ist der Wirkungsgrad?',eta,'',[`η = P_ab / P_zu = ${P} kW / ${nf6(Pz)} kW = ${nf6(eta)}`],'Abgabe durch Zufuhr.',.01)]}}],
['Schwerkraft-Rollenbahn für Getränkekisten',r=>{const L=pk(r,[10,12,15,18]),HE=pk(r,[.7,.85,1]),mu=pk(r,[.02,.03,.035,.04]),m=pk(r,[8,12,15,20]),n=pk(r,[3,5,8]),v=pk(r,[1.5,2,2.5]),al=Math.atan(mu)*180/PI,HA=HE+L*mu,E1=.5*m*v*v,E=n*E1;return{intro:`Eine Schwerkraft-Rollenbahn der Länge ${L} m transportiert Getränkekisten mit je ${m} kg. Die Rollreibungszahl beträgt μ = ${de(mu)}. Die Kisten sollen am Ende die gleiche Geschwindigkeit haben wie am Anfang, also nicht beschleunigt werden (Hangabtrieb = Reibung). Das Ende der Bahn liegt ${de(HE)} m über dem Boden. Am Ende werden ${n} Kisten, die mit ${de(v)} m/s ankommen, von einem Anschlag abgebremst.`,steps:[STP('Wie groß muss der Neigungswinkel sein?',al,'°',[`F_H = F_R → m · g · sin α = μ · m · g · cos α → tan α = μ = ${de(mu)}`,`α = ${nf6(al)}°`],'Hangabtrieb und Reibung müssen gleich groß sein.'),STP('Wie hoch liegt die Aufgabestelle?',HA,'m',[`H_A = H_E + L · tan α = ${de(HE)} m + ${L} m · ${de(mu)} = ${nf6(HA)} m`],'Höhenunterschied = L · tan α.'),STP('Welche Energie wird beim Abbremsen einer Kiste frei?',E1,'J',[`E = ½ · m · v² = ½ · ${m} kg · (${de(v)} m/s)² = ${nf6(E1)} J`],'Bewegungsenergie.'),STP(`Welche Energie nimmt der Anschlag bei ${n} Kisten auf?`,E,'J',[`E_ges = ${n} · ${nf6(E1)} J = ${nf6(E)} J`],'Einzelenergie mal Anzahl.')]}}],
['Kreiselpumpe an der Sole: Leistung und Fördervolumen',r=>{const I=pk(r,[11,13,16]),cp=pk(r,[.82,.86,.88]),lo=pk(r,[12,16,20]),ep=pk(r,[.7,.77,.8]),h=pk(r,[4,5.45,7]),t=pk(r,[10,20,30]),rho=pk(r,[1.1,1.15,1.2]),Pm=Math.sqrt(3)*400*I*cp,eg=(1-lo/100)*ep,Pa=Pm*eg,m=Pa*t/(9.81*h),V=m/rho;return{intro:`Eine Kreiselpumpe fördert ${t} Sekunden lang Salzlösung (Dichte ${de(rho)} kg/dm³) um ${de(h)} m nach oben. Der Drehstrommotor (400 V) nimmt ${I} A bei cos φ = ${de(cp)} auf. Die Motorverluste betragen ${lo} %, der Pumpenwirkungsgrad ist ${de(ep)}. g = 9,81 m/s².`,steps:[STP('Welche elektrische Leistung nimmt der Motor auf?',Pm,'W',[`P = √3 · U · I · cos φ = √3 · 400 · ${I} · ${de(cp)} = ${nf6(Pm)} W`],'Drehstromleistung.'),STP('Wie groß ist der Gesamtwirkungsgrad?',eg,'',[`η_M = 1 − ${lo} % = ${nf6(1-lo/100)}`,`η_ges = η_M · η_P = ${nf6(1-lo/100)} · ${de(ep)} = ${nf6(eg)}`],'Wirkungsgrade in der Kette multiplizieren.',.01),STP('Welche Leistung gibt die Pumpe an die Flüssigkeit ab?',Pa,'W',[`P_ab = P_zu · η_ges = ${nf6(Pm)} · ${nf6(eg)} = ${nf6(Pa)} W`],'Abgabe = Zufuhr mal Wirkungsgrad.'),STP('Wie viel kg Salzlösung werden gefördert?',m,'kg',[`P · t = m · g · h`,`m = ${nf6(Pa)} W · ${t} s / (9,81 · ${de(h)}) = ${nf6(m)} kg`],'Pumparbeit = Hubarbeit.'),STP('Wie groß ist das Fördervolumen?',V,'dm³',[`V = m / ρ = ${nf6(m)} kg / ${de(rho)} kg/dm³ = ${nf6(V)} dm³`],'V = m / ρ.')]}}],
['Gabelstapler: Hinterachse, Flächenpressung und Kippgrenze',r=>{const F1=pk(r,[20,25,32]),m=pk(r,[400,500,700]),l2=pk(r,[.8,1,1.2]),l1=pk(r,[1.4,1.6,1.8]),lH=pk(r,[1.9,2,2.2]),F2=m*9.81/1000,FH=(F1*l1-F2*l2)/lH,p=FH*1000/2/(100*250),Fk=F1*l1/l2;return{intro:`Ein Gabelstapler (Eigengewicht F₁ = ${F1} kN) trägt eine Last von ${m} kg. Die Last liegt ${de(l2)} m vor der Vorderachse (Drehpunkt), der Schwerpunkt des Staplers ${de(l1)} m hinter der Vorderachse. Die Hinterachse ist ${de(lH)} m von der Vorderachse entfernt. Jeder Hinterreifen hat eine Auflagefläche von 10 cm × 25 cm. g = 9,81 m/s².`,steps:[STP('Wie groß ist die Gewichtskraft der Last?',F2,'kN',[`F₂ = ${m} · 9,81 N = ${nf6(F2)} kN`],'F = m · g.'),STP('Welche Kraft wirkt auf die Hinterachse?',FH,'kN',[`Momentengleichgewicht um die Vorderachse: F_H · l_H = F₁ · l₁ − F₂ · l₂`,`F_H = (${F1} · ${de(l1)} − ${nf6(F2)} · ${de(l2)}) / ${de(lH)} = ${nf6(FH)} kN`],'Last wirkt vorn, Eigengewicht hinten.'),STP('Welche Flächenpressung entsteht an einem Hinterreifen?',p,'N/mm²',[`p = (F_H / 2) / A = ${nf6(FH*1000/2)} N / (100 mm · 250 mm) = ${nf(p,3)} N/mm²`],'Die Kraft verteilt sich auf zwei Reifen.',.02),STP('Ab welcher Last beginnt der Stapler zu kippen?',Fk,'kN',[`F_H = 0: F₂ = F₁ · l₁ / l₂ = ${F1} · ${de(l1)} / ${de(l2)} = ${nf6(Fk)} kN`,`entspricht ${nf6(Fk*1000/9.81)} kg`],'Die Hinterachse wird entlastet, wenn F_H null wird.')]}}],
['Fässer auf Paletten: Flächennutzungsgrad',r=>{const d=pk(r,[360,400,490,560]),n1=Math.floor(1200/d)*Math.floor(800/d),n2=Math.floor(1200/d)*Math.floor(1000/d),Af=Math.PI*d*d/4/10000,u1=n1*Af/96,u2=n2*Af/120;return{intro:`Eine Spedition transportiert Fässer mit ${d} mm Durchmesser stehend auf Paletten (ohne Überstand). Zur Wahl stehen die Europalette (1,2 m × 0,8 m) und die Industriepalette (1,2 m × 1,0 m). Gerechnet wird mit der Fassgrundfläche.`,steps:[STP('Wie viele Fässer passen auf die Europalette?',n1,'',[`Länge: ⌊1200 / ${d}⌋ = ${Math.floor(1200/d)}, Breite: ⌊800 / ${d}⌋ = ${Math.floor(800/d)}`,`n = ${Math.floor(1200/d)} · ${Math.floor(800/d)} = ${n1}`],'Ganze Fässer in beiden Richtungen abzählen.'),STP('Wie viele Fässer passen auf die Industriepalette?',n2,'',[`Länge: ${Math.floor(1200/d)}, Breite: ⌊1000 / ${d}⌋ = ${Math.floor(1000/d)}`,`n = ${n2}`],'Wie vorher, mit 1000 mm Breite.'),STP('Wie groß ist der Flächennutzungsgrad der Europalette?',u1*100,'%',[`A_Fass = π/4 · ${nf6(d/100)}² dm² = ${nf6(Af)} dm²`,`A_Palette = 12 dm · 8 dm = 96 dm²`,`η = ${n1} · ${nf6(Af)} / 96 · 100 % = ${nf6(u1*100)} %`],'Fassfläche mal Anzahl durch Palettenfläche.'),STP('Wie groß ist der Flächennutzungsgrad der Industriepalette?',u2*100,'%',[`A_Palette = 12 dm · 10 dm = 120 dm²`,`η = ${n2} · ${nf6(Af)} / 120 · 100 % = ${nf6(u2*100)} %`],'Palettenfläche 120 dm².')]}}],
['Hebegeschirr mit Druckstab: Seilkräfte und Zugspannung',r=>{const m=pk(r,[800,1000,1300,1600]),S=pk(r,[16,22,30]),sm=pk(r,[1000,1200,1500]),al=pk(r,[45,50,60]),Fg=m*9.81,sa=Fg/S,Fb=Fg/2/Math.sin(al*PI/180),Fm=sm*S;return{intro:`Ein Ladungsträger (${m} kg) wird mit einem Hebegeschirr aus zwei Seilen und einem Druckstab gehoben. Die beiden Seiltrume b schließen mit dem waagerechten Druckstab je ${al}° ein, das Seiltrum a trägt die gesamte Last. Der Seilquerschnitt beträgt ${S} mm², die höchste zulässige Zugspannung ${sm} N/mm². Die Masse des Geschirrs bleibt unberücksichtigt. g = 9,81 m/s².`,steps:[STP('Wie groß ist die Zugkraft im Seiltrum a?',Fg,'N',[`F_a = F_G = m · g = ${m} · 9,81 = ${nf6(Fg)} N`],'Das mittlere Seil trägt die ganze Last.'),STP('Wie groß ist die Zugspannung im Seiltrum a?',sa,'N/mm²',[`σ = F / S = ${nf6(Fg)} N / ${S} mm² = ${nf6(sa)} N/mm²`],'σ = F / S.'),STP('Wie groß ist die Zugkraft in einem Seiltrum b?',Fb/1000,'kN',[`Jedes Seil b trägt vertikal F_G / 2 = ${nf6(Fg/2)} N`,`F_b = (F_G / 2) / sin ${al}° = ${nf6(Fg/2)} / ${nf(Math.sin(al*PI/180),4)} = ${nf6(Fb)} N = ${nf6(Fb/1000)} kN`],'Senkrechte Komponente = F_G / 2 = F_b · sin α.'),STP('Welche Zugkraft darf Seiltrum a höchstens aufnehmen?',Fm/1000,'kN',[`F_max = σ_max · S = ${sm} N/mm² · ${S} mm² = ${nf6(Fm)} N = ${nf6(Fm/1000)} kN`],'F = σ · S.')]}}],
['Winkelprofil: Masse und Zugspannung mit Bohrung',r=>{const S=pk(r,[3.8,4.79,5.6]),t=pk(r,[4,5,6]),l=pk(r,[4,6,8]),db=pk(r,[13,17,21]),F=pk(r,[24000,36000,45000]),m=S*l*100*2.7/1000,s1=F/(S*100),s2=F/(S*100-db*t);return{intro:`Ein ${l} m langes Winkelprofil aus Aluminium (ρ = 2,70 kg/dm³) hat eine Querschnittsfläche von ${de(S)} cm² und eine Schenkeldicke von ${t} mm. Es wird mit ${F} N auf Zug belastet.`,steps:[STP('Welche Masse hat das Profil?',m,'kg',[`V = S · l = ${de(S)} cm² · ${l*100} cm = ${nf6(S*l*100)} cm³`,`m = ρ · V = 2,70 g/cm³ · ${nf6(S*l*100)} cm³ = ${nf6(m*1000)} g = ${nf6(m)} kg`],'ρ = 2,70 g/cm³.'),STP('Welche Zugspannung tritt auf?',s1,'N/mm²',[`σ = F / S = ${F} N / ${nf6(S*100)} mm² = ${nf6(s1)} N/mm²`],'1 cm² = 100 mm².'),STP(`Welche Zugspannung tritt auf, wenn ein Loch mit ${db} mm Durchmesser durch den Schenkel gebohrt wird?`,s2,'N/mm²',[`Querschnitt: S' = S − d · t = ${nf6(S*100)} − ${db} · ${t} = ${nf6(S*100-db*t)} mm²`,`σ = ${F} / ${nf6(S*100-db*t)} = ${nf6(s2)} N/mm²`],'Die Bohrung nimmt d · t vom Querschnitt weg.')]}}],
['Brückenkran mit Blechrolle: Seilspannung und Auflagerkräfte',r=>{const mat=pk(r,MAT16),D=pk(r,[1,1.2]),d=pk(r,[.3,.4]),L=pk(r,[1.5,2,2.5]),nw=pk(r,[114,152,216]),dw=pk(r,[2,2.5]),l1=pk(r,[8,10,12]),l2=pk(r,[2,3,4]),Fb=pk(r,[40,50,60])*1000,Fk=pk(r,[4000,5000,6000]),V=(D*D-d*d)*PI/4*L*1000,m=V*mat[1],Fr=m*9.81,A=PI/4*dw*dw*nw,sg=Fr/A,FB=((Fr+Fk)*l2+Fb*l1/2)/l1,FA=Fr+Fk+Fb-FB;return{intro:`Ein Brückenkran hebt eine Blechrolle aus ${mat[0]} (ρ = ${de(mat[1])} kg/dm³), aufgewickelt zu einem Hohlzylinder mit D = ${de(D)} m, d = ${de(d)} m, Länge ${de(L)} m. Das Stahlseil besteht aus ${nw} Einzeldrähten mit je ${de(dw)} mm Durchmesser. Der Kranträger (Stützweite ${l1} m) hat ein Eigengewicht von ${nf6(Fb/1000)} kN. Die Laufkatze (${Fk} N) steht ${l2} m vom linken Auflager A entfernt, die Rolle hängt an der Katze. g = 9,81 m/s².`,steps:[STP('Welche Masse hat die Blechrolle?',m,'kg',[`V = (D² − d²) · π/4 · L = (${nf6(D*10)}² − ${nf6(d*10)}²) · π/4 · ${nf6(L*10)} dm³ = ${nf6(V)} dm³`,`m = ρ · V = ${de(mat[1])} · ${nf6(V)} = ${nf6(m)} kg`],'Hohlzylinder in dm rechnen.'),STP('Wie groß ist die Zugspannung im Seil?',sg,'N/mm²',[`F = m · g = ${nf6(Fr)} N`,`A_Seil = ${nw} · π/4 · ${de(dw)}² = ${nf6(A)} mm²`,`σ = F / A = ${nf6(sg)} N/mm²`],'Querschnitt aller Einzeldrähte addieren.'),STP('Wie groß ist die Auflagerkraft F_B am rechten Ende?',FB,'N',[`Momente um A: F_B · l₁ = (F_Last + F_Katze) · l₂ + F_Träger · l₁ / 2`,`F_B = ((${nf6(Fr)} + ${Fk}) · ${l2} + ${nf6(Fb)} · ${l1/2}) / ${l1} = ${nf6(FB)} N`],'Drehpunkt in Auflager A legen.'),STP('Wie groß ist die Auflagerkraft F_A?',FA,'N',[`F_A = F_Last + F_Katze + F_Träger − F_B = ${nf6(Fr+Fk+Fb)} − ${nf6(FB)} = ${nf6(FA)} N`],'Summe der senkrechten Kräfte gleich null.')]}}],
['Transportsystem holt Förderband ein: Treffpunkt',r=>{const v1=pk(r,[15,20,25]),v2=pk(r,[45,60,75]),tv=pk(r,[3,4,5,6]),tf=v1*tv/(v2-v1),sF=tf*v2,tg=tf+tv;return{intro:`Kleinteile laufen auf einem Förderband mit konstant ${v1} m/min zur Montagestation. ${tv} Minuten nach dem Bandstart startet an derselben Stelle ein fahrerloses Fahrzeug (FTS) mit konstant ${v2} m/min und holt die Kiste ein.`,steps:[STP('Welchen Vorsprung hat die Kiste beim Start des FTS?',v1*tv,'m',[`s₀ = v₁ · t = ${v1} m/min · ${tv} min = ${v1*tv} m`],'Strecke des Bandes in der Verzögerungszeit.'),STP('Nach wie viel Minuten (ab FTS-Start) holt das FTS die Kiste ein?',tf,'min',[`t = s₀ / (v₂ − v₁) = ${v1*tv} m / (${v2} − ${v1}) m/min = ${nf6(tf)} min`],'Der Vorsprung wird mit der Differenzgeschwindigkeit eingeholt.'),STP('Welche Strecke hat das FTS bis dahin zurückgelegt?',sF,'m',[`s = v₂ · t = ${v2} m/min · ${nf6(tf)} min = ${nf6(sF)} m`],'Strecke = Geschwindigkeit mal Zeit.'),STP('Nach wie vielen Minuten ab Bandstart treffen sich beide?',tg,'min',[`t_ges = ${tv} min + ${nf6(tf)} min = ${nf6(tg)} min`],'Die Wartezeit mitzählen.')]}}],
['Drohne im Seitenwind: Geschwindigkeit und Abdrift',r=>{const v=pk(r,[10,12,14]),w=pk(r,[6,8,10]),c=Math.SQRT1_2,wx=w*c,wy=w*c,vy=v-wy,vr=Math.sqrt(wx*wx+vy*vy),a=Math.atan(wx/vy)*180/PI;return{intro:`Eine Lieferdrohne startet mit ${v} m/s genau nach Süden. Gleichzeitig weht ein Wind aus Südost (45°) mit ${w} m/s, er schiebt die Drohne also nach Nordwest.`,steps:[STP('Welche Komponente des Windes wirkt entlang der Nord-Süd-Achse (gegen die Flugrichtung)?',wy,'m/s',[`w_y = w · cos 45° = ${w} · 0,7071 = ${nf6(wy)} m/s`],'Wind zerlegen: cos 45° = sin 45°.'),STP('Welche Komponente wirkt nach Westen?',wx,'m/s',[`w_x = w · sin 45° = ${nf6(wx)} m/s`],'Quer zur Flugrichtung.'),STP('Wie groß ist die resultierende Geschwindigkeit?',vr,'m/s',[`v_y = ${v} − ${nf6(wy)} = ${nf6(vy)} m/s`,`v_res = √(v_x² + v_y²) = √(${nf6(wx)}² + ${nf6(vy)}²) = ${nf6(vr)} m/s`],'Flug- und Windgeschwindigkeit als Vektoren addieren.'),STP('Um welchen Winkel wird die Drohne von der Nord-Süd-Achse abgelenkt?',a,'°',[`tan α = v_x / v_y = ${nf6(wx)} / ${nf6(vy)} = ${nf6(wx/vy)}`,`α = ${nf6(a)}°`],'Winkel zur Südrichtung mit dem Tangens.')]}}],
['Kurvenfahrt: Grenzgeschwindigkeit nass und trocken',r=>{const R=pk(r,[30,40,50,60]),mn=pk(r,[.3,.4,.5,.6]),mt=pk(r,[.7,.8,.9]),vn=Math.sqrt(mn*9.81*R),vt=Math.sqrt(mt*9.81*R);return{intro:`Ein Kleintransporter fährt mit konstanter Geschwindigkeit in eine Kurve. Der Schwerpunkt bewegt sich auf einem Kreis mit r = ${R} m. Die Haftreibungszahl beträgt auf nasser Fahrbahn ${de(mn)}, auf trockener ${de(mt)}. g = 9,81 m/s².`,steps:[STP('Bei welcher Geschwindigkeit (m/s) rutscht das Fahrzeug nass aus der Kurve?',vn,'m/s',[`F_Z = F_R → m · v² / r = μ · m · g`,`v = √(μ · g · r) = √(${de(mn)} · 9,81 · ${R}) = ${nf6(vn)} m/s`],'Zentripetalkraft = Reibungskraft, die Masse kürzt sich.'),STP('Wie viel ist das in km/h?',vn*3.6,'km/h',[`${nf6(vn)} m/s · 3,6 = ${nf6(vn*3.6)} km/h`],'Mal 3,6.'),STP('Bei welcher Geschwindigkeit (km/h) rutscht das Fahrzeug trocken?',vt*3.6,'km/h',[`v = √(${de(mt)} · 9,81 · ${R}) = ${nf6(vt)} m/s = ${nf6(vt*3.6)} km/h`],'Gleiche Formel mit der größeren Haftreibungszahl.')]}}],
['Überholvorgang auf der Landstraße',r=>{const v1=pk(r,[100,110,120]),v2=pk(r,[70,80,90]),L1=pk(r,[4.5,4.9,5.2]),L2=pk(r,[12,18,24]),a=pk(r,[40,60,80]),b=pk(r,[30,40,50]),sr=L1+L2+a+b,vr=(v1-v2)/3.6,t=sr/vr,s=v1/3.6*t;return{intro:`Ein Pkw (Länge ${de(L1)} m) fährt mit ${v1} km/h hinter einem Lkw (Länge ${L2} m, ${v2} km/h) her. ${a} m vor dem Lkw setzt der Pkw zum Überholen an und schert ${b} m nach dem vollständigen Passieren des Lkw wieder ein. Beide fahren mit konstanter Geschwindigkeit.`,steps:[STP('Welche Relativstrecke legt der Pkw gegenüber dem Lkw zurück?',sr,'m',[`s_rel = L_Pkw + L_Lkw + ${a} + ${b} = ${nf6(sr)} m`],'Fahrzeuglängen und beide Abstände addieren.'),STP('Wie groß ist die Relativgeschwindigkeit?',vr,'m/s',[`v_rel = (${v1} − ${v2}) km/h / 3,6 = ${nf6(vr)} m/s`],'Differenz der Geschwindigkeiten.'),STP('Wie lange dauert der Überholvorgang?',t,'s',[`t = s_rel / v_rel = ${nf6(sr)} m / ${nf6(vr)} m/s = ${nf6(t)} s`],'Relativstrecke durch Relativgeschwindigkeit.'),STP('Welche Gesamtstrecke legt der Pkw dabei auf der Straße zurück?',s,'m',[`s = v_Pkw · t = ${nf6(v1/3.6)} m/s · ${nf6(t)} s = ${nf6(s)} m`],'Mit der Pkw-Geschwindigkeit in m/s.')]}}],
['Krankentage im Betrieb: Mittelwert, Modalwert und Krankenstand',r=>{const vals=[1,2,2,3,3,3,4,4,4,5,5,6],x=Array.from({length:36},()=>pk(r,vals)),soll=pk(r,[200,210,220]),sum=x.reduce((a,b)=>a+b,0),mean=sum/36,mod=mo17(x),ks=sum/(soll*36)*100,R=Math.max(...x)-Math.min(...x),cnt=[1,2,3,4,5,6].map(k=>x.filter(v=>v===k).length);return{intro:`Die Krankentage von 36 Mitarbeitern im Jahr: ${x.join('; ')}. Die Sollarbeitszeit beträgt ${soll} Tage je Mitarbeiter.`,steps:[STP('Wie groß ist die Summe aller Krankentage?',sum,'Tage',[`Häufigkeiten Tag 1…6: ${cnt.join(', ')}`,`Σ = ${cnt.map((c,i)=>c+'·'+(i+1)).join(' + ')} = ${sum}`],'Mit der Häufigkeitstabelle rechnen.'),STP('Wie groß ist der arithmetische Mittelwert?',mean,'Tage',[`x̄ = ${sum} / 36 = ${nf6(mean)} Tage`],'Summe durch Anzahl (36).'),STP('Welcher Wert kommt am häufigsten vor (Modalwert)?',mod,'Tage',[`Häufigster Wert: ${mod} Tage (${Math.max(...cnt)} mal)`],'Die Häufigkeiten vergleichen.'),STP('Wie hoch ist der Krankenstand?',ks,'%',[`Krankenstand = Σ Krankentage / (n · Soll) · 100 % = ${sum} / (36 · ${soll}) · 100 % = ${nf6(ks)} %`],'Fehltage durch die gesamte Sollarbeitszeit aller Mitarbeiter.'),STP('Wie groß ist die Spannweite?',R,'Tage',[`R = ${Math.max(...x)} − ${Math.min(...x)} = ${R} Tage`],'Größter minus kleinster Wert.')]}}],
['Aufzug-Belastung: Gewichte von zehn Personen',r=>{const x=Array.from({length:10},()=>rg(r,50,100,2)),mean=m17(x),R=Math.max(...x)-Math.min(...x),s=sd17(x);return{intro:`Für eine Erhebung zur Belastbarkeit von Aufzügen wurde das Gewicht von zehn Personen ermittelt (in kg): ${x.join('; ')}.`,steps:[STP('Wie groß ist der arithmetische Mittelwert?',mean,'kg',[`x̄ = ${x.reduce((a,b)=>a+b,0)} / 10 = ${nf6(mean)} kg`],'Summe durch 10.'),STP('Wie groß ist die Spannweite?',R,'kg',[`R = ${Math.max(...x)} − ${Math.min(...x)} = ${R} kg`],'Größter minus kleinster Wert.'),STP('Wie groß ist die Standardabweichung?',s,'kg',[`s = √(Σ(x − x̄)² / (n − 1)) = √(${nf6(x.reduce((a,b)=>a+(b-mean)**2,0))} / 9) = ${nf6(s)} kg`],'Stichprobe: durch n − 1 teilen.',.015),STP('Bei welchem Gewicht liegt die obere Grenze des 99,73-%-Bereichs?',mean+3*s,'kg',[`x̄ + 3 · s = ${nf6(mean)} + 3 · ${nf6(s)} = ${nf6(mean+3*s)} kg`],'99,73 % liegen innerhalb ±3σ.',.012),STP('Bei welchem Gewicht liegt die untere Grenze?',mean-3*s,'kg',[`x̄ − 3 · s = ${nf6(mean)} − 3 · ${nf6(s)} = ${nf6(mean-3*s)} kg`],'Untere Grenze: x̄ − 3σ.',.012)]}}],
['Rohrmessung: Modalwert, Median, Mittelwert, Standardabweichung',r=>{const vals=[7.8,7.9,7.9,8,8,8,8,8.1,8.1,8.2],x=Array.from({length:20},()=>pk(r,vals)),mean=m17(x),s=sd17(x);return{intro:`Bei der Qualitätskontrolle von Rohren (Sollmaß Außendurchmesser 8 mm) ergaben sich 20 Messungen (in mm): ${x.join('; ')}. Ergebnisse mit drei Nachkommastellen.`,steps:[STP('Welcher Messwert kommt am häufigsten vor (Modalwert)?',mo17(x),'mm',[`Modalwert = ${nf6(mo17(x))} mm`],'Häufigkeitstabelle anlegen.'),STP('Wie groß ist der Median?',md17(x),'mm',[`sortiert: ${[...x].sort((a,b)=>a-b).join('; ')}`,`Median = Mittelwert aus 10. und 11. Wert = ${nf6(md17(x))} mm`],'Bei gerader Anzahl die beiden mittleren Werte mitteln.'),STP('Wie groß ist der arithmetische Mittelwert?',mean,'mm',[`x̄ = ${nf6(x.reduce((a,b)=>a+b,0))} / 20 = ${nf(mean,4)} mm`],'Summe durch 20.',.002),STP('Wie groß ist die Standardabweichung?',s,'mm',[`s = √(Σ(x − x̄)² / 19) = ${nf(s,4)} mm`],'Stichprobe: durch n − 1.',.02)]}}],
['Niederhalter: Spannweite und Grenzen um den Mittelwert',r=>{const mean=rg(r,100,110,.05),s=pk(r,[.05,.076,.1,.12]),mn=+(mean-s*pk(r,[3,3.4,3.5])).toFixed(3),mx=+(mean+s*pk(r,[3,3.5,3.9])).toFixed(3);return{intro:`Bei der Fertigung eines Niederhalters wird ein Längenmaß durch Stichproben überwacht. Die letzte Stichprobe ergab den kleinsten Wert ${nf(mn,5)} mm, den größten Wert ${nf(mx,5)} mm, den Mittelwert ${nf(mean,6)} mm und die Standardabweichung ${de(s)} mm. Eine Normalverteilung wird angenommen.`,steps:[STP('Wie groß ist die Spannweite?',mx-mn,'mm',[`R = ${nf(mx,5)} − ${nf(mn,5)} = ${nf(mx-mn,4)} mm`],'Größter minus kleinster Wert.'),STP('Welche obere Grenze schließt 68,26 % der Werte ein?',mean+s,'mm',[`x_o = x̄ + s = ${nf(mean,6)} + ${de(s)} = ${nf(mean+s,6)} mm`],'68,26 % entsprechen ±1σ.',.0005),STP('Welche untere Grenze schließt 68,26 % der Werte ein?',mean-s,'mm',[`x_u = x̄ − s = ${nf(mean-s,6)} mm`],'Untere Grenze.',.0005),STP('Welche obere Grenze schließt 95,45 % ein?',mean+2*s,'mm',[`x̄ + 2 · s = ${nf(mean+2*s,6)} mm`],'95,45 % entsprechen ±2σ.',.0005)]}}]
);

['Säuren & Basen','Welche Farbe zeigt Methylorange bei einem pH-Wert unter 3?',['Rot','Gelb','Blau','Farblos'],'Methylorange ist bei pH < 3,1 rot und bei pH > 4,4 gelb. Batteriesäure mit pH < 1 färbt den Indikator also rot.'],

['Säuren & Basen','Wie lässt sich der pH-Wert einer Lösung bestimmen?',['Mit Indikatorpapier oder einem pH-Meter','Mit einer Federwaage','Mit einem Thermometer','Mit einem Dichtemesser für Feststoffe'],'Indikatorpapier färbt sich je nach pH-Wert. Ein pH-Meter misst die Spannung zwischen zwei Elektroden (Potenziometrie).'],
['Neutralisation & Titration','Was entsteht bei der Neutralisation einer Säure mit einer Lauge?',['Salz und Wasser, die Reaktion setzt Wärme frei','Nur Wasser, die Reaktion nimmt Wärme auf','Ein Gas und ein Metall','Nur ein Salz ohne Wasser'],'Säure + Base → Salz + Wasser. Die Neutralisation ist exotherm. Am Neutralpunkt wird bei starken Säuren und Laugen ein pH-Wert von 7 erreicht.'],
['Blei-Batterie (Akkumulator)','Was muss bei zu niedrigem Flüssigkeitsstand im Blei-Akku nachgefüllt werden?',['Destilliertes Wasser','Konzentrierte Schwefelsäure','Leitungswasser','Salzsäure'],'Beim Laden verdunstet Wasser, die Säure bleibt. Daher wird nur destilliertes Wasser nachgefüllt. Mit Leitungswasser kämen Kalk und andere Ionen in die Zellen. Der pH-Wert steigt, weil die Säure verdünnt wird.'],
['Blei-Batterie (Akkumulator)','Wie sind Bleibatterien zu entsorgen?',['Beim Handel oder an Annahmestellen abgeben','Im Hausmüll','In den Gelben Sack','Im Bauschutt'],'Bleibatterien enthalten Blei (Schwermetall) und Schwefelsäure. Sie gelten als gefährlicher Abfall und müssen vom Handel zurückgenommen und fachgerecht verwertet werden.'],
['Blei-Batterie (Akkumulator)','Welche Schutzmaßnahmen gelten beim Umgang mit Batteriesäure?',['Schutzbrille, Handschuhe, Belüftung','Offenes Feuer zur Kontrolle','Nur Arbeitskleidung ohne Handschuhe','Rauchen zur Wärmeerzeugung'],'Batteriesäure ätzt Haut und Augen. Man trägt Schutzbrille und Handschuhe, arbeitet belüftet und bewahrt sie in vorgeschriebenen Behältern auf.'],
['Bindungstypen','Welche Eigenschaft passt zu Salzen?',['Trockene Kristalle sind Isolatoren, die wässrige Lösung leitet','Immer flüssig bei Raumtemperatur','Leiten als Feststoff Strom','Sind unlöslich in Wasser'],'Salze bilden Ionengitter mit hohem Schmelzpunkt. Im Kristall sind die Ionen fest, sie leiten erst in der Schmelze oder in Wasser gelöst.'],
['Korrosion','Was versteht man unter chemischer Korrosion?',['Einwirkung von Sauerstoff, Gasen, Säuren oder Salzen auf die Metalloberfläche unter Bildung von Verbindungen','Reaktion mit einem anderen Metall im Elektrolyt','Mechanischen Verschleiß','Auflösung durch Strom von außen'],'Bei der chemischen Korrosion entstehen Verbindungen wie Metalloxide (Rost). Ein Elektrolyt ist nicht nötig. Elektrochemische Korrosion braucht dagegen zwei Metalle und einen Elektrolyt.'],
['Korrosion','Welche Reihenfolge gilt bei einer Schutzlackierung einer Blechabdeckung?',['Reinigen und entfetten, Haftgrund, Grundierung, Decklack','Decklack, Grundierung, Haftgrund, Reinigen','Haftgrund, Reinigen, Decklack, Grundierung','Grundierung, Reinigen, Decklack, Haftgrund'],'Erst muss die Oberfläche sauber und fettfrei sein, dann folgen Haftgrund, Grundierung und zuletzt die Deckschicht.'],
['Korrosion','Wie lässt sich Korrosion schon bei der Konstruktion vermeiden?',['Spalten vermeiden und geeignete Werkstoffe kombinieren','Verschiedene Metalle direkt aneinanderlegen','Möglichst viele Fugen vorsehen','Die Oberfläche unbehandelt lassen'],'Spalten und Fugen sammeln Feuchtigkeit. Der direkte Kontakt unterschiedlich edler Metalle erzeugt Kontaktkorrosion. Besser sind Werkstoffauswahl, Isolierung und glatte Oberflächen.'],
['Korrosion','Wie vermeidet man Korrosion während Lagerung und Transport?',['Niedrige Luftfeuchtigkeit, konstante Temperatur, geeignete Verpackung','Möglichst feuchte Räume','Schwankende Temperaturen','Offene Lagerung neben Salz'],'Kondenswasser entsteht bei Temperaturschwankungen. Korrosionsschutzöl, Ölpapier und geschützte Verpackung helfen. Kontakt mit Salz und Schweiß vermeiden.'],
['Reaktionsgleichungen & Mol','Welche zwei Hauptbestandteile hat die Luft?',['Stickstoff (N₂) und Sauerstoff (O₂)','Kohlendioxid und Wasserstoff','Argon und Helium','Sauerstoff und Wasserdampf'],'Luft besteht zu etwa 78 % aus Stickstoff und zu etwa 21 % aus Sauerstoff. Der Rest sind Argon, CO₂ und Spuren anderer Gase.'],
['Reaktionsgleichungen & Mol','Wo entstehen Stickstoffoxide hauptsächlich?',['Bei Verbrennung bei hohen Temperaturen, zum Beispiel in Motoren und Heizungen','Bei der Photosynthese','Beim Schmelzen von Eis','Beim Lösen von Salz in Wasser'],'Bei hohen Temperaturen reagieren Stickstoff und Sauerstoff der Luft zu NO. Maßnahmen: weniger Verbrennung fossiler Brennstoffe, Elektromobilität, Wärmedämmung, Wärmepumpen.'],
['Elektrische Arbeit & Leistung','Was ist die Aufgabe eines FI-Schutzschalters?',['Personenschutz bei einem Fehlerstrom','Schutz vor Überlast der Leitung','Erhöhung der Spannung','Senkung des Stromverbrauchs'],'Der FI überwacht, ob im Hinleiter und Rückleiter derselbe Strom fließt. Fließt ein Teil über einen Menschen oder die Erde, löst er in Sekundenbruchteilen aus.'],
['Elektrische Arbeit & Leistung','Worin unterscheiden sich FI-Schutzschalter und Sicherung?',['Der FI schützt Menschen, die Sicherung schützt Leitung und Anlage vor zu hohem Strom','Beide schützen Menschen gleich gut','Die Sicherung erkennt Fehlerströme, der FI Überlast','Es gibt keinen Unterschied'],'Die Sicherung löst nur aus, wenn der Strom größer ist als zulässig. Sie erkennt nicht, ob Strom über einen Menschen fließt. Der FI vergleicht Hin- und Rückstrom.'],
['Wirkungsgrad','Warum kann der Wirkungsgrad einer Maschine nie größer oder gleich 1 sein?',['Weil bei jeder Umwandlung Verluste (meist Wärme) auftreten','Weil Energie neu entsteht','Weil Maschinen immer mehr Energie abgeben','Weil der Nutzen größer ist als der Aufwand'],'Energie kann nicht vernichtet oder erzeugt werden. Bei jeder Umwandlung geht ein Teil als Wärme verloren, deshalb ist η = Nutzen / Aufwand immer kleiner als 1.'],

['Reihe','Zwei Lampen für je 12 V hängen in Reihe an 24 V. An Lampe 1 liegen nur 10 V an. Was folgt daraus?',['Lampe 2 hat den größeren Widerstand und bekommt 14 V','Lampe 1 hat den größeren Widerstand','Beide Lampen haben dieselbe Spannung','Der Strom ist in Lampe 1 größer'],'Bei Reihenschaltung gilt U₁ + U₂ = 24 V und derselbe Strom. Die Spannung teilt sich im Verhältnis der Widerstände auf.'],

['Säuren & Basen','Eine Lösung färbt Bromthymolblau grün. Was weißt Du über den pH-Wert?',['Er liegt etwa bei 7 (neutral)','Er liegt bei 1','Er liegt bei 13','Er ist nicht bestimmbar'],'Grün ist die Mischfarbe aus Gelb (sauer) und Blau (alkalisch), also etwa neutral.'],

['Neutralisation & Titration','Du titrierst Salzsäure mit Natronlauge (starke Säure, starke Base). Welcher Indikator ist ein üblicher Kandidat?',['Phenolphthalein oder Bromthymolblau','Nur Methylorange','Keiner, man braucht keinen','Kein Indikator, nur Lackmuspapier in Wasser'],'Beim Äquivalenzpunkt springt der pH-Wert stark um 7 herum; Bromthymolblau (6–7,6) und Phenolphthalein (8,2–10) liegen im steilen Sprung.'],
