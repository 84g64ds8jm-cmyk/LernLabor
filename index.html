const ERK={
'Reihe':['Alle Widerstände hängen hintereinander an einem einzigen Strompfad. Durch jeden fließt derselbe Strom, die Spannung teilt sich im Verhältnis der Widerstände auf. Der Gesamtwiderstand ist größer als jeder Einzelwiderstand.',['Die Widerstände wie bei einer Parallelschaltung mit Kehrwerten verrechnen, statt sie zu addieren.','Die Spannung als überall gleich ansehen. Gleich ist hier der Strom.','kΩ und Ω oder mA und A nicht umrechnen.']],
'Parallel':['Jeder Zweig liegt an derselben Spannung. Die Zweigströme addieren sich zum Gesamtstrom. Der Gesamtwiderstand ist kleiner als der kleinste Einzelwiderstand.',['Die Widerstände einfach addieren.','Bei 1/R_ges = 1/R₁ + 1/R₂ am Ende den Kehrwert nicht bilden.','Die Zweigströme für gleich halten. Gleich ist hier die Spannung.']],
'Gemischt R₁+(R₂∥R₃)':['Erst die Parallelschaltung zu einem Ersatzwiderstand zusammenfassen, dann R₁ in Reihe addieren. Zurückrechnen: Gesamtstrom, Spannung an R₁, der Rest liegt an der Parallelschaltung.',['Die Reihenfolge verdrehen und R₁ zuerst mit R₂ addieren.','Die Spannung der Parallelschaltung mit der Gesamtspannung gleichsetzen.','Den Teilstrom durch R₂ mit dem Gesamtstrom verwechseln.']],
'Gemischt (R₁+R₂)∥R₃':['R₁ und R₂ bilden zusammen einen Zweig und liegen parallel zu R₃. Erst den Zweig addieren, dann die Parallelschaltung berechnen. Beide Zweige liegen an der vollen Spannung.',['R₃ mit R₁ oder R₂ einzeln parallel rechnen.','Den Strom im Zweig R₁+R₂ mit dem Gesamtstrom verwechseln.','Die Zweigspannung auf R₁ und R₂ nicht weiter aufteilen.']],
'Gemischt R₁+(R₂∥R₃)+R₄':['Erst R₂∥R₃ zu einem Ersatzwiderstand zusammenfassen, dann alle Reihenglieder R₁, R₂₃ und R₄ addieren. Mit dem Gesamtstrom lassen sich dann die Teilspannungen berechnen.',['R₄ vergessen oder in die Parallelschaltung einbauen.','Die Parallelschaltung nicht erst zusammenfassen.','Die Spannung an der Parallelschaltung aus der Gesamtspannung statt aus I · R₂₃ berechnen.']],
'Gemischt (R₁+R₂)∥(R₃+R₄)':['Zwei Reihenzweige liegen parallel an derselben Spannung. Erst jeden Zweig addieren, dann parallel zusammenfassen. Die Zweigströme folgen aus I = U / R_Zweig.',['Die vier Widerstände einzeln parallel rechnen.','Den Gesamtstrom auf beide Zweige gleich aufteilen.','Die Spannung an einem Einzelwiderstand mit der Zweigspannung gleichsetzen.']],
'Ohmsches Gesetz':['U = R · I: Bei gleichem Widerstand fließt mehr Strom, wenn die Spannung steigt. Das Gesetz gilt für ohmsche Bauteile, deren Widerstand konstant bleibt.',['Falsch umstellen (zum Beispiel I = U · R).','mA, kΩ und V nicht auf Grundeinheiten bringen.','Das Gesetz bei Glühlampen oder NTC-Fühlern als konstanten Widerstand anwenden.']],
'Elektrische Arbeit & Leistung':['P = U · I ist die Leistung, W = P · t die Energie. 1 kWh ist die Energie, die 1 kW in einer Stunde umsetzt. Der Zähler misst in kWh.',['Leistung (kW) und Energie (kWh) verwechseln.','Die Zeit in Minuten statt in Stunden einsetzen.','Beim Strompreis ct und € nicht umrechnen.']],
'Drehstrom (Stern & Dreieck)':['Drehstrom besteht aus drei um 120° versetzten Wechselspannungen. In Sternschaltung liegt an jedem Strang U_L / √3, in Dreieckschaltung die volle Außenleiterspannung. Dreieck leistet dreimal so viel wie Stern.',['Den Faktor √3 vergessen.','Außenleiterspannung und Strangspannung verwechseln.','Bei P = √3 · U · I · cos φ Strangwerte und Leiterwerte mischen.']],
[GW]:['Gleichstrom fließt immer in eine Richtung, Wechselstrom wechselt periodisch Richtung und Betrag. Für Wechselspannung nennt man den Effektivwert: Er heizt wie die gleich große Gleichspannung. Der Scheitelwert ist √2-mal größer.',['Effektivwert und Scheitelwert verwechseln. 230 V ist der Effektivwert.','Den Mittelwert einer Sinusspannung (null) mit dem Effektivwert gleichsetzen.','Frequenz f und Periodendauer T nicht als Kehrwerte behandeln.']],
'Hydraulik':['Flüssigkeiten lassen sich praktisch nicht zusammendrücken. Der Druck breitet sich überall gleich aus (p = F / A). Mit einem großen Kolben erhält man eine große Kraft, dafür ist der Weg entsprechend kürzer.',['Die Kolbenfläche mit dem Durchmesser statt mit A = π · d² / 4 rechnen.','cm² und m² oder bar und Pa nicht umrechnen.','Mit der Kraftübersetzung auch einen Energiegewinn erwarten. Der Weg wird dafür kürzer.']],
'Hebel':['Ein Hebel ist im Gleichgewicht, wenn die Drehmomente gleich sind: F₁ · l₁ = F₂ · l₂. Ein langer Hebelarm spart Kraft, kostet aber Weg.',['Die Länge des ganzen Hebels statt des Abstands zum Drehpunkt einsetzen.','Kräfte nehmen, die nicht senkrecht zum Hebelarm wirken.','Mm und m mischen.']],
'Rolle & Flaschenzug':['Die feste Rolle ändert nur die Richtung der Kraft. Eine lose Rolle halbiert die Kraft und verdoppelt den Weg. Bei n tragenden Seilen gilt F = G / n und s = n · h.',['Die tragenden Seilstücke falsch zählen. Das Seil, an dem man nach unten zieht, trägt nicht mit.','Die Reibung vergessen, wenn ein Wirkungsgrad gegeben ist.','Den Seilweg mit der Hubhöhe gleichsetzen.']],
'Reibung (schiefe Ebene)':['Die Gewichtskraft zerfällt in die Hangabtriebskraft (parallel zur Ebene) und die Normalkraft (senkrecht). Die Reibung F_R = μ · F_N wirkt der Bewegung entgegen.',['sin und cos vertauschen.','Die Reibung mit dem Gewicht statt mit der Normalkraft F_N berechnen.','Den Taschenrechner im Bogenmaß (RAD) lassen.']],
'Beschleunigung & Bremsen':['Bei gleichmäßiger Beschleunigung gilt v = a · t und s = ½ · a · t². Beim Bremsen ist a die Verzögerung als positiver Betrag. Geschwindigkeiten immer in m/s einsetzen.',['km/h nicht in m/s umrechnen (÷ 3,6).','Den Faktor ½ bei s = ½ · a · t² vergessen.','Den Weg mit der Geschwindigkeit verwechseln.']],
'Kreisbewegung':['Die Umlaufgeschwindigkeit ist v = ω · r = 2 · π · r · n. Die Winkelgeschwindigkeit ω = 2 · π · n gibt an, wie viele Radiant pro Sekunde überstrichen werden.',['Die Drehzahl in 1/min nicht in 1/s umrechnen.','Den Durchmesser statt des Radius einsetzen.','ω in rad/s mit n in 1/s gleichsetzen. Es liegt der Faktor 2π dazwischen.']],
'Sinus & Kosinus':['Sinus und Kosinus beschreiben, wie ein Punkt auf dem Kreis auf eine Achse projiziert wird. Beide schwanken zwischen −1 und +1 und sind um 90° gegeneinander verschoben.',['Taschenrechner im falschen Modus (RAD statt DEG).','Gegenkathete und Ankathete vertauschen.','Amplitude und Spitze-Spitze-Wert verwechseln.']],
'Schwingung':['Eine Schwingung wird durch Amplitude, Frequenz f und Periodendauer T = 1 / f beschrieben. Mehr Schwingungen pro Sekunde bedeuten eine kürzere Periode.',['f und T nicht als Kehrwerte behandeln.','Kreisfrequenz ω = 2 · π · f mit f gleichsetzen.','Hz und 1/min mischen.']],
'Aggregatzustand':['Beim Schmelzen und Verdampfen nimmt der Stoff Energie auf, ohne dass die Temperatur steigt. Erst wenn der Wechsel abgeschlossen ist, steigt die Temperatur weiter.',['Die Umwandlungswärme (Schmelzen, Verdampfen) vergessen.','Für Eis, Wasser und Dampf dieselbe spezifische Wärmekapazität nehmen.','°C und K mischen.']],
'Drehmoment':['M = F · r · sin α: Nur der Anteil der Kraft senkrecht zum Hebelarm dreht. Bei 90° ist das Drehmoment am größten.',['Den Winkel vergessen, wenn die Kraft schräg angreift.','cm statt m einsetzen.','Drehmoment (N·m) und Arbeit (J) verwechseln, obwohl beide dieselbe Einheit haben.']],
'Gleit-, Haft- & Rollreibung':['Die Haftreibung hält den Körper bis F = μ₀ · F_N. Danach wirkt die kleinere Gleitreibung. Rollen braucht die geringste Kraft. Die Reibungskraft hängt nicht von der Größe der Auflagefläche ab.',['Haftreibungszahl für einen schon gleitenden Körper verwenden.','Vermuten, dass eine größere Auflagefläche mehr Reibung bringt.','Die Normalkraft F_N auf der schiefen Ebene mit dem Gewicht gleichsetzen.']],
'Schiefe Ebene':['Eine geneigte Ebene spart Kraft, kostet aber Weg. Hangabtrieb F_H = G · sin α, Normalkraft F_N = G · cos α.',['sin und cos vertauschen.','Mit der Masse statt der Gewichtskraft rechnen.','Die Reibung vergessen.']],
'Gesetz von Hooke':['F = D · s: Die Federkraft wächst proportional zur Auslenkung. D ist die Federkonstante, zum Beispiel in N/mm. Das gilt nur im elastischen Bereich.',['mm und m mischen.','Die Federlänge statt der Längenänderung einsetzen.','Die Federkonstante bei Reihen- und Parallelschaltung falsch kombinieren.']],
'Druck':['p = F / A. 1 bar = 10⁵ Pa = 10 N/cm². Überdruck wird gegenüber der Umgebung gemessen, der absolute Druck vom Vakuum aus.',['Überdruck und absoluten Druck verwechseln.','cm² und m² nicht umrechnen.','bar, Pa und N/mm² durcheinanderbringen.']],
'Gasgesetze':['Bei einer festen Gasmenge bleibt p · V / T konstant. Die Temperatur muss in Kelvin eingesetzt werden, der Druck als absoluter Druck.',['Temperatur in °C statt in K einsetzen.','Überdruck statt absoluten Druck verwenden.','Liter und m³ mischen.']],
'Auftrieb und Dichte':['Der Auftrieb ist die Gewichtskraft der verdrängten Flüssigkeit: F_A = ρ_Fl · V · g. Ein Körper schwimmt, wenn seine Dichte kleiner ist als die der Flüssigkeit.',['Beim Schwimmen das ganze statt des eingetauchten Volumens nehmen.','g/cm³ und kg/m³ verwechseln.','Den Auftrieb mit dem Gewicht des Körpers gleichsetzen, wenn er sinkt.']],
'Gleichförmige Bewegung':['Bei konstanter Geschwindigkeit gilt s = v · t. Die Geschwindigkeit ändert sich nicht, es gibt keine Beschleunigung.',['km/h und m/s mischen.','Bei Begegnungsaufgaben die Wege nicht addieren.','Durchschnittsgeschwindigkeit mit einem Mittelwert aus zwei Geschwindigkeiten verwechseln.']],
'Freier Fall (mit Luftwiderstand)':['Im Vakuum fallen alle Körper gleich schnell: v = g · t, s = ½ · g · t². In Luft bremst der Luftwiderstand. Feder und Kugel fallen dann verschieden, weil Masse und Fläche unterschiedlich sind.',['Glauben, dass schwere Körper im Vakuum schneller fallen.','Den Faktor ½ bei s = ½ · g · t² vergessen.','Die Endgeschwindigkeit in Luft mit der im Vakuum gleichsetzen.']],
'Kraftgesetz F = m · a':['F = m · a: Beschleunigt wird durch die resultierende Kraft, also alle Kräfte zusammen. Die Gewichtskraft ist F_G = m · g.',['Die Gegenkraft (zum Beispiel Reibung) nicht abziehen.','Masse in t statt in kg einsetzen.','Masse und Gewichtskraft verwechseln.']],
'Arbeit & Leistung':['W = F · s mit der Kraft in Wegrichtung, P = W / t. Die Einheit der Arbeit ist Joule (J = N·m), die der Leistung Watt (W = J/s).',['Die Kraftkomponente nicht in Wegrichtung nehmen.','Die Zeit in Minuten statt in Sekunden einsetzen.','Leistung und Arbeit verwechseln.']],
'Energieformen & Erhaltung':['Lageenergie E = m · g · h, Bewegungsenergie E = ½ · m · v². Ohne Reibung bleibt die Summe konstant, mit Reibung wird ein Teil zu Wärme.',['Beim Quadrat von v oder beim Faktor ½ Fehler machen.','Die Höhe nicht auf das richtige Bezugsniveau beziehen.','Die Reibungswärme vergessen.']],
'Wirkungsgrad':['η = Nutzen / Aufwand ist immer kleiner als 1 (kleiner als 100 %). Bei hintereinandergeschalteten Maschinen werden die Wirkungsgrade multipliziert.',['Prozent und Faktor mischen (80 statt 0,8).','Wirkungsgrade in einer Kette addieren statt multiplizieren.','Zu- und Nutzenergie vertauschen.']],
'Wärmeausdehnung':['ΔL = α · L₀ · ΔT: Längenänderung wächst mit Länge und Temperaturunterschied. Flüssigkeiten dehnen sich stärker aus, Volumen γ ≈ 3 · α.',['Die Endtemperatur statt der Temperaturdifferenz einsetzen.','µm, mm und m mischen.','Den Längenausdehnungskoeffizienten α mit dem Volumenausdehnungskoeffizienten γ verwechseln.']],
'Wärmekapazität':['Q = m · c · ΔT. Wasser hat eine besonders große spezifische Wärmekapazität (4,18 kJ/(kg·K)).',['kJ und kWh verwechseln (1 kWh = 3600 kJ).','Die Masse nicht in kg einsetzen.','ΔT falsch bilden. Die Differenz in K und in °C ist gleich.']],
'Schmelz- & Verdampfungswärme':['Beim Schmelzen und Verdampfen gilt Q = m · q. Die Temperatur bleibt während des Wechsels konstant. Die Siedetemperatur hängt vom Druck ab.',['Nur m · c · ΔT rechnen und die Umwandlungswärme vergessen.','Bei Eis zuerst auf 0 °C erwärmen, dann schmelzen, dann weiter erwärmen.','q und c verwechseln.']],
'Mischungstemperatur':['Die abgegebene Wärme gleich der aufgenommenen: m₁ · c₁ · (ϑ₁ − ϑ_m) = m₂ · c₂ · (ϑ_m − ϑ₂). Die Mischtemperatur liegt immer zwischen den beiden Ausgangstemperaturen.',['Die Differenzen mit falschem Vorzeichen bilden.','Verschiedene spezifische Wärmekapazitäten ignorieren.','Ein Ergebnis außerhalb der beiden Ausgangstemperaturen nicht als Fehler erkennen.']],
'Steuerung oder Regelung (Heizung)':['Eine Steuerung wirkt in einer offenen Kette ohne Messung des Ergebnisses. Eine Regelung misst den Istwert, vergleicht ihn mit dem Sollwert und korrigiert in einem geschlossenen Kreis.',['Steuerung und Regelung verwechseln.','Stellgröße und Störgröße verwechseln.','Sollwert und Istwert vertauschen.']],
'Zug-/Druckspannung & Sicherheit':['σ = F / A. Die Sicherheit ist S = R_e / σ und muss größer als 1 sein, in der Praxis meist 1,5 bis 3.',['Den Querschnitt mit Bohrung nicht verkleinern.','Durchmesser und Radius in A = π · d² / 4 verwechseln.','N/mm² und MPa als verschieden ansehen. Beide sind gleich.']],
'Scherung & Flächenpressung':['Scherspannung τ = F / A_s mit der Scherfläche, Flächenpressung p = F / (d · t) mit der projizierten Fläche. Bei zweischnittigen Verbindungen verteilt sich die Kraft auf zwei Flächen.',['Die Anzahl der Scherflächen (einschnittig oder zweischnittig) falsch ansetzen.','Bei der Flächenpressung die Bohrungsfläche statt d · t nehmen.','N, kN und mm² mischen.']],
'Kräfteparallelogramm':['Zwei Kräfte ergeben als Resultierende die Diagonale des Parallelogramms. Die Beträge dürfen nur bei gleicher Richtung einfach addiert werden.',['Die Beträge der Kräfte einfach addieren.','Den falschen Winkel zwischen den Kräften einsetzen.','Den Kosinussatz mit dem Pythagoras verwechseln.']],
'Kräftezerlegung (Seilkräfte)':['Eine schräge Kraft wird in zwei Komponenten zerlegt: F_x = F · cos α, F_y = F · sin α (α zur Waagerechten). Je flacher ein Seil hängt, desto größer ist die Seilkraft.',['sin und cos vertauschen.','Den Winkel zur falschen Achse messen.','Bei zwei Seilen das Gewicht einfach halbieren, obwohl die Winkel unterschiedlich sind.']],
'Hydraulische Leistung & Volumenstrom':['Hydraulische Leistung P = p · Q, Volumenstrom Q = A · v. Mit dem Wirkungsgrad erhält man die Antriebsleistung der Pumpe.',['l/min nicht in m³/s umrechnen.','bar nicht in Pa umrechnen.','Die Wirkungsgrade vergessen.']],
'Pneumatik: Luftverbrauch':['Der Luftverbrauch folgt aus Kolbenfläche, Hub, Hubzahl und dem Verdichtungsverhältnis (p_e + p_amb) / p_amb. Bei doppeltwirkenden Zylindern wird beim Ausfahren und Einfahren Luft verbraucht.',['Überdruck statt absoluten Druck für das Verdichtungsverhältnis nehmen.','Doppeltwirkend wie einfachwirkend rechnen.','Die Kolbenstangenfläche beim Einfahren nicht abziehen.']],
'Gasdichte (Normzustand → Betrieb)':['Die Dichte eines Gases ändert sich mit Druck und Temperatur: ρ₂ = ρ₁ · (p₂ / p₁) · (T₁ / T₂). Normzustand: 0 °C (273,15 K), 1013 mbar.',['°C statt K einsetzen.','Überdruck mit absolutem Druck verwechseln.','T₁ und T₂ im Bruch vertauschen.']],
'Säuren & Basen':['pH = −lg c(H₃O⁺). Neutral ist pH 7, sauer darunter, basisch darüber. pH + pOH = 14. Bei starken Säuren senkt jede Verdünnung auf ein Zehntel den pH-Wert um 1. Indikatoren zeigen den pH nur in ihrem Umschlagbereich an: Phenolphthalein 8,2–10, Methylorange 3,1–4,4, Bromthymolblau 6–7,6, Lackmus 5–8; der Universalindikator deckt pH 0–14 ab.',['ln statt lg verwenden.','Bei Laugen vom pOH nicht auf den pH umrechnen.','Konzentrationen in mmol/l und mol/l mischen.']],
'Korrosion':['Beim Kontakt zweier Metalle in einem Elektrolyten wird das unedlere oxidiert (Anode, löst sich auf), das edlere wird geschützt (Kathode). Opferanoden nutzen das aus.',['Anode und Kathode vertauschen.','Meinen, das edlere Metall korrodiert.','Vergessen, dass ein Elektrolyt (zum Beispiel feuchte Luft) nötig ist.']],
'Atommodell':['Der Kern besteht aus Protonen und Neutronen, die Hülle aus Elektronen. Die Ordnungszahl Z ist die Protonenzahl, die Massenzahl A die Summe aus Protonen und Neutronen.',['Die Neutronenzahl nicht als N = A − Z berechnen.','Elektronen und Protonen bei Ionen gleich setzen.','Z und A vertauschen.']],
'Bindungstypen':['Ionenbindung: Metall und Nichtmetall (Salze). Atombindung: Nichtmetalle teilen Elektronenpaare. Metallbindung: Metallatome mit frei beweglichen Elektronen. Der Bindungstyp folgt aus dem Unterschied der Elektronegativität.',['Salze als Moleküle ansehen. Sie bilden Ionengitter.','Behaupten, feste Salze leiten Strom. Erst Schmelze oder Lösung tun das.','Atombindung und Ionenbindung verwechseln.']],
'Periodensystem':['Die Periode (Zeile) gibt die Zahl der Elektronenschalen an, die Hauptgruppe die Zahl der Außenelektronen. Metalle stehen links, Nichtmetalle rechts, Edelgase ganz rechts.',['Perioden und Gruppen verwechseln.','Die Zahl der Außenelektronen mit der Periodennummer gleichsetzen.','Wasserstoff in die Gruppe der Alkalimetalle einordnen.']],
'Reaktionsgleichungen & Mol':['Die Stoffmenge n = m / M. Die Koeffizienten der ausgeglichenen Reaktionsgleichung geben das Stoffmengenverhältnis an. Das Molvolumen von Gasen ist etwa 24 l/mol.',['Die Gleichung nicht ausgleichen.','m, n und M vertauschen.','Das Molvolumen mit der falschen Temperatur oder dem falschen Druck verwenden.']],
'Neutralisation & Titration':['Am Äquivalenzpunkt sind n(H⁺) und n(OH⁻) gleich. Bei einprotonigen Säuren und Basen gilt c_S · V_S = c_B · V_B. Das Volumen der Maßlösung wird abgelesen.',['Mehrprotonige Säuren (zum Beispiel H₂SO₄) nicht mit z = 2 berücksichtigen.','ml und l mischen.','Meinen, der Äquivalenzpunkt liege immer bei pH 7. Das gilt nur für starke Säuren und Basen.']],
'Oxidationszahlen':['Elemente haben die Oxidationszahl 0, Sauerstoff meist −II, Wasserstoff meist +I. Die Summe aller Zahlen ergibt die Ladung des Teilchens. Oxidation: Zahl steigt, Reduktion: Zahl sinkt.',['Die Summe nicht gegen die Ladung prüfen.','Oxidation und Reduktion vertauschen.','Peroxide (O = −I) übersehen.']],
'Galvanische Zelle & Spannungsreihe':['Die Zellspannung ist U = E(Kathode) − E(Anode). Das unedlere Metall (kleineres E⁰) bildet die Anode und wird oxidiert.',['Das Vorzeichen falsch bilden.','Anode und Kathode vertauschen.','Standardpotenziale für beliebige Konzentrationen und Temperaturen halten.']],
'Elektrolyse':['Nach Faraday gilt m = M · I · t / (z · F) mit F = 96 485 C/mol. Je Ion werden z Elektronen übertragen. Die Ladung ist Q = I · t.',['Die Zeit nicht in Sekunden einsetzen.','Die Ionenwertigkeit z (zum Beispiel 2 bei Cu²⁺) vergessen.','Annehmen, dass der Strom vollständig zur Abscheidung genutzt wird, obwohl Verluste angegeben sind.']],
'Wasserhärte':['Die Gesamthärte stammt von Calcium- und Magnesiumionen. 1 mmol/l Erdalkali-Ionen entsprechen 5,6 °dH. Beim Erhitzen fällt Kalk (CaCO₃) aus.',['mg/l nicht in mmol/l umrechnen (durch die Molmasse teilen).','Calcium und Magnesium nicht addieren.','Wasserhärte und pH-Wert verwechseln.']],
'Blei-Batterie (Akkumulator)':['Beim Entladen bilden sich an beiden Platten Bleisulfat, die Schwefelsäure verdünnt sich. Eine Zelle liefert etwa 2 V, sechs Zellen in Reihe 12 V. Beim Laden läuft die Reaktion umgekehrt.',['Zellen und Gesamtspannung verwechseln.','Meinen, die Säuredichte steige beim Entladen.','Entladen und Laden vertauschen.']],
'Mittelwert, Median & Modalwert':['Der Mittelwert ist die Summe geteilt durch die Anzahl, der Median der mittlere Wert der sortierten Reihe, der Modalwert der häufigste. Ausreißer beeinflussen den Mittelwert stark, den Median kaum.',['Den Median aus nicht sortierten Werten ablesen.','Bei gerader Anzahl nicht die beiden mittleren Werte mitteln.','Bei Klassen die Klassenmitte statt der Einzelwerte vergessen.']],
'Spannweite, Varianz & Standardabweichung':['Die Spannweite ist R = x_max − x_min. Die Standardabweichung s = √(Σ(x − x̄)² / (n − 1)) misst die Streuung um den Mittelwert und hat dieselbe Einheit wie die Messwerte.',['Durch n statt durch n − 1 teilen (bei Stichproben).','Das Quadrat oder die Wurzel vergessen.','Varianz und Standardabweichung verwechseln.']],
'Normalverteilung':['Die Normalverteilung ist symmetrisch um den Mittelwert μ. Etwa 68,3 % der Werte liegen innerhalb ±1σ, 95,4 % innerhalb ±2σ und 99,7 % innerhalb ±3σ.',['z = (x − μ) / σ falsch bilden.','Die Fläche links und rechts verwechseln.','σ mit der Varianz σ² verwechseln.']],
'σ-Bereiche':['Die σ-Bereiche geben an, wie viel Prozent der Werte um den Mittelwert liegen. Einseitig ist der Anteil halb so groß wie zweiseitig.',['Zweiseitige und einseitige Anteile verwechseln.','Die Prozentwerte falsch addieren.','Den Bereich ±3σ als alle Werte ansehen. Es sind 99,73 %.']],
'Von der Glocke zum Netz':['Trägt man die Summenhäufigkeit einer Normalverteilung auf, entsteht eine S-Kurve. Das Wahrscheinlichkeitsnetz streckt die Achse so, dass daraus eine Gerade wird.',['Die Häufigkeit statt der Summenhäufigkeit einzeichnen.','Die Klassenobergrenze mit der Klassenmitte verwechseln.','Meinen, nur normalverteilte Daten ergäben eine Gerade. Genau das ist der Test auf Normalverteilung.']],
'Wahrscheinlichkeitsnetz':['Im Netz liest man bei 50 % den Mittelwert μ ab und bei 84,13 % den Wert μ + σ. Der Abstand der beiden ist die Standardabweichung σ. Eine Gerade zeigt Normalverteilung an.',['Die Achsen vertauschen.','Statt 84,13 % den Wert 97,5 % nehmen und nicht auf 2σ umrechnen.','Die Gerade nicht durch die Punkte, sondern zum Beispiel durch den Rand legen.']],
'Prozess- & Maschinenfähigkeit':['Cp = (OSG − USG) / (6 · σ) bewertet die Streuung, Cpk = min(OSG − μ, μ − USG) / (3 · σ) zusätzlich die Lage. Ab 1,33 gilt ein Prozess meist als fähig.',['Cp und Cpk verwechseln.','Die Toleranz mit der Streuung gleichsetzen.','Bei Cpk den Abstand zur falschen Grenze nehmen.']],
'Qualitätsregelkarte (x̄-Karte)':['Die x̄-Karte zeigt die Mittelwerte von Stichproben über der Zeit mit Warn- und Eingriffsgrenzen. Sie erkennt Verschiebungen oft früh, bevor Ausschuss entsteht.',['Eingriffsgrenzen mit Toleranzgrenzen verwechseln.','Trends und Serien nicht beachten.','Die Grenzen mit Einzelwerten statt mit Stichprobenmittelwerten berechnen.']],
'Histogramm':['Das Histogramm zeigt, wie sich Messwerte auf Klassen verteilen. Seine Form zeigt Lage, Streuung und Schiefe der Verteilung.',['Die Klassenbreite ungleichmäßig wählen.','Absolute und relative Häufigkeit mischen.','Die Klassenzahl zu klein oder zu groß wählen.']],
'Prozentrechnung':['Der Prozentwert ist ein Teil des Grundwerts: W = G · p / 100. Der Grundwert ist immer das Ganze (100 %). Bei Rabatt rechnet man mit dem Faktor (1 − p/100), bei Aufschlag mit (1 + p/100).',['Den falschen Grundwert nehmen. Bei Zuwachs ist das der Anfangswert.','Prozente mit verschiedenen Grundwerten addieren (+20 % und −20 % ergeben nicht 0).','Prozentpunkte und Prozent verwechseln.']],
'Dreisatz (proportional & umgekehrt)':['Beim Dreisatz erst auf die Einheit schließen, dann hochrechnen. Proportional: mehr gibt mehr. Umgekehrt proportional: mehr gibt weniger, das Produkt bleibt gleich.',['Proportional und umgekehrt proportional verwechseln.','Den Schritt auf die Einheit (1) überspringen.','Die Einheiten der beiden Größen nicht prüfen.']],
'Pythagoras & rechtwinkliges Dreieck':['Im rechtwinkligen Dreieck gilt a² + b² = c². Die Hypotenuse c liegt dem rechten Winkel gegenüber und ist die längste Seite. Mit sin, cos und tan verbindet man Winkel und Seiten.',['Eine Kathete als Hypotenuse einsetzen.','Den Taschenrechner auf RAD statt DEG lassen.','Gegenkathete und Ankathete vertauschen.']],
'Formeln umstellen (Formeldreieck)':['Beim Umstellen tut man auf beiden Seiten dasselbe. Bei Produkten X = A · B teilt man durch den Faktor, den man nicht sucht. Das Formeldreieck zeigt das auf einen Blick.',['Nur eine Seite verändern.','Die Einheiten nicht mitrechnen und vorher nicht angleichen.','Klammern und Brüche beim Umstellen falsch auflösen.']],
'Kraftwerke im Überblick':['Kraftwerke wandeln Primärenergie (Kohle, Uran, Wind, Sonne, Wasser) über Wärme oder Bewegung in elektrische Energie um. Man unterscheidet Grund-, Mittel- und Spitzenlast.',['Primärenergie, Endenergie und Nutzenergie verwechseln.','Installierte Leistung und erzeugte Energie (Volllaststunden) gleichsetzen.','Den Wirkungsgrad vergessen.']],
'Dampfkraftwerk (Wärmekraftwerk)':['Kessel erzeugt Dampf, Turbine treibt den Generator, im Kondensator wird der Dampf wieder zu Wasser. Der Wirkungsgrad liegt bei etwa 40 %, der Rest geht als Abwärme am Kondensator ab.',['Den Kondensator für einen Teil der Stromerzeugung halten. Er gibt Abwärme ab.','Die Wirkungsgradkette nicht multiplizieren.','Brennstoffleistung und elektrische Leistung verwechseln.']],
'Kernkraftwerk (Druckwasserreaktor)':['Die Kernspaltung erzeugt Wärme. Im Druckwasserreaktor gibt das Primärwasser sie an einen Dampfkreislauf ab. Der Massendefekt folgt aus E = Δm · c².',['Moderator und Kühlmittel verwechseln. Beim Druckwasserreaktor ist Wasser beides.','E = Δm · c² mit falschen Einheiten (kg und m/s) rechnen.','Steuerstäbe als Brennstoff ansehen.']],
'Wasserkraftwerke':['Die Leistung ist P = η · ρ · g · Q · H. Laufwasser nutzt kleine Höhen mit viel Wasser, Speicher- und Pumpspeicherwerke nutzen große Höhen. Pumpspeicher sind Speicher, keine Erzeuger.',['Fallhöhe und Staumauerhöhe verwechseln. Nutzfallhöhe zählt.','Den Volumenstrom nicht in m³/s einsetzen.','Pumpspeicher als zusätzliche Energiequelle ansehen.']],
'Windkraftanlage':['Die Windleistung ist P = ½ · ρ · A · v³ · c_p. Der Betz-Wert begrenzt die Nutzung auf höchstens 59,3 %. Die Leistung wächst mit der dritten Potenz der Windgeschwindigkeit.',['Die doppelte Windgeschwindigkeit für die doppelte Leistung halten. Es ist das Achtfache.','Rotorradius und Durchmesser in A = π · r² verwechseln.','Den Leistungsbeiwert c_p vergessen.']],
'Photovoltaik':['Solarzellen wandeln Licht direkt in Gleichstrom um. Ein Wechselrichter speist ihn ins Netz. Die Nennleistung wird in kWp angegeben.',['kWp (Spitzenleistung) und kWh (Jahresenergie) verwechseln.','Den Einfluss von Ausrichtung und Neigung ignorieren.','Zellwirkungsgrad mit Anlagenwirkungsgrad gleichsetzen.']],
'Solarthermie':['Kollektoren erwärmen ein Wärmeträgermedium, das die Wärme an einen Speicher abgibt. Es entsteht Wärme, kein Strom. Q = m · c · ΔT.',['Photovoltaik und Solarthermie verwechseln.','Speicherverluste vergessen.','Wärme (kWh thermisch) mit Strom (kWh elektrisch) gleichsetzen.']],
'Geothermie':['Die Temperatur steigt mit der Tiefe um etwa 3 K pro 100 m. Tiefe Geothermie liefert Wärme oder Strom, oberflächennahe nutzt Wärmepumpen.',['Meinen, Wärmepumpen brauchten keinen Strom.','Tiefe und Temperatur falsch zusammenhängen.','Den COP (Verhältnis von Wärme zu Strom) vergessen.']],
'Brennstoffzelle (Wasserstoff)':['Eine Brennstoffzelle wandelt Wasserstoff und Sauerstoff direkt in Strom und Wasser um (2 H₂ + O₂ → 2 H₂O). Der Wirkungsgrad liegt bei etwa 50 bis 60 %, eine Zelle liefert rund 1 V.',['Brennstoffzelle und Batterie verwechseln. Der Brennstoff wird laufend zugeführt.','Wasserstoff als Primärenergiequelle ansehen. Er ist ein Energieträger.','Die Zellen beim Zusammenschalten nicht in Reihe rechnen.']],
'Biogasanlage mit BHKW':['In der Biogasanlage vergären Reststoffe zu Methan. Das Blockheizkraftwerk (BHKW) erzeugt daraus gleichzeitig Strom und Wärme. Das spart Brennstoff gegenüber getrennter Erzeugung.',['Elektrischen und thermischen Wirkungsgrad addieren und für Strom nutzen.','Heizwert und Brennwert verwechseln.','Methangehalt und Biogasmenge verwechseln.']],
'Verbrennungsmotor (Viertakt)':['Ansaugen, Verdichten, Arbeiten, Ausstoßen: Ein Arbeitsspiel braucht vier Takte und zwei Kurbelwellenumdrehungen. Nur im dritten Takt entsteht Arbeit.',['Takt und Umdrehung verwechseln.','Meinen, jeder Takt liefere Arbeit.','Den Wirkungsgrad (etwa 30 %) mit der Wärmeausbeute verwechseln.']]

 $('#fs').innerHTML=['Übersicht',...FA,'✎ Üben','🎓 Prüfungsaufgaben','🗣 Mündliche Prüfung',SIM&&!SIM.done?'⏱ Prüfungssimulation ●':'⏱ Prüfungssimulation','📈 Lernstand'+(memDueCount()?' ('+memDueCount()+')':'')].map((n,k)=>`<button type="button" data-k="${k}" aria-pressed="${k===0?hm:k===last?prac&&!PS.exam:k===last+1?prac&&!!PS.exam&&!PS.oral:k===last+2?prac&&!!PS.oral:k===last+3?SIMV:k===last+4?MEMV:(cur>=0&&k===fi+1)}">${n}</button>`).join('');
 $('#fs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k===0){cur=-1;prac=false;nav()}else if(k===last)openPractice('Alle');else if(k===last+1)openExam();else if(k===last+2)openOral();else if(k===last+3)simOpen();else if(k===last+4)memOpen();else go(M.findIndex(m=>m.F===FA[k-1]))});
 if(cur<0)return;
 const f=M[cur].F;
 $('#gs').innerHTML=ORD[f].filter(g=>M.some(m=>m.F===f&&m.g===g)).map(g=>`<button type="button" data-g="${g}" aria-pressed="${M[cur].g===g}">${g}</button>`).join('');
 $('#gs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(M.findIndex(m=>m.F===f&&m.g===b.dataset.g)));
 $('#ms').innerHTML=M.map((m,i)=>m.F===f&&m.g===M[cur].g?`<button type="button" data-i="${i}" aria-pressed="${i===cur}">${m.name}</button>`:'').join('');
 $('#ms').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
/* Suche */
const nz=s=>String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
const HAY=M.map(m=>nz([m.name,m.g,m.F,m.desc,(FX[m.name]||[]).join(' ')].join(' ')));
function search(){const q=nz($('#q').value).trim().split(/\s+/).filter(Boolean),sr=$('#sr');if(!q.length){sr.hidden=true;return}
 const res=M.map((m,i)=>[i,q.every(w=>HAY[i].includes(w))?(nz(m.name).includes(q[0])?0:1):9]).filter(x=>x[1]<9).sort((a,b)=>a[1]-b[1]).slice(0,12);
 sr.innerHTML=res.length?res.map(([i])=>`<button type="button" class="chip" data-i="${i}">${M[i].name} <small>${M[i].F}</small></button>`).join(''):'<span class="sub">Nichts gefunden. Versuche ein anderes Stichwort oder eine Formel.</span>';sr.hidden=false;
 sr.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('#q').value='';sr.hidden=true;go(+b.dataset.i)})}
$('#q').oninput=search;$('#q').onkeydown=e=>{if(e.key==='Enter'){const b=$('#sr').querySelector('.chip');if(b&&b.click)b.click()}else if(e.key==='Escape'){$('#q').value='';search()}};
/* Übungsmodus */
const gfach=n=>n==='Einheiten umrechnen'?FU:(M.find(m=>m.name===n)||{}).F,unitMod=()=>M.findIndex(m=>m.F===FU);
const hasPr=m=>m.F===FU||!!GEN[m.name]||!!STEPS[m.name]||MCQ.some(x=>x[0]===m.name);
let KIND='all';
const KT=[['all','Alle Aufgabentypen'],['num','Rechnen'],['steps','Mehrschritt'],['mc','Ankreuzen'],['und','Verständnis']];
function buildSel(){if(PS.oral){$('#pf').hidden=true;$('#pk').innerHTML=['Alle','Chemie','Physik','Energie','Elektrotechnik','Statistik','Mathematik'].map(c=>`<option value="${c}"${c===PS.cat?' selected':''}>${c==='Alle'?'Alle Themen':c}</option>`).join('');$('#pk').hidden=false;return}$('#pf').hidden=false;if(PS.exam){const o=[['W:*','Zufällige Aufgabe'],...EXW.map((t,i)=>['W:'+i,t[0]])];$('#pf').innerHTML=o.map(([v,t])=>`<option value="${v}"${v===PS.sel?' selected':''}>${t}</option>`).join('');$('#pk').innerHTML=['Alle','Chemie','Physik','Energie','Elektrotechnik','Statistik','Mathematik'].map(c=>`<option value="${c}"${c===PS.cat?' selected':''}>${c==='Alle'?'Alle Themen':c}</option>`).join('');$('#pk').hidden=true;return}$('#pk').hidden=false;const o=[['Alle','Alle Fächer'],...FA.map(f=>['F:'+f,f])];if(PS.sel.startsWith('M:'))o.push([PS.sel,'Dieses Thema: '+PS.sel.slice(2)]);if(PS.sel==='D:')o.push(['D:','Fällige Wiederholungen']);
 $('#pf').innerHTML=o.map(([v,t])=>`<option value="${v}"${v===PS.sel?' selected':''}>${t}</option>`).join('');
 $('#pk').innerHTML=KT.map(([v,t])=>`<option value="${v}"${v===KIND?' selected':''}>${t}</option>`).join('')}
function openPractice(sel,kind){prac=true;cur=-1;PS.exam=false;PS.oral=false;PS.sel=sel;KIND=kind||'all';$('#ph2').textContent='✎ Übungsmodus';buildSel();nav();newQ()}
function openOral(){prac=true;cur=-1;PS.exam=true;PS.oral=true;PS.sel='O:*';PS.cat='Alle';$('#ph2').textContent='🗣 Mündliche Prüfung';buildSel();nav();newQ()}
function openExam(){prac=true;cur=-1;PS.exam=true;PS.oral=false;PS.sel='W:*';PS.cat='Alle';$('#ph2').textContent='🎓 Prüfungsaufgaben';buildSel();nav();newQ()}
function match(n){const s=PS.sel;if(s==='Alle')return true;if(s==='D:')return(PS.due||[]).includes(n);if(s.startsWith('F:'))return gfach(n)===s.slice(2);const t=s.slice(2),mm=M.find(m=>m.name===t);return n===t||(n==='Einheiten umrechnen'&&!!mm&&mm.F===FU)}
function poolQ(){const p=[],add=(k,n)=>{if((KIND==='all'||KIND===k)&&match(n))p.push([k,n])};Object.keys(GEN).forEach(n=>{add('num',n);add('mc',n)});Object.keys(STEPS).forEach(n=>add('steps',n));[...new Set(MCQ.map(x=>x[0]))].forEach(n=>add('und',n));return p}
function newExamQ(){const s=PS.sel,r=mk(Math.floor(Math.random()*1e9)+1);let c;if(s.startsWith('O:')){const L=ORAL.filter(x=>PS.cat==='Alle'||x[0]===PS.cat),x=L[Math.floor(Math.random()*L.length)];c={k:'oral',n:x[0],q:x[1],a:x[2]}}else{const i=s==='W:*'?Math.floor(Math.random()*EXW.length):+s.slice(2),t=EXW[i][1](r);c={k:'steps',n:EXW[i][0],intro:t.intro,steps:t.steps,i:0,log:[],exam:true}}c.tried=false;PS.cur=c;renderQ()}
function newQ(){if(PS.exam)return newExamQ();const p=poolQ(),[k,n]=p.length?p[Math.floor(Math.random()*p.length)]:['num','Ohmsches Gesetz'],r=mk(Math.floor(Math.random()*1e9)+1);let c;
 if(k==='num')c={k,n,q:GEN[n](r)};
 else if(k==='steps'){const d=STEPS[n](r);c={k,n,intro:d.intro,steps:d.steps,i:0,log:[]}}
 else if(k==='mc')c={k,n,...numMC(GEN[n](r),r)};
 else{const L=MCQ.filter(x=>x[0]===n),x=L[Math.floor(r()*L.length)];c={k,n,...shuf(x[1],x[2],x[3],r)}}
 c.tried=false;PS.cur=c;renderQ()}
function item(){const c=PS.cur;if(c.k==='num')return{a:c.q[1],u:c.q[2],t:c.q[4]||{rel:.02},s:c.q[3]};const s=c.steps[c.i];return{a:s[1],u:s[2],t:s[4]||{rel:.02},s:s[3]}}
function score(ok,err){memRec(PS.cur&&PS.cur.n,ok,err);const sc=store.get('ll_score',{ok:0,n:0});sc.n++;if(ok)sc.ok++;store.set('ll_score',sc);$('#sc').textContent=`Richtig: ${sc.ok} von ${sc.n}`}
function fb(t,ok){$('#pfb').textContent=t;$('#pfb').className=ok?'ok':'bad'}
function renderQ(){const c=PS.cur,sc=store.get('ll_score',{ok:0,n:0}),mcq=c.k==='mc'||c.k==='und',orl=c.k==='oral',i=c.n==='Einheiten umrechnen'?unitMod():byName(c.n);
 if(c.exam||orl){$('#pt').innerHTML=`<span class="chip">${orl?'Mündliche Frage':'Prüfungsaufgabe'}: ${c.n}</span>`}else{$('#pt').innerHTML=`<button type="button" class="chip" id="pgo">Thema: ${c.n} →</button>`;$('#pgo').onclick=()=>go(i)}
 if(orl){const o=store.get('ll_oral',{k:0,n:0});$('#sc').textContent=`Mündlich gewusst: ${o.k} von ${o.n}`}else $('#sc').textContent=`Richtig: ${sc.ok} von ${sc.n}`;
 $('#psol').hidden=true;$('#pfb').textContent='';$('#pfb').className='';$('#ptipt').textContent='';$('#pck').textContent='Prüfen';$('#pck').hidden=orl;$('#psh').textContent=orl?'Musterantwort':'Lösungsweg';c.done=false;c.sel=-1;$('#pin').hidden=$('#pu').hidden=mcq||orl;$('#ptip').hidden=true;
 if(orl){$('#pq').textContent=c.q;$('#popts').innerHTML='';$('#ptol').textContent='Überlege zuerst, wie Du antworten würdest. Dann die Musterantwort ansehen und Dich ehrlich einschätzen.';return}
 if(mcq){$('#pq').textContent=(c.k==='und'?'Verständnis: ':'Ankreuzen: ')+c.q;$('#popts').innerHTML=c.opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><b>${'ABCD'[j]}</b> ${o}</button>`).join('');$('#popts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(+b.dataset.j));$('#ptol').textContent='Wähle eine Antwort und tippe auf Prüfen.'}
 else{$('#popts').innerHTML='';const it=item(),t=it.t;$('#pq').textContent=c.k==='steps'?c.intro+(c.log.length?'\n'+c.log.join('\n'):'')+`\nSchritt ${c.i+1} von ${c.steps.length}: `+c.steps[c.i][0]:c.q[0];$('#pu').textContent=it.u;$('#pin').value='';$('#ptol').textContent=t.abs!=null?`Toleranz ±${String(t.abs).replace('.',',')}`:`Toleranz ±${(t.rel||.02)*100} % (Dezimalkomma ist erlaubt)`;$('#ptip').hidden=!(c.k==='steps'&&c.steps[c.i][5])}}
function pickOpt(j){const c=PS.cur;if(!c||c.done)return;c.sel=j;$('#popts').querySelectorAll('.opt').forEach((b,k)=>b.className='opt'+(k===j?' sel':''))}
function finishStep(c,it){c.done=true;if(c.k==='steps'){c.log.push(`Ergebnis ${c.i+1}: ${nf(it.a)} ${it.u}`);$('#pck').textContent=c.i<c.steps.length-1?'Weiter ▶':'Nächste Aufgabe'}else $('#pck').textContent='Nächste Aufgabe'}
function checkQ(){const c=PS.cur;if(!c)return;
 if(c.done){if(c.k==='steps'&&c.i<c.steps.length-1){c.i++;c.tried=false;renderQ()}else newQ();return}
 if(c.k==='mc'||c.k==='und'){if(c.sel<0){fb('Bitte eine Antwort wählen.',false);return}const ok=c.sel===c.ok;if(!c.tried){c.tried=true;score(ok)}c.done=true;
  $('#popts').querySelectorAll('.opt').forEach((b,k)=>b.className='opt'+(k===c.ok?' right':k===c.sel?' wrong':''));fb(ok?'✓ Richtig!':'✗ Leider nicht. Richtig ist '+'ABCD'[c.ok]+'.',ok);$('#psol').innerHTML='<b>Erklärung</b><p>'+c.why+'</p>';$('#psol').hidden=false;$('#pck').textContent='Nächste Aufgabe';return}
 const u=parseFloat(String($('#pin').value).replace(',','.')),it=item();
 if(!isFinite(u)){fb('Bitte eine Zahl eingeben.',false);return}
 const ok=Math.abs(u-it.a)<=(it.t.abs!=null?it.t.abs:(it.t.rel||.02)*Math.abs(it.a));
 if(!c.tried){c.tried=true;score(ok,ok?null:errKind(u,it.a))}
 if(ok){fb(c.k==='steps'&&c.i===c.steps.length-1?'✓ Richtig! Alle Schritte geschafft.':'✓ Richtig!',true);finishStep(c,it)}else fb('✗ Noch nicht. '+(errHint(u,it.a)||'Prüfe Einheit und Rundung oder öffne den Lösungsweg.'),false)}
function rateOral(k){memRec('Mündlich · '+PS.cur.n,!!k);const o=store.get('ll_oral',{k:0,n:0});o.n++;if(k)o.k++;store.set('ll_oral',o);newQ()}
function showSol(){const c=PS.cur;if(!c)return;if(c.k==='oral'){$('#psol').innerHTML='<b>Musterantwort</b><p>'+c.a+'</p>';$('#psol').hidden=false;$('#popts').innerHTML='<button type="button" class="opt" data-j="1"><b>✓</b> Gewusst</button><button type="button" class="opt" data-j="0"><b>↻</b> Noch unsicher</button>';$('#popts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>rateOral(+b.dataset.j));return}
 if(c.k==='mc'||c.k==='und'){c.done=true;if(!c.tried){c.tried=true;score(false)}$('#popts').querySelectorAll('.opt').forEach((b,k)=>b.className='opt'+(k===c.ok?' right':''));$('#psol').innerHTML='<b>Richtig ist '+'ABCD'[c.ok]+'</b><p>'+c.why+'</p>';$('#psol').hidden=false;$('#pck').textContent='Nächste Aufgabe';return}
 const it=item();if(!c.tried){c.tried=true;score(false)}
 $('#psol').innerHTML='<b>Lösungsweg</b>'+it.s.map(x=>`<p>${x}</p>`).join('')+`<p><b>Ergebnis: ${nf(it.a,4)} ${it.u}</b></p>`;$('#psol').hidden=false;if(!c.done)finishStep(c,it)}
$('#ptip').onclick=()=>{const c=PS.cur;if(c&&c.k==='steps'&&c.steps[c.i][5])$('#ptipt').textContent='💡 '+c.steps[c.i][5]};$('#pck').onclick=checkQ;$('#pnx').onclick=newQ;$('#psh').onclick=showSol;$('#pin').onkeydown=e=>{if(e.key==='Enter')checkQ()};$('#pf').onchange=e=>{PS.sel=e.target.value;if(PS.exam)$('#pk').hidden=!PS.sel.startsWith('O:');newQ()};$('#pk').onchange=e=>{if(PS.exam)PS.cat=e.target.value;else KIND=e.target.value;newQ()};
function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;if(cur>=0&&M[cur].anim&&play){clock+=dt;render()}requestAnimationFrame(loop)}
nav();requestAnimationFrame(loop);
</script>
