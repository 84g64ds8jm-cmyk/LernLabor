<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lernlabor"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><title>Lernlabor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8eeed;--grid:#d0dbd9;--card:#f8fbfa;--ink:#14283a;--mute:#52667a;--line:#b9c8c6;--wire:#8fa3a8;--flow:#1f6fd1;--amber:#e3a21a;--ok:#1b8a5a;--red:#c8402e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--grid:#1a2936;--card:#162330;--ink:#e0eaf1;--mute:#93a7b8;--line:#2b3f50;--wire:#4a6577;--flow:#5aa9ff;--amber:#f0b429;--ok:#43c78a;--red:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0f1a24;--grid:#1a2936;--card:#162330;--ink:#e0eaf1;--mute:#93a7b8;--line:#2b3f50;--wire:#4a6577;--flow:#5aa9ff;--amber:#f0b429;--ok:#43c78a;--red:#ff7b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 8px 10px 0}
.seg button{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;border-radius:7px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--flow);outline-offset:2px}
.sub{color:var(--mute);margin:4px 0 14px;max-width:64ch}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1.55fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
.t1{font-size:16px;font-weight:700}.t2{font-size:14px;fill:var(--mute)}
.w{fill:none;stroke:var(--wire);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:none;stroke:var(--flow);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:.1 11;animation:f 1s linear infinite}
@keyframes f{to{stroke-dashoffset:-11.1}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.rb{fill:var(--card);stroke:var(--ink);stroke-width:2}.ra{fill:var(--amber)}
.wall{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.fluid{fill:var(--flow);opacity:.35}
.pst{fill:var(--mute);stroke:var(--ink);stroke-width:2}
.box{fill:var(--amber);stroke:var(--ink);stroke-width:2}
.legend{font-size:13px;color:var(--mute);margin:8px 2px 0}
.ctl{display:grid;grid-template-columns:3.6em 1fr 7em;gap:10px;align-items:center;margin-bottom:12px}
.ctl label{font-weight:700}
.ctl input[type=range]{width:100%;accent-color:var(--flow)}
.ctl .n{display:flex;align-items:center;gap:4px;color:var(--mute)}
.ctl input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:right}
.ctl input[type=number]{}.ctl select{grid-column:2/4;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.fx{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:15px}.fx span{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 8px;margin:4px 6px 0 0}.ctl input.tx{grid-column:2/4;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}[hidden]{display:none!important}.hc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.hc h2{font-size:20px}.hc p{margin:8px 0}.chip{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:4px 6px 0 0;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.btns button{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.res div{background:var(--bg);border-radius:8px;padding:8px 10px}
.res b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.res span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.steps{font-size:14px;margin-top:16px}
.steps p{margin:0 0 8px}.steps .f{color:var(--mute)}.steps .v{font-variant-numeric:tabular-nums}
h2{font-size:16px;margin:0 0 8px}

:root{--acc:#3b82f6;--r:16px;--sh:0 1px 2px rgba(20,40,58,.06),0 10px 28px rgba(20,40,58,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4)}}
body[data-f="Physik"]{--acc:#3b82f6}body[data-f="Chemie"]{--acc:#10a37f}body[data-f="Statistik"]{--acc:#8b5cf6}body[data-f="Umrechnen"]{--acc:#f97316}
body{background-image:radial-gradient(1000px 420px at 12% -8%,color-mix(in srgb,var(--acc) 20%,transparent),transparent),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px;background-attachment:fixed;transition:background .3s}
h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.03em;margin-bottom:16px}
h1::before{content:"";display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--acc);margin-right:.3em;vertical-align:.08em;box-shadow:0 0 0 .16em color-mix(in srgb,var(--acc) 25%,transparent)}
.seg{border-radius:14px;box-shadow:var(--sh)}
.seg button{border-radius:10px;transition:background .15s,color .15s,transform .15s}
.seg button:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 50%,transparent)}
#fs button{font-weight:800}
.panel,.hc,.fx{border-radius:var(--r);box-shadow:var(--sh)}
.panel{border-top:3px solid var(--acc);animation:in .35s ease both}
.fx{border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.fx span{background:var(--card);border:1px solid var(--line);font-weight:600}
svg{border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,var(--card)),var(--card))}
.ctl input[type=range]{accent-color:var(--acc)}
.ctl input[type=number],.ctl select,.ctl input.tx{border-radius:8px;transition:border-color .15s}
.ctl input:focus,.ctl select:focus{border-color:var(--acc)}
.btns button{border-radius:10px;transition:background .15s,border-color .15s}
.btns button:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--bg))}
.res div{border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card));border-radius:10px}
.res b{font-size:19px}
th{color:var(--mute);font-weight:600;font-size:13px}
.hg{display:grid;gap:16px}
@media(min-width:900px){.hg{grid-template-columns:1fr 1fr}}
.hc{margin:0;border-top:4px solid var(--acc);animation:in .4s ease both}
.hc[data-f="Physik"]{--acc:#3b82f6}.hc[data-f="Chemie"]{--acc:#10a37f}.hc[data-f="Statistik"]{--acc:#8b5cf6}.hc[data-f="Umrechnen"]{--acc:#f97316}
.hc h2{display:flex;align-items:center;gap:10px;font-size:22px;margin:0}
.hc h2 .ic{font-size:26px}.hc h2 small{margin-left:auto;font-size:13px;font-weight:600;color:var(--mute)}
.hc .hs{color:var(--mute);font-size:14px;margin:2px 0 8px}
.hc p b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.chip{border-radius:999px;padding:6px 12px;transition:all .15s}
.chip:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg));transform:translateY(-1px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel,.hc{animation:none}*{transition:none!important}}

.sbox{position:relative;margin:0 0 12px}.sbox input{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--ink)}
#sr{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}#sr small{color:var(--mute)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.ph h2{margin:0}.ph select{font:inherit;padding:5px 8px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}#sc{margin-left:auto;font-weight:700;color:var(--acc)}
.pq{font-size:19px;line-height:1.45;margin:14px 0}.pa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pa input{font:inherit;font-size:18px;width:11em;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pa button,.pb button{font:inherit;font-weight:700;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}#pck{background:var(--acc)!important;color:#fff!important;border-color:transparent!important}
#pfb{font-weight:700;min-height:1.5em;margin:10px 0}.pb{display:flex;gap:8px;flex-wrap:wrap}#psol{margin-top:12px;font-size:15px}#psol p{margin:4px 0}.ok{color:var(--ok)}.bad{color:var(--red)}.qk{margin-bottom:16px}
.pq{white-space:pre-line}#popts{display:grid;gap:8px;margin:0 0 12px}.opt{font:inherit;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:all .15s}.opt b{display:inline-block;width:1.6em;color:var(--acc)}.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg))}.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg))}.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--bg))}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.17}
main{position:relative;z-index:1}
.panel,.hc,.fx,.seg{background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.res div{background:color-mix(in srgb,var(--acc) 9%,color-mix(in srgb,var(--card) 80%,transparent))}
</style>
</head>

<circle cx="52" cy="62" r="4"/><circle cx="66" cy="38" r="4"/><circle cx="84" cy="30" r="4"/></symbol><symbol id="s-ruler" viewBox="0 0 200 34"><rect x="2" y="2" width="196" height="30" rx="4"/><path d="M20 2v12M40 2v18M60 2v12M80 2v18M100 2v12M120 2v18M140 2v12M160 2v18M180 2v12"/></symbol><symbol id="s-arr" viewBox="0 0 90 70"><path d="M8 22H80M64 8L80 22 64 36M82 50H10M26 36L10 50 26 64"/></symbol><symbol id="s-therm" viewBox="0 0 40 110"><path d="M12 12a8 8 0 0 1 16 0V68a16 16 0 1 1-16 0ZM20 30V78"/><circle cx="20" cy="88" r="6"/></symbol><symbol id="s-cube" viewBox="0 0 90 90"><path d="M45 6L84 26V66L45 86L6 66V26ZM6 26L45 46L84 26M45 46V86"/></symbol><pattern id="p-chem" width="360" height="360" patternUnits="userSpaceOnUse"><g fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#s-flask" x="20" y="30" width="80" height="112" transform="rotate(-14 60 86)"/><use href="#s-tube" x="250" y="20" width="36" height="116" transform="rotate(10 268 78)"/><use href="#s-beaker" x="200" y="210" width="96" height="106" transform="rotate(-6 248 263)"/><use href="#s-mol" x="30" y="215" width="92" height="92"/><circle cx="170" cy="150" r="7"/><circle cx="190" cy="125" r="4"/><circle cx="330" cy="180" r="5"/></g></pattern><pattern id="p-phys" width="360" height="360" patternUnits="userSpaceOnUse"><g fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#s-gear" x="20" y="20" width="96" height="96"/><use href="#s-lever" x="170" y="30" width="150" height="90" transform="rotate(-8 245 75)"/><use href="#s-spring" x="40" y="220" width="46" height="108"/><use href="#s-wave" x="150" y="200" width="170" height="52"/><use href="#s-pend" x="270" y="250" width="60" height="90"/><use href="#s-gear" x="140" y="280" width="52" height="52"/></g></pattern><pattern id="p-stat" width="360" height="360" patternUnits="userSpaceOnUse"><g fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#s-bell" x="20" y="30" width="160" height="100"/><use href="#s-bars" x="230" y="30" width="100" height="90"/><use href="#s-box" x="30" y="230" width="124" height="72"/><use href="#s-scat" x="220" y="210" width="112" height="100"/></g></pattern><pattern id="p-unit" width="360" height="360" patternUnits="userSpaceOnUse"><g fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#s-ruler" x="20" y="40" width="200" height="34" transform="rotate(-8 120 57)"/><use href="#s-arr" x="250" y="20" width="90" height="70"/><use href="#s-therm" x="60" y="170" width="40" height="110"/><use href="#s-cube" x="200" y="200" width="90" height="90"/><use href="#s-ruler" x="130" y="320" width="150" height="26"/></g></pattern><pattern id="p-home" width="420" height="420" patternUnits="userSpaceOnUse"><g fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#s-flask" x="30" y="30" width="70" height="98" transform="rotate(-12 65 79)"/><use href="#s-gear" x="230" y="30" width="90" height="90"/><use href="#s-bell" x="30" y="250" width="150" height="94"/><use href="#s-ruler" x="220" y="260" width="170" height="30" transform="rotate(-6 305 275)"/><use href="#s-lever" x="250" y="330" width="120" height="72"/><use href="#s-mol" x="130" y="150" width="70" height="70"/></g></pattern></defs><rect id="bgr" width="100%" height="100%" fill="url(#p-home)"/></svg><main>
<h1>Lernlabor</h1>
<div class="sbox"><input id="q" type="search" placeholder="Thema oder Formel suchen, z. B. Druck, Cpk, F = m · a" aria-label="Suche" autocomplete="off"><div id="sr" hidden></div></div><div class="seg" id="fs" role="group" aria-label="Fach"></div><br><div class="seg" id="gs" role="group" aria-label="Thema"></div><br><div class="seg" id="ms" role="group" aria-label="Unterthema"></div>
<p class="sub" id="desc"></p>
<div class="fx" id="fx" hidden></div><div id="home"></div><div id="practice" hidden><div class="panel"><div class="ph"><h2 id="ph2">✎ Übungsmodus</h2><select id="pf" aria-label="Fach wählen"></select><select id="pk" aria-label="Aufgabentyp"></select><span id="sc"></span></div><div id="pt"></div><p class="pq" id="pq"></p><div id="popts"></div><div class="pa"><input id="pin" inputmode="decimal" placeholder="Antwort" aria-label="Antwort" autocomplete="off"><b id="pu"></b><button type="button" id="pck">Prüfen</button></div><p class="sub" id="ptol"></p><p id="pfb"></p><p class="sub" id="ptipt"></p><div class="pb"><button type="button" id="ptip" hidden>💡 Tipp</button><button type="button" id="psh">Lösungsweg</button><button type="button" id="pnx">Nächste Aufgabe</button></div><div id="psol" hidden></div></div></div><div class="grid" id="app">
 <div><div class="panel"><svg id="svg" role="img" aria-label="Schaubild"></svg><p class="legend" id="leg"></p></div><div class="panel steps" id="steps"></div></div>
 <div class="panel"><h2>Werte einstellen</h2><div id="ctls"></div><div class="btns" id="btns"></div><div class="res" id="res"></div><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>

<script>
const $=s=>document.querySelector(s),PI=Math.PI,G=9.81,rad=d=>d*PI/180;
const PRE=[['M',1e6],['k',1e3],['',1],['m',1e-3],['µ',1e-6]];
const nf=(v,d=3)=>String(+Number(v).toPrecision(d)).replace('.',',');
const fmt=(v,u)=>{if(!isFinite(v))return '–';if(v===0)return '0 '+u;const a=Math.abs(v),p=PRE.find(x=>a>=x[1]*.9995)||PRE[4];return nf(v/p[1])+' '+p[0]+u};
const T=(x,y,s,c='t1',a='start')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const AR=(x,y,dx,dy,col,lab)=>{const l=Math.hypot(dx,dy);if(l<4)return '';const ux=dx/l,uy=dy/l,X=x+dx,Y=y+dy;return `<line x1="${x}" y1="${y}" x2="${X-ux*8}" y2="${Y-uy*8}" stroke="${col}" stroke-width="3.5"/><polygon points="${X},${Y} ${X-ux*11-uy*5},${Y-uy*11+ux*5} ${X-ux*11+uy*5},${Y-uy*11-ux*5}" fill="${col}"/>`+(lab?T(X+6,Y-6,lab,'t2'):'')};
const sub=['₁','₂','₃','₄'],pr=(a,b)=>a*b/(a+b);
const sup=n=>String(n).replace('-','⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const sc=v=>{const e=Math.floor(Math.log10(v));return nf(v/10**e,2)+' · 10'+sup(e)};
const chg=n=>n==0?'':(Math.abs(n)==1?'':sup(Math.abs(n)))+(n>0?'⁺':'⁻');

'Druck':r=>{const h=rg(r,2,50),p=1000*9.81*h/1e5;return[`Wie groß ist der Schweredruck in ${h} m Wassertiefe (ohne Luftdruck)?`,p,'bar',['p = ρ · g · h',`= 1000 · 9,81 · ${h} Pa = ${nf(p)} bar`]]},
'Hydraulik':r=>{const F=rg(r,50,500,50),d1=rg(r,2,6),d2=rg(r,8,20,2),x=F*(d2/d1)**2;return[`Auf den kleinen Kolben (d₁ = ${d1} cm) wirkt ${F} N. Der große Kolben hat d₂ = ${d2} cm. Welche Kraft entsteht dort?`,x,'N',['F₁ / A₁ = F₂ / A₂, A ~ d²',`F₂ = ${F} · (${d2} / ${d1})² = ${nf(x)} N`]]},
'Gasgesetze':r=>{const p=rg(r,1,5,.5),V=rg(r,2,10),V2=rg(r,1,10),x=p*V/V2;return[`Ein Gas hat ${p} bar bei ${V} L. Es wird bei gleicher Temperatur auf ${V2} L zusammengedrückt oder ausgedehnt. Wie groß ist der neue Druck?`,x,'bar',['Boyle-Mariotte: p₁ · V₁ = p₂ · V₂',`p₂ = ${p} · ${V} / ${V2} = ${nf(x)} bar`]]},
'Auftrieb und Dichte':r=>{const V=rg(r,1,20),x=9.81*V;return[`Ein Körper mit ${V} dm³ Volumen ist ganz in Wasser getaucht. Wie groß ist der Auftrieb?`,x,'N',['F_A = ρ · g · V',`= 1000 · 9,81 · ${V/1000} m³ = ${nf(x)} N`]]},
'Gleichförmige Bewegung':r=>{const v=rg(r,5,30),s=rg(r,100,900,50),t=s/v;return[`Ein Fahrzeug fährt mit ${v} m/s. Wie lange braucht es für ${s} m?`,t,'s',['t = s / v',`= ${s} / ${v} = ${nf(t)} s`]]},
'Beschleunigung & Bremsen':r=>{const v=rg(r,30,120,10),a=rg(r,3,9),s=(v/3.6)**2/(2*a);return[`Ein Auto fährt ${v} km/h und bremst mit a = ${a} m/s². Wie lang ist der Bremsweg?`,s,'m',['v in m/s: v / 3,6','s = v² / (2 · a)',`= (${nf(v/3.6)})² / ${2*a} = ${nf(s)} m`]]},
'Kraftgesetz F = m · a':r=>{const F=rg(r,50,500,50),m=rg(r,5,50,5);return[`Auf eine Masse von ${m} kg wirkt die Nettokraft ${F} N. Wie groß ist die Beschleunigung?`,F/m,'m/s²',['a = F / m',`= ${F} / ${m} = ${nf(F/m)} m/s²`]]},
'Arbeit & Leistung':r=>{const F=rg(r,50,500,50),s=rg(r,2,20),t=rg(r,2,20),P=F*s/t;return[`Eine Kraft von ${F} N verschiebt einen Körper um ${s} m in ${t} s (Kraft in Wegrichtung). Wie groß ist die Leistung?`,P,'W',['W = F · s, P = W / t',`P = ${F*s} J / ${t} s = ${nf(P)} W`]]},
'Energieformen & Erhaltung':r=>{const h=rg(r,2,40,2),v=Math.sqrt(2*9.81*h);return[`Ein Körper fällt ohne Reibung aus ${h} m Höhe. Mit welcher Geschwindigkeit kommt er unten an?`,v,'m/s',['m · g · h = ½ · m · v²',`v = √(2 · 9,81 · ${h}) = ${nf(v)} m/s`]]},
'Wirkungsgrad':r=>{const W=rg(r,100,1000,100),e=rg(r,20,95,5),x=W*e/100;return[`Einer Maschine werden ${W} J zugeführt, der Wirkungsgrad beträgt ${e} %. Wie viel Nutzenergie entsteht?`,x,'J',['η = W_nutz / W_zu',`W_nutz = ${W} · ${e/100} = ${nf(x)} J`]]},
'Wärmekapazität':r=>{const m=rg(r,.5,5,.5),d=rg(r,10,80,10),Q=m*4.182*d;return[`Wie viel Wärme braucht man, um ${m} kg Wasser um ${d} K zu erwärmen? (c = 4,182 kJ/(kg·K))`,Q,'kJ',['Q = m · c · ΔT',`= ${m} · 4,182 · ${d} = ${nf(Q)} kJ`]]},
'Mischungstemperatur':r=>{const m1=rg(r,1,5),m2=rg(r,1,5),a=rg(r,60,95,5),b=rg(r,5,25,5),T=(m1*a+m2*b)/(m1+m2);return[`${m1} kg Wasser mit ${a} °C werden mit ${m2} kg Wasser mit ${b} °C gemischt. Welche Mischtemperatur ergibt sich?`,T,'°C',['T_m = (m₁T₁ + m₂T₂) / (m₁ + m₂)',`= (${m1}·${a} + ${m2}·${b}) / ${m1+m2} = ${nf(T)} °C`]]},
'Wärmeausdehnung':r=>{const L=rg(r,5,50,5),d=rg(r,20,80,10),x=12e-6*L*d*1000;return[`Eine Stahlschiene ist ${L} m lang (α = 12·10⁻⁶ /K) und wird um ${d} K wärmer. Um wie viel dehnt sie sich aus?`,x,'mm',['ΔL = α · L₀ · ΔT',`= 12·10⁻⁶ · ${L} · ${d} m = ${nf(x)} mm`]]},
'Elektrische Arbeit & Leistung':r=>{const P=rg(r,500,3000,100),t=rg(r,1,10),k=P*t/1000*.35;return[`Ein Gerät mit ${P} W läuft ${t} h. Was kostet das bei 35 ct pro kWh?`,k,'€',['W = P · t',`= ${P/1000} kW · ${t} h = ${nf(P*t/1000)} kWh`,`Kosten = ${nf(P*t/1000)} · 0,35 € = ${nf(k)} €`]]},
'Schiefe Ebene':r=>{const m=rg(r,20,200,10),h=rg(r,.5,1.5,.1),l=rg(r,2,5,.5),F=m*9.81*h/l;return[`Eine Last von ${m} kg wird über eine reibungsfreie Rampe (Länge ${l} m, Höhe ${h} m) nach oben geschoben. Welche Kraft ist nötig?`,F,'N',['F = G · h / l',`= ${nf(m*9.81)} N · ${h} / ${l} = ${nf(F)} N`]]},
'Rolle & Flaschenzug':r=>{const m=rg(r,20,200,10),n=pk(r,[2,3,4,5,6]),F=m*9.81/n;return[`Ein Flaschenzug mit ${n} tragenden Seilstücken hebt ${m} kg (ohne Reibung). Welche Zugkraft braucht man?`,F,'N',['F = G / n',`= ${nf(m*9.81)} N / ${n} = ${nf(F)} N`]]},
'Gleit-, Haft- & Rollreibung':r=>{const m=rg(r,10,100,10),u=rg(r,.1,.6,.05),F=u*m*9.81;return[`Ein Körper (${m} kg) gleitet über eine Fläche mit μ = ${u}. Wie groß ist die Gleitreibungskraft?`,F,'N',['F_R = μ · F_N, F_N = m · g',`= ${u} · ${nf(m*9.81)} N = ${nf(F)} N`]]},
'Kreisbewegung':r=>{const R=rg(r,.5,3,.5),n=rg(r,30,300,30),v=2*PI*n/60*R;return[`Ein Punkt läuft auf einem Kreis mit r = ${R} m und ${n} Umdrehungen pro Minute. Wie groß ist die Bahngeschwindigkeit?`,v,'m/s',['ω = 2π · n / 60','v = ω · r',`= ${nf(2*PI*n/60)} · ${R} = ${nf(v)} m/s`]]},
'Sinus & Kosinus':r=>{const c=rg(r,5,20),a=pk(r,[30,40,50,60]),x=c*Math.sin(a*PI/180);return[`In einem rechtwinkligen Dreieck ist die Hypotenuse ${c} lang, der Winkel α = ${a}°. Wie lang ist die Gegenkathete?`,x,'',['sin α = Gegenkathete / Hypotenuse',`a = ${c} · sin ${a}° = ${nf(x)}`]]},
'Säuren & Basen':r=>{const a=pk(r,[1,2,5]),k=rg(r,1,5),pH=-Math.log10(a*10**-k);return[`Eine starke Säure hat die Konzentration c(H₃O⁺) = ${a} · 10${sup(-k)} mol/L. Wie groß ist der pH-Wert?`,pH,'',['pH = −log₁₀ c(H₃O⁺)',`= −log₁₀(${a} · 10${sup(-k)}) = ${nf(pH)}`],{abs:.1}]},
'Neutralisation & Titration':r=>{const ca=pk(r,[.1,.2,.5]),Va=rg(r,10,50,5),cb=pk(r,[.1,.2,.25]),x=ca*Va/cb;return[`${Va} mL Salzsäure (${ca} mol/L) werden mit Natronlauge (${cb} mol/L) titriert. Bei welchem Volumen Lauge liegt der Äquivalenzpunkt?`,x,'mL',['n(Säure) = n(Base)','V_L = c_S · V_S / c_L',`= ${ca} · ${Va} / ${cb} = ${nf(x)} mL`]]},
'Reaktionsgleichungen & Mol':r=>{const m=rg(r,2,20,2),x=m/2.016*18.015;return[`Bei 2 H₂ + O₂ → 2 H₂O reagieren ${m} g Wasserstoff vollständig. Wie viel Wasser entsteht? (M(H₂) = 2,016 g/mol, M(H₂O) = 18,015 g/mol)`,x,'g',['n(H₂) = m / M',`n = ${m} / 2,016 = ${nf(m/2.016)} mol = n(H₂O)`,`m(H₂O) = n · M = ${nf(x)} g`]]},
'Wasserhärte':r=>{const ca=rg(r,40,160,10),mg=rg(r,5,40,5),x=(ca/40.08+mg/24.31)*5.6;return[`Ein Wasser enthält ${ca} mg/L Calcium und ${mg} mg/L Magnesium. Wie groß ist die Gesamthärte in °dH? (1 mmol/L ≙ 5,6 °dH)`,x,'°dH',['c = ρ(Ca) / 40,08 + ρ(Mg) / 24,31',`= ${nf(ca/40.08+mg/24.31)} mmol/L`,`× 5,6 = ${nf(x)} °dH`]]},
'Oxidationszahlen':r=>{const L=[['Mn','KMnO₄',7],['S','H₂SO₄',6],['Cr','K₂Cr₂O₇',6],['N','NH₄⁺',-3],['O','H₂O₂',-1],['C','CO₂',4],['C','CH₄',-4],['Fe','Fe₂O₃',3],['S','SO₄²⁻',6]],q=pk(r,L);return[`Welche Oxidationszahl hat ${q[0]} in ${q[1]}?`,q[2],'',['Summe der Oxidationszahlen = Ladung','O meist −2, H meist +1, K +1',`Ergebnis: ${q[2]}`],{abs:.01}]},
'Galvanische Zelle & Spannungsreihe':r=>{const i=rg(r,0,9),j=(i+rg(r,1,9))%10,A=ME[i],B=ME[j],U=Math.abs(A[1]-B[1]);return[`Eine galvanische Zelle besteht aus ${A[0]} (E° = ${A[1]} V) und ${B[0]} (E° = ${B[1]} V). Wie groß ist die Zellspannung?`,U,'V',['U = E°(Kathode) − E°(Anode)',`= |${A[1]} − (${B[1]})| = ${nf(U)} V`]]},
'Elektrolyse':r=>{const I=rg(r,1,5),t=rg(r,10,60,10),m=63.55*I*t*60/(2*96485);return[`Aus CuSO₄-Lösung wird mit ${I} A über ${t} min Kupfer abgeschieden. Wie viel Kupfer scheidet sich ab? (M = 63,55 g/mol, F = 96485 C/mol)`,m,'g',['Q = I · t',`n(e⁻) = Q / F = ${nf(I*t*60/96485)} mol`,'n(Cu) = n(e⁻) / 2, m = n · M',`m = ${nf(m)} g`]]},
'Periodensystem':r=>{const L=[[3,1],[11,1],[12,2],[13,3],[14,4],[15,5],[16,6],[17,7],[19,1],[20,2]],q=pk(r,L);return[`Wie viele Valenzelektronen hat ${NA[q[0]-1]} (Z = ${q[0]})?`,q[1],'',['Valenzelektronen = Elektronen der äußersten Schale',`Ergebnis: ${q[1]}`],{abs:.01}]},
'Mittelwert, Median & Modalwert':r=>{const v=[1,2,3,4,5].map(()=>rg(r,10,40)),m=v.reduce((a,b)=>a+b,0)/5;return[`Messwerte: ${v.join('; ')}. Wie groß ist der Mittelwert?`,m,'',['x̄ = Σx / n',`= ${v.reduce((a,b)=>a+b,0)} / 5 = ${nf(m)}`]]},
'Spannweite, Varianz & Standardabweichung':r=>{const v=[1,2,3,4,5].map(()=>rg(r,10,40)),d=SS(v),s=Math.sqrt(d.s2);return[`Messwerte: ${v.join('; ')}. Wie groß ist die Standardabweichung s (Stichprobe, n − 1)?`,s,'',['x̄ = '+nf(d.m),'s² = Σ(x − x̄)² / (n − 1) = '+nf(d.s2),`s = √s² = ${nf(s)}`],{rel:.03}]},
'Normalverteilung':r=>{const mu=rg(r,40,60,5),sd=rg(r,2,10),k=pk(r,[-2,-1,.5,1,1.5,2]),x=mu+k*sd;return[`Eine Größe ist normalverteilt mit μ = ${mu} und σ = ${sd}. Wie groß ist der z-Wert von x = ${nf(x)}?`,k,'',['z = (x − μ) / σ',`= (${nf(x)} − ${mu}) / ${sd} = ${k}`],{abs:.02}]},
'σ-Bereiche':r=>{const k=pk(r,[1,2,3]),a=[68.3,95.4,99.73][k-1];return[`Wie viel Prozent der Werte einer Normalverteilung liegen im Bereich μ ± ${k}σ?`,a,'%',['Merkregel: 68,3 % / 95,4 % / 99,73 %',`Ergebnis: ${a} %`],{rel:.01}]},
'Prozess- & Maschinenfähigkeit':r=>{const mu=pk(r,[49.8,50,50.2,50.4]),sd=pk(r,[.3,.4,.5,.6]),x=Math.min(52-mu,mu-48)/(3*sd);return[`Toleranz: USG = 48, OSG = 52. Der Prozess hat x̄ = ${mu} und s = ${sd}. Wie groß ist Cpk?`,x,'',['Cpk = min(OSG − x̄, x̄ − USG) / (3 · s)',`= min(${nf(52-mu)}; ${nf(mu-48)}) / ${nf(3*sd)} = ${nf(x)}`]]},
'Qualitätsregelkarte (x̄-Karte)':r=>{const mu=rg(r,40,60,5),sd=rg(r,1,4),n=pk(r,[4,9,16,25]),x=mu+3*sd/Math.sqrt(n);return[`Ein Prozess hat μ = ${mu} und σ = ${sd}. Stichprobenumfang n = ${n}. Wie hoch liegt die obere Eingriffsgrenze der x̄-Karte?`,x,'',['OEG = μ + 3 · σ / √n',`= ${mu} + 3 · ${sd} / ${nf(Math.sqrt(n))} = ${nf(x)}`]]},
'Histogramm':r=>{const n=pk(r,[20,50,100,200]),k=Math.round(1+3.32*Math.log10(n));return[`Wie viele Klassen schlägt die Sturges-Regel für n = ${n} Messwerte vor? (k ≈ 1 + 3,32 · lg n, gerundet)`,k,'',['k = 1 + 3,32 · lg n',`= 1 + 3,32 · ${nf(Math.log10(n))} = ${nf(1+3.32*Math.log10(n))} ≈ ${k}`],{abs:.01}]},
'Einheiten umrechnen':r=>{const c=pk(r,['Länge','Masse','Volumen','Fläche','Zeit','Druck','Energie','Leistung','Geschwindigkeit']),u=UN[c][0],i=rg(r,0,u.length-1),j=(i+rg(r,1,u.length-1))%u.length,A=u[i],B=u[j],v=pk(r,[.5,2,25,340,1.5,12]),x=v*A[1]/B[1];return[`Rechne ${nf(v)} ${A[0]} in ${B[0]} um.`,x,B[0],[`1 ${A[0]} = ${fnum(A[1]/B[1])} ${B[0]}`,`${nf(v)} · ${fnum(A[1]/B[1])} = ${fnum(x)} ${B[0]}`],{rel:.005}]}};

const shuf=(q,o,why,r)=>{const a=o.map((t,i)=>[t,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return{q,opts:a.map(x=>x[0]),ok:a.findIndex(x=>x[1]===0),why}};
const numMC=(g,r)=>{const a=g[1],u=g[2],f=x=>nf(x,3)+(u?' '+u:''),O=[f(a)],int=Number.isInteger(a)&&Math.abs(a)<=12,c=int?[a+1,a-1,a+2,-a,a*2]:[a*2,a/2,a*10,a/10,a*1.5,a*.75,a+Math.abs(a)*.25];for(const x of c){if(O.length>=4)break;if(!O.includes(f(x)))O.push(f(x))}return shuf(g[0],O,g[3].join('; ')+` = ${f(a)}`,r)};

'Reibung (schiefe Ebene)':r=>{const m=rg(r,10,50,5),al=pk(r,[25,30,35]),u=rg(r,.1,.3,.05),Gw=m*9.81,FH=Gw*Math.sin(al*PI/180),FN=Gw*Math.cos(al*PI/180),FR=u*FN;return{intro:`Ein Klotz (${m} kg) gleitet eine Rampe mit α = ${al}° hinunter, Gleitreibungszahl μ = ${u}.`,steps:[['Wie groß ist die Hangabtriebskraft F_H?',FH,'N',[`F_H = m · g · sin α = ${nf(Gw)} · sin ${al}° = ${nf(FH)} N`]],['Wie groß ist die Normalkraft F_N?',FN,'N',[`F_N = m · g · cos α = ${nf(Gw)} · cos ${al}° = ${nf(FN)} N`]],['Wie groß ist die Gleitreibungskraft F_R?',FR,'N',[`F_R = μ · F_N = ${u} · ${nf(FN)} = ${nf(FR)} N`]],['Wie groß ist die Beschleunigung a?',(FH-FR)/m,'m/s²',[`a = (F_H − F_R) / m = (${nf(FH)} − ${nf(FR)}) / ${m} = ${nf((FH-FR)/m)} m/s²`]]]}},
'Energieformen & Erhaltung':r=>{const m=rg(r,1,10),h=rg(r,5,40,5),Ep=m*9.81*h,v=Math.sqrt(2*9.81*h);return{intro:`Ein Körper (${m} kg) fällt ohne Reibung aus ${h} m Höhe.`,steps:[['Wie groß ist seine Lageenergie oben?',Ep,'J',[`E_pot = m · g · h = ${m} · 9,81 · ${h} = ${nf(Ep)} J`]],['Mit welcher Geschwindigkeit kommt er unten an?',v,'m/s',[`E_pot = E_kin: v = √(2 · g · h) = ${nf(v)} m/s`]],['Wie groß ist E_kin nach der halben Fallhöhe?',Ep/2,'J',[`Bei halber Höhe ist die Hälfte der Lageenergie umgewandelt: E_kin = ${nf(Ep/2)} J`]]]}},
'Hydraulik':r=>{const F=rg(r,100,500,50),d1=rg(r,2,4),d2=rg(r,8,16,2),A1=PI*d1*d1/4,A2=PI*d2*d2/4,p=F/(A1*1e-4)/1e5;return{intro:`Eine hydraulische Presse: kleiner Kolben d₁ = ${d1} cm mit F₁ = ${F} N, großer Kolben d₂ = ${d2} cm.`,steps:[['Wie groß ist die Fläche A₁ des kleinen Kolbens?',A1,'cm²',[`A₁ = π · d₁² / 4 = π · ${d1}² / 4 = ${nf(A1)} cm²`]],['Wie groß ist der Druck p?',p,'bar',[`p = F₁ / A₁ = ${F} N / ${nf(A1*1e-4)} m² = ${nf(p)} bar`]],['Welche Kraft F₂ entsteht am großen Kolben?',p*1e5*A2*1e-4,'N',[`F₂ = p · A₂ = ${nf(p*1e5)} Pa · ${nf(A2*1e-4)} m² = ${nf(p*1e5*A2*1e-4)} N`]]]}},
'Beschleunigung & Bremsen':r=>{const v=rg(r,30,120,10),tR=pk(r,[.5,1,1.5]),a=rg(r,4,9),w=v/3.6,sr=w*tR,sb=w*w/(2*a);return{intro:`Ein Auto fährt ${v} km/h, die Reaktionszeit beträgt ${tR} s, die Bremsverzögerung ${a} m/s².`,steps:[['Wie schnell ist das Auto in m/s?',w,'m/s',[`v = ${v} / 3,6 = ${nf(w)} m/s`]],['Wie lang ist der Reaktionsweg?',sr,'m',[`s_R = v · t_R = ${nf(w)} · ${tR} = ${nf(sr)} m`]],['Wie lang ist der Bremsweg?',sb,'m',[`s_B = v² / (2 · a) = ${nf(w*w)} / ${2*a} = ${nf(sb)} m`]],['Wie lang ist der Anhalteweg?',sr+sb,'m',[`s = s_R + s_B = ${nf(sr)} + ${nf(sb)} = ${nf(sr+sb)} m`]]]}},

'Reaktionsgleichungen & Mol':r=>{const m=rg(r,2,20,2),n=m/2.016;return{intro:`Bei 2 H₂ + O₂ → 2 H₂O reagieren ${m} g Wasserstoff vollständig (M(H₂) = 2,016 g/mol, M(H₂O) = 18,015 g/mol).`,steps:[['Welche Stoffmenge H₂ ist das?',n,'mol',[`n = m / M = ${m} / 2,016 = ${nf(n)} mol`]],['Welche Stoffmenge H₂O entsteht?',n,'mol',['Aus 2 H₂ entstehen 2 H₂O, Verhältnis 1 : 1',`n(H₂O) = ${nf(n)} mol`]],['Welche Masse Wasser entsteht?',n*18.015,'g',[`m = n · M = ${nf(n)} · 18,015 = ${nf(n*18.015)} g`]]]}},
'Prozess- & Maschinenfähigkeit':r=>{const mu=pk(r,[49.6,50.2,50.4]),sd=pk(r,[.3,.4,.5]),cp=4/(6*sd),cpk=Math.min(52-mu,mu-48)/(3*sd);return{intro:`Toleranz USG = 48, OSG = 52. Prozess mit x̄ = ${mu} und s = ${sd}.`,steps:[['Wie groß ist Cp?',cp,'',[`Cp = (OSG − USG) / (6 · s) = 4 / ${nf(6*sd)} = ${nf(cp)}`]],['Wie groß ist Cpk?',cpk,'',[`Cpk = min(OSG − x̄, x̄ − USG) / (3 · s) = min(${nf(52-mu)}; ${nf(mu-48)}) / ${nf(3*sd)} = ${nf(cpk)}`]],['Um wie viel ist Cpk kleiner als Cp?',cp-cpk,'',[`Cp − Cpk = ${nf(cp)} − ${nf(cpk)} = ${nf(cp-cpk)}`,'Die Differenz zeigt, wie weit der Prozess aus der Mitte liegt.'],{abs:.03}]]}},

['Wasserspeicherkraftwerk',r=>{const Q=rg(r,40,80,5),H=rg(r,80,150,5),e=rg(r,78,90,1),v=Math.sqrt(2*9.81*H),P=Q*1000*9.81*H,Pa=P*e/100;return{intro:`Aus einem Speicherbecken fließen ${Q} m³/s über ${H} m Fallhöhe durch eine Turbine mit dem Wirkungsgrad ${e} %. Rohrleitungsverluste bleiben unberücksichtigt.`,steps:[STP('Mit welcher Geschwindigkeit läuft das Wasser in die Turbine?',v,'m/s',[`E_pot = E_kin ⇒ v = √(2 · g · h) = √(2 · 9,81 · ${H}) = ${nf(v)} m/s`],'Setze m · g · h = ½ · m · v² und löse nach v auf.'),STP('Welche Leistung wird der Turbine zugeführt?',P/1e6,'MW',[`P_zu = (m · g · h) / t = Q · ρ · g · h`,`= ${Q} · 1000 · 9,81 · ${H} W = ${nf(P/1e6)} MW`],'Pro Sekunde fließen Q · 1000 kg Wasser. P = Gewichtskraft · Höhe / Zeit.'),STP('Welche Leistung gibt die Turbine ab?',Pa/1e6,'MW',[`P_ab = η · P_zu = ${e/100} · ${nf(P/1e6)} = ${nf(Pa/1e6)} MW`],'P_ab = η · P_zu')]}}],
['Teilereinigungsanlage: Heizölbedarf',r=>{const V=rg(r,1500,3500,100),a=rg(r,10,20),b=rg(r,80,95,5),L=rg(r,20,40,5),d=b-a,Q=V*4.18*d,Qz=Q/(1-L/100),m=Qz/43000,Vo=m/.83;return{intro:`In einer Teilereinigungsanlage werden ${V} l Wasser von ${a} °C auf ${b} °C erwärmt. Heizöl hat einen Heizwert von 43 000 kJ/kg und eine Dichte von 0,83 kg/dm³. Die Wärmeverluste betragen ${L} %. (c Wasser = 4,18 kJ/(kg·K))`,steps:[STP('Wie viel Wärme braucht das Wasser?',Q,'kJ',[`Q = m · c · ΔT = ${V} · 4,18 · ${d} = ${nf(Q)} kJ`],'1 l Wasser hat 1 kg. Q = m · c · ΔT.'),STP(`Wie viel Wärme muss bei ${L} % Verlust zugeführt werden?`,Qz,'kJ',[`Nutzanteil = ${100-L} %`,`Q_zu = ${nf(Q)} / ${(100-L)/100} = ${nf(Qz)} kJ`],'Q_zu = Q_nutz / η mit η = 1 − Verlustanteil.'),STP('Wie viel Heizöl wird verbrannt?',m,'kg',[`m = Q_zu / H_i = ${nf(Qz)} / 43 000 = ${nf(m)} kg`],'Q = H_i · m'),STP('Wie viel Liter sind das?',Vo,'l',[`V = m / ρ = ${nf(m)} / 0,83 = ${nf(Vo)} l`],'V = m / ρ')]}}],
['Heizplatte mit vier Heizwiderständen',r=>{const R=rg(r,6,24,2),U=rg(r,12,48,12),Rz=2*R,I=U/R,P=U*I;return{intro:`Eine Heizplatte besteht aus vier gleichen Heizwiderständen zu je ${R} Ω. Jeweils zwei liegen in Reihe, die beiden Reihenzweige liegen parallel an ${U} V.`,steps:[STP('Wie groß ist der Widerstand eines Reihenzweigs?',Rz,'Ω',[`R₁₂ = R₁ + R₂ = ${Rz} Ω`],'In Reihe addieren sich die Widerstände.'),STP('Wie groß ist der Gesamtwiderstand?',R,'Ω',[`R_ges = R₁₂ · R₃₄ / (R₁₂ + R₃₄) = ${Rz} · ${Rz} / ${2*Rz} = ${R} Ω`],'Zwei gleiche Zweige parallel ergeben die Hälfte eines Zweigs.'),STP('Welche Leistung nimmt die Heizplatte auf?',P,'W',[`I = U / R_ges = ${nf(I)} A`,`P = U · I = ${nf(P)} W`],'P = U · I oder U² / R.'),STP('Welche Leistung bleibt, wenn ein Heizwiderstand unterbrochen ist?',P/2,'W',['Ein Reihenzweig ist stromlos, nur der andere heizt (voller Spannung).',`P = ${nf(P)} / 2 = ${nf(P/2)} W`],'Der unterbrochene Zweig liefert keinen Strom mehr, der zweite bleibt an voller Spannung.')]}}],
['Spritzguss: Kühlwasserbedarf',r=>{const n=rg(r,40,80,5),g=rg(r,50,100,5),T1=rg(r,200,250,10),T2=rg(r,55,75,5),dW=rg(r,3,6),Qe=g/1000*1.3*(T1-T2),Qh=Qe*n*4,V=Qh/(4.18*dW)/60;return{intro:`In einem Formwerkzeug werden pro Viertelstunde ${n} Kunststoffteile zu je ${g} g hergestellt. Die Schmelze (c = 1,3 kJ/(kg·K)) wird mit ${T1} °C eingespritzt und auf ${T2} °C abgekühlt. Das Kühlwasser (c = 4,18 kJ/(kg·K)) erwärmt sich um ${dW} K.`,steps:[STP('Welche Wärme gibt ein Teil ab?',Qe,'kJ',[`Q = m · c · ΔT = ${g/1000} · 1,3 · ${T1-T2} = ${nf(Qe)} kJ`],'Q = m · c · ΔT mit ΔT = Einspritz- minus Endtemperatur.'),STP('Welche Wärme muss pro Stunde abgeführt werden?',Qh,'kJ',[`Teile pro Stunde = ${n} · 4 = ${n*4}`,`Q_ges = ${n*4} · ${nf(Qe)} = ${nf(Qh)} kJ`],'Eine Stunde hat vier Viertelstunden.'),STP('Welcher Kühlwasser-Volumenstrom ist nötig?',V,'l/min',[`m_W = Q / (c · ΔT) = ${nf(Qh)} / (4,18 · ${dW}) = ${nf(Qh/(4.18*dW))} kg pro Stunde`,`V̇ = ${nf(Qh/(4.18*dW))} / 60 = ${nf(V)} l/min`],'Q = m · c · ΔT nach m umstellen, dann durch 60 min teilen (1 kg Wasser = 1 l).')]}}],
['Warmwasserspeicher am Drehstromnetz',r=>{let R,I,Um;do{R=rg(r,50,80,5);I=rg(r,3.5,5.5,.1);Um=R*I}while(Um<235||Um>390);const Us=400/Math.sqrt(3),Is=Us/R,P=3*Us*Is,V=rg(r,60,120,10),dT=P*3600/1000/(V*4.18);return{intro:`Ein Warmwasserspeicher hat drei gleiche Heizelemente mit je ${R} Ω, ausgelegt für höchstens ${I} A. Er soll am Drehstromnetz (400 V Leiterspannung) betrieben werden. Verluste und Blindleistung bleiben unberücksichtigt.`,steps:[STP('Welche Spannung darf höchstens an einem Heizelement liegen?',Um,'V',[`U_max = R · I_max = ${R} · ${I} = ${nf(Um)} V`,'Bei 400 V Leiterspannung wäre das Dreieck zu viel, deshalb Sternschaltung.'],'Ohmsches Gesetz mit dem maximalen Strom.'),STP('Welche Spannung liegt in Sternschaltung an einem Strang?',Us,'V',[`U_Str = U_L / √3 = 400 / 1,732 = ${nf(Us)} V`],'Sternschaltung: Strangspannung = Leiterspannung / √3.'),STP('Welche Leistung nimmt ein Strang auf?',Us*Is,'W',[`I_Str = U_Str / R = ${nf(Is)} A`,`P_Str = U_Str · I_Str = ${nf(Us*Is)} W`],'P = U² / R mit der Strangspannung.'),STP('Welche Gesamtleistung ergibt sich?',P,'W',[`P_ges = 3 · P_Str = ${nf(P)} W`],'Drei gleiche Stränge.'),STP(`Um wie viel Kelvin erwärmen sich ${V} l Wasser in einer Stunde?`,dT,'K',[`W = P · t = ${nf(P/1000)} kW · 3600 s = ${nf(P*3.6)} kJ`,`ΔT = Q / (m · c) = ${nf(P*3.6)} / (${V} · 4,18) = ${nf(dT)} K`],'W = P · t in kJ, dann Q = m · c · ΔT nach ΔT umstellen.')]}}],
['Flaschenstau am Förderband',r=>{const L=rg(r,3.5,6,.1),mF=rg(r,.3,.5,.005),d=rg(r,60,80,5),mu=rg(r,.04,.12,.01),Fz=rg(r,100,200,10),v=rg(r,.5,2,.1),z=Math.floor(L*1000/d),m=z*mF,FN=m*9.81,FR=mu*FN;return{intro:`Auf einer Staustrecke von ${L} m stehen Flaschen (Durchmesser ${d} mm, Masse je ${mF} kg) dicht an dicht. Die Kette wird unter ihnen durchgezogen, die Reibungszahl beträgt μ = ${mu}. Die Zugkraft beträgt ${Fz} N bei ${v} m/s Kettengeschwindigkeit.`,steps:[STP('Wie viele Flaschen stehen im Stau?',z,'',[`z = L / d = ${L*1000} mm / ${d} mm = ${nf(L*1000/d)} ⇒ ${z} Flaschen (abgerundet)`],'Länge durch Flaschendurchmesser, ganzzahlig abrunden.',{abs:.5}),STP('Wie groß ist die Normalkraft?',FN,'N',[`m = z · m_Fl = ${nf(m)} kg`,`F_N = m · g = ${nf(m)} · 9,81 = ${nf(FN)} N`],'F_N = Gesamtmasse · g'),STP('Wie groß ist die Reibkraft?',FR,'N',[`F_R = μ · F_N = ${mu} · ${nf(FN)} = ${nf(FR)} N`],'F_R = μ · F_N'),STP('Welche Antriebsleistung ist bei der Zugkraft nötig?',Fz*v,'W',[`P = F_Z · v = ${Fz} N · ${v} m/s = ${nf(Fz*v)} W`],'P = F · v')]}}],
['Zugstange: erforderlicher Querschnitt',r=>{const Re=rg(r,400,700,10),F=rg(r,150,350,10),n=pk(r,[2,3,4]),sz=Re/n,S=F*1000/sz,b=Math.sqrt(S/(1+PI/4));return{intro:`Eine Zugstange aus einem Werkstoff mit R_e = ${Re} N/mm² wird mit ${F} kN belastet. Zulässig ist 1/${n} der Streckgrenze. Der Querschnitt besteht aus einem Quadrat mit der Kantenlänge b und zwei angesetzten Halbkreisen mit dem Durchmesser b.`,steps:[STP('Wie groß ist die zulässige Spannung?',sz,'N/mm²',[`σ_zul = R_e / ${n} = ${nf(sz)} N/mm²`],'σ_zul = R_e geteilt durch den Sicherheitsfaktor.'),STP('Welchen Querschnitt braucht die Stange mindestens?',S,'mm²',[`S = F / σ_zul = ${F*1000} N / ${nf(sz)} N/mm² = ${nf(S)} mm²`],'σ = F / S, nach S umstellen (kN in N umrechnen).'),STP('Wie groß muss b mindestens sein?',b,'mm',[`S = b² + 2 · (π/8 · b²) = b² · (1 + π/4) = 1,785 · b²`,`b = √(S / 1,785) = ${nf(b)} mm`],'Zwei Halbkreise ergeben einen Kreis mit Durchmesser b: Fläche π/4 · b².')]}}],
['Lastenaufzug und Motorwahl',r=>{const m=rg(r,500,1500,100),h=rg(r,6,12),t=rg(r,20,40,5),e=rg(r,.7,.85,.05),eM=rg(r,.8,.9,.01),Pab=pk(r,[3000,3500,4000,5500]),cp=pk(r,[.85,.9]),I=Math.round(Pab/(Math.sqrt(3)*400*cp*eM)*10)/10,Pn=m*9.81*h/t,Pm=Pn/e,etaM=Pab/(Math.sqrt(3)*400*I*cp);return{intro:`Ein Lastenaufzug hebt ${m} kg um ${h} m in ${t} s. Der Gesamtwirkungsgrad von Aufzug und Getriebe beträgt ${e}. Der vorhandene Drehstrommotor hat laut Typenschild ${Pab} W Abgabeleistung, 400 V, ${I} A und cos φ = ${cp}. Die Masse des Aufzugsgeschirrs bleibt unberücksichtigt.`,steps:[STP('Welche Hubleistung ist nötig?',Pn,'W',[`P_Hub = m · g · h / t = ${m} · 9,81 · ${h} / ${t} = ${nf(Pn)} W`],'Leistung = Hubarbeit / Zeit.'),STP('Welche Abgabeleistung muss der Motor mindestens haben?',Pm,'W',[`P_Motor,ab = P_Hub / η = ${nf(Pn)} / ${e} = ${nf(Pm)} W`,Pab>=Pm?'Der Motor aus dem Lager reicht aus.':'Der Motor aus dem Lager reicht nicht aus.'],'Der Wirkungsgrad vergrößert die nötige Leistung: P_zu = P_nutz / η.'),STP('Welchen Wirkungsgrad hat der Motor laut Typenschild?',etaM,'',[`P_zu = √3 · U · I · cos φ = ${nf(Math.sqrt(3)*400*I*cp)} W`,`η_Motor = P_ab / P_zu = ${nf(etaM)}`],'Aufgenommene Leistung im Drehstromnetz: P = √3 · U · I · cos φ.',{rel:.03})]}}],
['Stoßfuge an der Eisenbahnschiene',r=>{const L=rg(r,20,30,5),dT=rg(r,10,20,5),p=rg(r,20,40,10),T0=rg(r,0,10,5),dl=12e-6*L*dT*1000,g0=dl/(p/100),dTt=g0/(12e-6*L*1000);return{intro:`Eine ${L} m lange Stahlschiene (α = 12·10⁻⁶ 1/K) hat an ihrem Ende eine Stoßfuge. Bei einer Erwärmung von ${T0} °C auf ${T0+dT} °C verengt sich die Fuge um ${p} % ihrer Ausgangsbreite.`,steps:[STP('Um wie viel dehnt sich die Schiene bei dieser Erwärmung?',dl,'mm',[`ΔL = α · L₀ · ΔT = 12·10⁻⁶ · ${L} m · ${dT} K = ${nf(dl)} mm`],'ΔL = α · L₀ · ΔT'),STP('Wie breit ist die Fuge am Anfang?',g0,'mm',[`${p} % der Fuge = ${nf(dl)} mm`,`Fuge = ${nf(dl)} / ${p/100} = ${nf(g0)} mm`],'Die Längenänderung ist ein Prozentsatz der Fugenbreite (Dreisatz).'),STP('Um wie viel Kelvin muss man erwärmen, bis sich die Schienen berühren?',dTt,'K',[`ΔT = ΔL / (α · L₀) = ${nf(g0)} mm / (12·10⁻⁶ · ${L*1000} mm) = ${nf(dTt)} K`],'ΔL = Fugenbreite setzen und nach ΔT umstellen.'),STP('Bei welcher Temperatur berühren sie sich?',T0+dTt,'°C',[`ϑ = ${T0} °C + ${nf(dTt)} K = ${nf(T0+dTt)} °C`],'Ausgangstemperatur plus Temperaturänderung.')]}}],
['Pkw an der Ampel',r=>{const d=rg(r,35,45),v0=rg(r,40,60,5),v1=v0+10,tR=rg(r,.5,1,.1),s1=v0/3.6*tR,s2=(v0+v1)/2/3.6,t3=3-tR-1,s3=v1/3.6*t3,s=s1+s2+s3;return{intro:`Ein Pkw fährt mit ${v0} km/h auf eine Ampel zu. ${d} m vor der Ampel springt sie auf Gelb (Gelbphase 3 s). Nach ${tR} s Reaktionszeit beschleunigt der Fahrer 1 s lang gleichmäßig auf ${v1} km/h und fährt dann konstant weiter.`,steps:[STP('Welchen Weg legt der Pkw in der Reaktionszeit zurück?',s1,'m',[`s₁ = v₀ · t_R = ${nf(v0/3.6)} m/s · ${tR} s = ${nf(s1)} m`],'km/h durch 3,6 teilen, dann Weg = v · t.'),STP('Welchen Weg legt er beim Beschleunigen zurück?',s2,'m',[`s₂ = ½ · (v₀ + v₁) · t = ½ · (${nf(v0/3.6)} + ${nf(v1/3.6)}) · 1 s = ${nf(s2)} m`],'Gleichmäßig beschleunigt: Mittelwert der Geschwindigkeiten mal Zeit.'),STP(`Welchen Weg legt er in den restlichen ${nf(t3)} s zurück?`,s3,'m',[`s₃ = v₁ · t₃ = ${nf(v1/3.6)} · ${nf(t3)} = ${nf(s3)} m`],'Die Gelbphase dauert 3 s, davon sind Reaktions- und Beschleunigungszeit schon vergangen.'),STP('Wie weit ist der Pkw beim Umschalten auf Rot von der Ampel entfernt? (negativ: schon darüber hinaus)',d-s,'m',[`s = ${nf(s1)} + ${nf(s2)} + ${nf(s3)} = ${nf(s)} m`,`Rest = ${d} − ${nf(s)} = ${nf(d-s)} m`,d-s>0?'Der Pkw passiert die Ampel erst bei Rot.':'Der Pkw passiert die Ampel noch bei Gelb.'],'Gesamtweg in drei Sekunden vom Abstand zur Ampel abziehen.')]}}],
['Rollcontainer auf der Rampe',r=>{const m=rg(r,40,80,10),v=rg(r,.5,1.5,.5),p=rg(r,3,8),Fb=rg(r,70,100,5),Fr=rg(r,8,14),al=Math.atan(p/100),FH=m*9.81*Math.sin(al),Fa=Fb+Fr-FH,s=.5*m*v*v/Fa;return{intro:`Ein Rollcontainer (${m} kg) rollt mit ${v} m/s eine Rampe mit ${p} % Gefälle hinunter. Eine Notbremse wirkt mit ${Fb} N, die Rollreibung beträgt ${Fr} N. Weitere Einflüsse bleiben unberücksichtigt.`,steps:[STP('Wie groß ist der Neigungswinkel der Rampe?',al*180/PI,'°',[`tan α = ${p} % = ${p/100} ⇒ α = ${nf(al*180/PI)}°`],'Gefälle in Prozent = tan α · 100 %.',{abs:.05}),STP('Wie groß ist die Hangabtriebskraft?',FH,'N',[`F_H = m · g · sin α = ${m} · 9,81 · sin ${nf(al*180/PI)}° = ${nf(FH)} N`],'F_H = F_G · sin α'),STP('Wie groß ist die abbremsende Gesamtkraft (Anhaltekraft)?',Fa,'N',[`F_an = F_Brems + F_Roll − F_H = ${Fb} + ${Fr} − ${nf(FH)} = ${nf(Fa)} N`],'Die Hangabtriebskraft treibt den Container an, Bremse und Rollreibung bremsen.'),STP('Wie lang ist der Bremsweg?',s,'m',[`W_kin = F_an · s ⇒ s = ½ · m · v² / F_an`,`s = ${nf(.5*m*v*v)} J / ${nf(Fa)} N = ${nf(s)} m`],'Bewegungsenergie = Bremskraft mal Bremsweg.')]}}],
['Scheinwerferlampe mit Übergangswiderstand',r=>{const P=rg(r,45,65,5),rü=rg(r,.3,.7,.1),UL=rg(r,9.5,11,.5),R=144/P,I2=(12-UL)/rü;return{intro:`Eine Kfz-Lampe hat ${P} W bei 12 V. In der korrodierten Fassung entsteht ein Übergangswiderstand von ${rü} Ω in Reihe zur Lampe, wodurch an der Lampe nur noch ${UL} V gemessen werden. Die Bordspannung bleibt 12 V.`,steps:[STP('Welchen Widerstand hat die Lampe im Normalbetrieb?',R,'Ω',[`R = U² / P = 12² / ${P} = ${nf(R)} Ω`],'R = U² / P'),STP('Welcher Strom fließt jetzt?',I2,'A',[`Spannungsfall am Übergangswiderstand = 12 V − ${UL} V = ${nf(12-UL)} V`,`I = U_Ü / R_Ü = ${nf(12-UL)} / ${rü} = ${nf(I2)} A`],'Am Übergangswiderstand fällt die Differenz zur Bordspannung ab.'),STP('Welche Leistung hat die Lampe jetzt?',UL*I2,'W',[`P = U_L · I = ${UL} · ${nf(I2)} = ${nf(UL*I2)} W`,'Der Glühfaden ist kühler, deshalb sinkt sein Widerstand etwas.'],'P = U · I mit der Spannung an der Lampe.')]}}],
['Sitzheizung mit Stufenschalter',r=>{const a=rg(r,1.5,3,.5),b=rg(r,1.5,3,.5),c=rg(r,3,5,.5),U=pk(r,[12,24]),I1=U/(a+b+c),I2=U/(b+c),UR2=I2*b,Rg=(a+b)*c/(a+b+c),I3=U/Rg;return{intro:`Eine Sitzheizung (${U} V) hat drei Heizwiderstände R₁ = ${a} Ω, R₂ = ${b} Ω, R₃ = ${c} Ω. Stufe 1: alle drei in Reihe. Stufe 2: nur R₂ und R₃ in Reihe. Stufe 3: (R₁ + R₂) parallel zu R₃.`,steps:[STP('Welcher Strom fließt in Stufe 1?',I1,'A',[`R_ges = ${a} + ${b} + ${c} = ${nf(a+b+c)} Ω`,`I = U / R_ges = ${nf(I1)} A`],'In Reihe addieren sich die Widerstände.'),STP('Welche Spannung liegt in Stufe 2 an R₂?',UR2,'V',[`I = ${U} / ${nf(b+c)} = ${nf(I2)} A`,`U₂ = I · R₂ = ${nf(UR2)} V`],'Erst den Strom der Reihenschaltung bestimmen, dann U = I · R.'),STP('Welcher Gesamtstrom fließt in Stufe 3?',I3,'A',[`R₁₂ = ${nf(a+b)} Ω, R_ges = R₁₂ · R₃ / (R₁₂ + R₃) = ${nf(Rg)} Ω`,`I = ${U} / ${nf(Rg)} = ${nf(I3)} A`],'Erst die Reihenzweige addieren, dann parallel zusammenfassen.'),STP('Wie groß ist die Leistung in Stufe 3?',U*I3,'W',[`P = U · I = ${U} · ${nf(I3)} = ${nf(U*I3)} W`],'P = U · I')]}}],
['Bremspedal (Hebel und Hydraulik)',r=>{const p1=rg(r,.8,1.5,.1),d1=rg(r,10,14),d2=rg(r,30,40,2),d3=rg(r,20,28,2),la=rg(r,30,50,5),lb=rg(r,180,220,10),p2=p1*(d1/d2)**2,F2=p2*PI*d3*d3/4,F=F2*la/lb;return{intro:`Der Bremskolben (d₁ = ${d1} mm) benötigt einen Druck von ${p1} MPa. Die Kraft an ihm wird von einem größeren Kolben (d₂ = ${d2} mm) aufgebracht, auf den der Druck p₂ wirkt. Derselbe Druck p₂ wirkt auf einen Pedalkolben mit d₃ = ${d3} mm. Dessen Kolbenkraft wird über einen Pedalhebel erzeugt (Hebelarm am Kolben ${la} mm, am Fuß ${lb} mm).`,steps:[STP('Wie groß ist der Druck p₂ im größeren Zylinder?',p2,'MPa',[`p₂ = p₁ · (d₁ / d₂)² = ${p1} · (${d1} / ${d2})² = ${nf(p2)} MPa`],'Gleiche Kraft auf unterschiedlichen Flächen: p₁ · A₁ = p₂ · A₂ mit A ~ d².'),STP('Welche Kolbenkraft ergibt sich am Pedalkolben?',F2,'N',[`F = p · A = ${nf(p2)} N/mm² · π/4 · ${d3}² mm² = ${nf(F2)} N`],'1 MPa = 1 N/mm².'),STP('Welche Pedalkraft ist nötig?',F,'N',[`Hebelgesetz: F_K · ${la} = F · ${lb}`,`F = ${nf(F2)} · ${la} / ${lb} = ${nf(F)} N`],'Hebelgesetz: Kraft mal Kraftarm = Last mal Lastarm.')]}}],
['Luftfilter und Volumenstrom',r=>{const a=rg(r,1,1.5,.1),v1=rg(r,12,24,2),v2=rg(r,1.5,3,.5),w=v1/3.6,Q=a*a*w,b=Q/(a*v2);return{intro:`Ein Ansaugschacht mit quadratischem Querschnitt (Kantenlänge ${a} m) saugt Luft mit ${v1} km/h an. Die gereinigte Luft strömt durch eine rechteckige Öffnung der Höhe ${a} m und der Breite b mit ${v2} m/s wieder in die Halle.`,steps:[STP('Wie schnell strömt die Luft am Ansaugschacht in m/s?',w,'m/s',[`v₁ = ${v1} / 3,6 = ${nf(w)} m/s`],'km/h durch 3,6 teilen.'),STP('Wie groß ist der Volumenstrom?',Q,'m³/s',[`Q = A₁ · v₁ = ${a}² · ${nf(w)} = ${nf(Q)} m³/s`],'Q = Querschnitt mal Geschwindigkeit.'),STP('Wie breit ist die Zuluftöffnung?',b,'m',[`A₁ · v₁ = A₂ · v₂ ⇒ b = Q / (h · v₂) = ${nf(Q)} / (${a} · ${v2}) = ${nf(b)} m`],'Kontinuitätsgleichung: Der Volumenstrom bleibt gleich.')]}}],
['Paket in der Förderbandkurve',r=>{const mu=rg(r,.4,.7,.05),R=rg(r,3,6,.5),v=Math.sqrt(mu*9.81*R);return{intro:`Ein Paket liegt auf einem Förderband und durchläuft eine Kurve. Der Schwerpunkt ist ${R} m vom Kurvenmittelpunkt entfernt, die Haftreibungszahl beträgt μ₀ = ${mu}.`,steps:[STP('Bei welcher Geschwindigkeit rutscht das Paket aus der Kurve?',v,'m/s',[`F_Zentripetal = F_Haft ⇒ m · v² / r = μ₀ · m · g`,`v = √(μ₀ · g · r) = √(${mu} · 9,81 · ${R}) = ${nf(v)} m/s`],'Die Haftreibung liefert die Zentripetalkraft.'),STP('Wie viel km/h sind das?',v*3.6,'km/h',[`${nf(v)} · 3,6 = ${nf(v*3.6)} km/h`],'m/s mal 3,6 ergibt km/h.'),STP('Um welchen Faktor ändert sich die Grenzgeschwindigkeit bei doppelter Paketmasse?',1,'',['Die Masse kürzt sich heraus: v = √(μ₀ · g · r).','Der Faktor ist 1, die Geschwindigkeit bleibt gleich.'],'Schau, ob m in der Formel für v übrig bleibt.',{abs:.01})]}}],
['Pneumatikzylinder: Bewegungsablauf',r=>{const a=pk(r,[1.2,1.6,2]),v=pk(r,[.6,.8,1]),s=rg(r,800,1200,100),tb=rg(r,.6,1,.1),sB=v*v/(2*a),sV=v*v/(4*a),sc=s/1000-sB-sV,tB=v/a,tV=v/(2*a),tc=sc/v,tH=tB+tc+tV,N=60/(tH+tb);return{intro:`Ein Pneumatikzylinder mit ${s} mm Hub beschleunigt mit ${a} m/s² auf ${v} m/s, fährt dann mit konstanter Geschwindigkeit und verzögert mit dem doppelten Betrag der Beschleunigung bis zum Stillstand. Das Einfahren dauert ${tb} s.`,steps:[STP('Wie lange dauert die Beschleunigungsphase?',tB,'s',[`t_B = v / a = ${v} / ${a} = ${nf(tB)} s`],'v = a · t'),STP('Wie lange dauert die Verzögerung?',tV,'s',[`a_V = 2 · a = ${2*a} m/s²`,`t_V = v / a_V = ${nf(tV)} s`],'Verzögerung ist doppelt so groß wie die Beschleunigung.'),STP('Welchen Weg legt der Kolben mit konstanter Geschwindigkeit zurück?',sc*1000,'mm',[`s_B = ½ · v · t_B = ${nf(sB)} m, s_V = ½ · v · t_V = ${nf(sV)} m`,`s_konst = ${s/1000} − ${nf(sB)} − ${nf(sV)} = ${nf(sc)} m = ${nf(sc*1000)} mm`],'Hub minus Beschleunigungsweg minus Bremsweg. Weg = ½ · v · t.'),STP('Wie lange dauert das Ausfahren insgesamt?',tH,'s',[`t_konst = ${nf(sc)} / ${v} = ${nf(tc)} s`,`t_Hub = ${nf(tB)} + ${nf(tc)} + ${nf(tV)} = ${nf(tH)} s`],'Summe der drei Zeiten.'),STP('Wie viele Hübe schafft der Zylinder pro Minute?',N,'1/min',[`Zykluszeit = ${nf(tH)} + ${tb} = ${nf(tH+tb)} s`,`n = 60 s / ${nf(tH+tb)} s = ${nf(N)} pro Minute`],'Zykluszeit = Ausfahren plus Einfahren.',{rel:.03})]}}],
['Anschlussleitung und Spannungsfall',r=>{const I=rg(r,8,16),L=rg(r,15,40,5),A=pk(r,[1.5,2.5,4]),R=230/I,RL=.0179*2*L/A,I2=230/(R+RL),UV=RL*I2,pr=UV/230*100,Pr=(230-UV)**2/R;return{intro:`Ein Antrieb (Typenschild: 230 V, ${I} A) wird über eine ${L} m lange Kupferleitung (Querschnitt ${A} mm², ρ = 0,0179 Ω·mm²/m) angeschlossen. Hin- und Rückleiter sind zu berücksichtigen.`,steps:[STP('Welchen Widerstand hat der Antrieb?',R,'Ω',[`R = U / I = 230 / ${I} = ${nf(R)} Ω`],'Ohmsches Gesetz'),STP('Wie groß ist der Leiterwiderstand?',RL,'Ω',[`R_L = ρ · 2 · L / A = 0,0179 · 2 · ${L} / ${A} = ${nf(RL)} Ω`],'Der Strom fließt durch Hin- und Rückleiter, also die doppelte Länge.'),STP('Wie groß ist der Spannungsfall in der Leitung?',UV,'V',[`R_ges = ${nf(R)} + ${nf(RL)} = ${nf(R+RL)} Ω`,`I = 230 / ${nf(R+RL)} = ${nf(I2)} A`,`U_V = R_L · I = ${nf(RL)} · ${nf(I2)} = ${nf(UV)} V`],'Leitung und Antrieb liegen in Reihe: erst den Strom bestimmen.'),STP('Wie viel Prozent der Bemessungsspannung sind das?',pr,'%',[`${nf(UV)} / 230 · 100 % = ${nf(pr)} %`,pr<=3?'Innerhalb der Toleranz von 3 %.':'Über der Toleranz von 3 %.'],'Spannungsfall durch 230 V, mal 100.',{abs:.05}),STP('Welche Leistung nimmt der Antrieb tatsächlich auf?',Pr,'W',[`U_K = 230 − ${nf(UV)} = ${nf(230-UV)} V`,`P = U_K² / R = ${nf(230-UV)}² / ${nf(R)} = ${nf(Pr)} W`],'Am Antrieb liegt nur die Klemmenspannung.')]}}],
['Stahltopf erwärmen',r=>{const mT=rg(r,1000,2500,100),V=rg(r,3,8),dT=rg(r,10,60,10),Qw=V*4.18*dT,Qt=mT/1000*.49*dT;return{intro:`In einem ${mT} g schweren Stahltopf (c = 0,49 kJ/(kg·K)) sollen ${V} l Wasser (c = 4,18 kJ/(kg·K)) um ${dT} K erwärmt werden.`,steps:[STP('Wie viel Wärme braucht das Wasser?',Qw,'kJ',[`Q_W = m · c · ΔT = ${V} · 4,18 · ${dT} = ${nf(Qw)} kJ`],'1 l Wasser = 1 kg.'),STP('Wie viel Wärme braucht der Topf?',Qt,'kJ',[`Q_T = ${mT/1000} · 0,49 · ${dT} = ${nf(Qt)} kJ`],'Masse in kg umrechnen.'),STP('Wie viel Energie ist insgesamt nötig?',Qw+Qt,'kJ',[`Q = Q_W + Q_T = ${nf(Qw)} + ${nf(Qt)} = ${nf(Qw+Qt)} kJ`],'Beide Wärmemengen addieren.')]}}],
['Wippe im Gleichgewicht',r=>{const m1=rg(r,60,90,5),m2=rg(r,30,50,5),l2=rg(r,1,2,.1),m3=rg(r,20,40,5),l3=rg(r,.5,1.5,.1),Mr=(m2*l2+m3*l3)*9.81,l1=(m2*l2+m3*l3)/m1;return{intro:`Auf einer Wippe sitzen links eine Person mit ${m1} kg, rechts eine mit ${m2} kg im Abstand ${l2} m und eine mit ${m3} kg im Abstand ${l3} m vom Drehpunkt. Die Wippe ist im Gleichgewicht.`,steps:[STP('Wie groß ist das rechtsdrehende Gesamtmoment?',Mr,'N·m',[`M_rechts = (m₂ · l₂ + m₃ · l₃) · g = (${m2}·${l2} + ${m3}·${l3}) · 9,81 = ${nf(Mr)} N·m`],'Moment = Kraft mal Hebelarm, F = m · g.'),STP('In welchem Abstand sitzt die linke Person?',l1,'m',[`Gleichgewicht: m₁ · g · l₁ = M_rechts`,`l₁ = ${nf(Mr)} / (${m1} · 9,81) = ${nf(l1)} m`],'Linksdrehendes Moment = rechtsdrehendes Moment.')]}}]];
/* Muendliche Pruefung */
const ORAL=[
['Chemie','Was versteht man unter Oxidation? Wie heißt das Reaktionsprodukt?','Oxidation ist die Reaktion eines Stoffes mit Sauerstoff, allgemeiner die Abgabe von Elektronen (die Oxidationszahl steigt). Das Produkt ist ein Oxid, z. B. 2 Mg + O₂ → 2 MgO.'],
['Chemie','Erkläre FeO + C → Fe + CO. Welche Rolle hat der Kohlenstoff?','Eisen(II)-oxid wird zu Eisen reduziert, es gibt seinen Sauerstoff ab. Kohlenstoff nimmt den Sauerstoff auf und wird zu Kohlenmonoxid oxidiert. Kohlenstoff ist das Reduktionsmittel, FeO das Oxidationsmittel. Beide Vorgänge laufen gleichzeitig ab (Redoxreaktion, Hochofenprozess).'],
['Chemie','Was ist ein Reduktionsmittel, was ein Oxidationsmittel? Beispiel Fe₂O₃ + 2 Al → 2 Fe + Al₂O₃','Das Reduktionsmittel gibt Elektronen ab (nimmt Sauerstoff auf) und wird dabei selbst oxidiert. Das Oxidationsmittel nimmt Elektronen auf (gibt Sauerstoff ab) und wird reduziert. Hier ist Aluminium das Reduktionsmittel und Eisen(III)-oxid das Oxidationsmittel (Thermitverfahren).'],
['Chemie','Wie unterscheidet man Säuren von Laugen? Welchen pH-Wert hat destilliertes Wasser?','Mit Indikatoren (Lackmus, Universalindikator) oder einem pH-Messgerät: Säuren haben pH < 7, Laugen pH > 7. Destilliertes Wasser ist neutral mit pH 7. Die pH-Skala reicht üblicherweise von 0 bis 14.'],
['Chemie','Ordne zu: Na₂SO₄, H₃PO₄, KOH, CuCl₂, H₂CO₃, Ca(OH)₂. Säure, Lauge oder Salz?','Säuren: H₃PO₄ (Phosphorsäure) und H₂CO₃ (Kohlensäure). Laugen: KOH (Kalilauge) und Ca(OH)₂ (Kalkwasser). Salze: Na₂SO₄ (Natriumsulfat) und CuCl₂ (Kupferchlorid). Merkhilfe: Säuren beginnen meist mit H, Laugen enden auf OH.'],
['Chemie','Wie entsteht Saurer Regen und welche Folgen hat er?','Schwefeldioxid und Stickstoffoxide aus Verbrennungen lösen sich im Regenwasser zu schwefliger Säure und Salpetersäure. Der pH-Wert fällt unter etwa 5,6. Folgen: schnellere Korrosion von Metallen, Angriff auf Kalkstein und Beton, schnellere Alterung von Kunststoffen, Schäden an Wald und Boden.'],
['Chemie','Beschreibe einen Vorgang, bei dem eine Säure entsteht.','Nichtmetalloxide reagieren mit Wasser zu Säuren, zum Beispiel SO₂ + H₂O → H₂SO₃ (schweflige Säure) oder CO₂ + H₂O → H₂CO₃ (Kohlensäure). Auch Chlorwasserstoff ergibt in Wasser Salzsäure.'],
['Chemie','Was ist elektrochemische Korrosion? Was passiert bei verletzter Zink- oder Zinnschicht auf Eisen?','Zwei Metalle mit unterschiedlichem Potenzial sind leitend verbunden, ein Elektrolyt (z. B. Regenwasser) schließt den Stromkreis. Das unedlere Metall ist die Anode und löst sich auf. Zink ist unedler als Eisen: Zink löst sich auf und schützt das Eisen (Opferanode). Zinn ist edler als Eisen: Das Eisen löst sich unter der Schicht auf (Unterrostung).'],
['Chemie','Welche Voraussetzungen hat Korrosion und wie schützt man sich?','Voraussetzungen: Metall, Sauerstoff und Feuchtigkeit (Elektrolyt), bei Kontaktkorrosion zwei verschiedene Metalle. Schutz: geeignete Werkstoffwahl (z. B. Edelstahl), Beschichten (Lackieren, Verzinken, Einölen), Spalten und Wasseransammlungen vermeiden, trocken lagern, Opferanoden.'],
['Chemie','Was ist die Anomalie des Wassers?','Wasser hat bei 4 °C seine größte Dichte. Beim weiteren Abkühlen dehnt es sich aus. Eis ist leichter als Wasser und schwimmt. Folge: Gewässer frieren von oben zu, gefrierende Rohre können platzen.'],
['Chemie','Was ist ein Lösungsmittel? Welche Mineralstoffe enthält Leitungswasser?','Ein Lösungsmittel löst oder verdünnt andere Stoffe ohne chemische Reaktion (Lösen ist ein physikalischer Vorgang), Wasser ist das wichtigste. Leitungswasser enthält z. B. Calcium-, Magnesium-, Natrium- und Kalium-Ionen sowie Chloride, Sulfate und Hydrogencarbonate.'],
['Chemie','2 H₂ + O₂ → 2 H₂O: Welche Reaktionsart ist das und warum muss die Gleichung ausgeglichen sein?','Es ist eine Synthese (Verbrennung von Wasserstoff, exotherm) und zugleich eine Redoxreaktion. Ausgeglichen muss sie sein, weil keine Atome verloren gehen (Massenerhaltung): links 4 H und 2 O, rechts 4 H und 2 O.'],
['Chemie','Was bewirkt der Wasserstoff in CuO + H₂ → Cu + H₂O?','Wasserstoff nimmt den Sauerstoff vom Kupferoxid auf und wird zu Wasser oxidiert, das Kupferoxid wird zu Kupfer reduziert. Wasserstoff ist hier das Reduktionsmittel, CuO das Oxidationsmittel.'],
['Chemie','Beschreibe die Aggregatzustände und ihre Übergänge.','Fest (Teilchen an festen Plätzen), flüssig (Teilchen verschiebbar), gasförmig (frei beweglich, große Abstände). Übergänge: Schmelzen und Erstarren (fest und flüssig), Verdampfen und Kondensieren (flüssig und gasförmig), Sublimieren und Resublimieren (fest und gasförmig).'],
['Physik','Wovon hängt die Längenänderung bei Temperaturänderung ab? Warum steht in der Volumenformel eine 3?','ΔL = α · L₀ · ΔT: Sie hängt von der Ausgangslänge, der Temperaturänderung und dem Werkstoff (α) ab. Das Volumen dehnt sich in drei Raumrichtungen aus: ΔV = γ · V₀ · ΔT mit γ ≈ 3 · α. Bei Gasen ist γ ≈ 1/273 K⁻¹.'],
['Physik','Erläutere die gleichförmige Bewegung und skizziere das v-t-Diagramm.','Die Geschwindigkeit ist konstant, es gibt keine Beschleunigung: s = v · t. Im v-t-Diagramm ist das eine waagerechte Gerade, im s-t-Diagramm eine ansteigende Gerade durch den Ursprung. Die Fläche unter der v-t-Linie ist der Weg.'],
['Physik','Was für eine Bewegung ist der freie Fall? Wie sieht das v-t-Diagramm aus?','Eine gleichmäßig beschleunigte Bewegung mit a = g ≈ 9,81 m/s²: v = g · t und s = ½ · g · t². Das v-t-Diagramm ist eine Ursprungsgerade, das s-t-Diagramm eine Parabel.'],
['Physik','Welche Reibungsarten gibt es und wovon hängt die Reibkraft ab?','Haftreibung, Gleitreibung und Rollreibung (Haft > Gleit > Roll). F_R = μ · F_N: Sie hängt von der Normalkraft und der Werkstoffpaarung (Reibungszahl) ab, nicht von der Größe der Auflagefläche.'],
['Physik','Ein Stahlkörper (100 kg) wird gleichmäßig über eine Stahlschiene gezogen. Wie bestimmst Du die Zugkraft?','Bei gleichmäßiger Bewegung ist die Zugkraft gleich der Gleitreibungskraft: F_Z = μ · F_N = μ · m · g. Mit F_N = 100 kg · 9,81 m/s² ≈ 981 N und der Gleitreibungszahl Stahl auf Stahl aus der Tabelle (etwa 0,1 bis 0,2) ergeben sich rund 100 bis 200 N.'],
['Physik','Zeichne die Kräfte an einer schiefen Ebene und erkläre ihre Bedeutung.','Gewichtskraft F_G senkrecht nach unten, Normalkraft F_N = F_G · cos α senkrecht zur Ebene, Hangabtriebskraft F_H = F_G · sin α parallel zur Ebene, dazu die Reibkraft F_R = μ · F_N gegen die Bewegung. Beim Hochschieben müssen F_H und F_R überwunden werden, beim Abrutschen halten Haftreibung und F_H sich die Waage.'],
['Physik','Wie berechnet man die Arbeit, wenn eine Last auf die Höhe h gebracht wird, direkt oder über eine schiefe Ebene?','Ohne Reibung ist die Arbeit gleich: W = m · g · h. Über die schiefe Ebene braucht man eine kleinere Kraft (F = F_G · h / l), dafür ist der Weg l länger. Mit Reibung ist die aufgewendete Arbeit größer (Goldene Regel der Mechanik).'],
['Physik','Was versteht man unter Druck? Formel und Einheiten?','Druck ist Kraft pro Fläche: p = F / A. Basiseinheit ist das Pascal (1 Pa = 1 N/m²), gebräuchlich sind bar (1 bar = 10⁵ Pa) und mbar bzw. hPa.'],
['Physik','Wo spielen F₁/A₁ = F₂/A₂ und Q = v₁ · A₁ = v₂ · A₂ eine Rolle?','Die erste Gleichung beschreibt die Hydraulik (Presse, Bremsanlage): Der Druck ist überall gleich, kleine Kraft auf kleine Fläche ergibt große Kraft auf große Fläche. Die zweite ist die Kontinuitätsgleichung für strömende Flüssigkeiten und Gase: Wird der Querschnitt kleiner, steigt die Strömungsgeschwindigkeit.'],
['Physik','Erkläre den Wirkungsgrad: Formel, Einheit, größtmöglicher Wert.','η = P_ab / P_zu = W_nutz / W_zu. Er hat keine Einheit (oder wird in % angegeben) und ist immer kleiner als 1 bzw. 100 %, weil immer Verluste (meist Wärme) auftreten.'],
['Physik','Was bedeuten c(Wasser) = 4,19 J/(g·K) und c(Eisen) = 0,49 J/(g·K) für die Erwärmung von je 1 kg?','Q = m · c · ΔT: Wasser braucht pro Kelvin etwa 8,5-mal mehr Energie als Eisen (4,19 / 0,49). Wasser erwärmt sich langsam, speichert aber viel Wärme, Eisen erwärmt sich schnell.'],
['Physik','Was geschieht an den Haltepunkten der Erwärmungskurve von Wasser?','Bei 0 °C (Schmelzen) und bei 100 °C (Verdampfen) bleibt die Temperatur trotz Wärmezufuhr konstant. Die Energie wird für den Phasenwechsel gebraucht (Q = m · q_s bzw. m · q_v), nicht für eine höhere Temperatur.'],
['Physik','Zwei Kräfte unterschiedlicher Größe und Richtung greifen an einem Punkt an. Wie bestimmt man die Resultierende?','Zeichnerisch mit dem Kräfteparallelogramm (oder Kräftedreieck) im Kräftemaßstab, rechnerisch durch Zerlegen in Komponenten und vektorielles Addieren. Bei 90° zwischen den Kräften gilt F_res = √(F₁² + F₂²).'],
['Physik','Auf einer Wippe sitzen drei Personen im Gleichgewicht. Wie lautet die Momentengleichung?','Die Summe der linksdrehenden Momente ist gleich der Summe der rechtsdrehenden Momente: ΣM_links = ΣM_rechts, zum Beispiel F₁ · l₁ = F₂ · l₂ + F₃ · l₃ mit F = m · g.'],
['Physik','Ist die Aussage richtig: Leistung ist Arbeitsgeschwindigkeit?','Ja, im Sinn von Arbeit pro Zeit: P = W / t. Eine größere Leistung heißt, dass dieselbe Arbeit schneller verrichtet wird. Einheit ist das Watt (1 W = 1 J/s).'],
['Elektrotechnik','Welche Größe steht auf der Stromrechnung? Wie berechnen sich elektrische Arbeit und Leistung?','Abgerechnet wird die elektrische Arbeit in Kilowattstunden (kWh). W = P · t und P = U · I, also W = U · I · t. 1 kWh = 3,6 MJ.'],
['Elektrotechnik','Wie hängen die elektrischen Grundgrößen zusammen?','Ohmsches Gesetz U = R · I, Leistung P = U · I = I² · R = U² / R, Arbeit W = P · t. Einheiten: Volt, Ampere, Ohm, Watt.'],
['Elektrotechnik','Zwei Widerstände in Reihe beziehungsweise parallel: Welche Gesetze gelten? Wie sind Haushaltsgeräte geschaltet?','Reihe: gleicher Strom, Spannungen addieren sich, R_ges = R₁ + R₂. Parallel: gleiche Spannung, Ströme addieren sich, 1/R_ges = 1/R₁ + 1/R₂. Im Haushalt sind Verbraucher parallel geschaltet, damit jedes Gerät 230 V bekommt und unabhängig von den anderen arbeitet.'],
['Elektrotechnik','Unterscheide Gleichspannung und Wechselspannung.','Gleichspannung hat konstante Größe und Richtung (Batterie), Wechselspannung ändert periodisch Größe und Richtung (Sinusform, im Netz 50 Hz, 230 V Effektivwert, Drehstrom 400 V). Im Diagramm: waagerechte Linie bzw. Sinuskurve.'],
['Elektrotechnik','Wofür stehen die Schutzklassen I, II und III?','Schutzklasse I: Gehäuse mit Schutzleiter verbunden. Schutzklasse II: Schutzisolierung, kein Schutzleiter nötig (Zeichen: Doppelquadrat). Schutzklasse III: Schutzkleinspannung (z. B. bis 50 V Wechselspannung).'],
['Elektrotechnik','Unterschied zwischen Primär- und Sekundärenergie? Brennwert und Heizwert?','Primärenergie kommt direkt aus Quellen (Kohle, Erdöl, Erdgas, Sonne, Wind), Sekundärenergie entsteht durch Umwandlung (Strom, Benzin, Fernwärme). Der Heizwert ist die nutzbare Wärme ohne die Kondensationswärme des Wasserdampfs im Abgas, der Brennwert enthält sie und ist daher etwas größer.'],
['Statistik','Was zeigt die Gaußsche Glockenkurve? Wo liegen die Wendepunkte?','Die Normalverteilung der Messwerte um den Mittelwert. Sie ist symmetrisch, die Wendepunkte liegen bei x̄ ± s. Im Bereich ±1σ liegen etwa 68,3 %, bei ±2σ 95,4 % und bei ±3σ 99,73 % der Werte.'],
['Statistik','Wie bestimmt man aus einer Häufigkeitstabelle den Mittelwert und eine fehlende Häufigkeit?','x̄ = Σ(xᵢ · hᵢ) / Σhᵢ. Ist der Mittelwert bekannt, setzt man die unbekannte Häufigkeit als x an, stellt die Gleichung (Summe + Wert · x) / (n + x) = x̄ auf und löst nach x auf.']];
