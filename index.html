<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernlabor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8eeed;--grid:#d0dbd9;--card:#f8fbfa;--ink:#14283a;--mute:#52667a;--line:#b9c8c6;--wire:#8fa3a8;--flow:#1f6fd1;--amber:#e3a21a;--ok:#1b8a5a;--red:#c8402e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--grid:#1a2936;--card:#162330;--ink:#e0eaf1;--mute:#93a7b8;--line:#2b3f50;--wire:#4a6577;--flow:#5aa9ff;--amber:#f0b429;--ok:#43c78a;--red:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0f1a24;--grid:#1a2936;--card:#162330;--ink:#e0eaf1;--mute:#93a7b8;--line:#2b3f50;--wire:#4a6577;--flow:#5aa9ff;--amber:#f0b429;--ok:#43c78a;--red:#ff7b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 8px 10px 0}
.seg button{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;border-radius:7px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--flow);outline-offset:2px}
.sub{color:var(--mute);margin:4px 0 14px;max-width:64ch}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1.55fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
.t1{font-size:16px;font-weight:700}.t2{font-size:14px;fill:var(--mute)}
.w{fill:none;stroke:var(--wire);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:none;stroke:var(--flow);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:.1 11;animation:f 1s linear infinite}
@keyframes f{to{stroke-dashoffset:-11.1}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.rb{fill:var(--card);stroke:var(--ink);stroke-width:2}.ra{fill:var(--amber)}
.wall{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.fluid{fill:var(--flow);opacity:.35}
.pst{fill:var(--mute);stroke:var(--ink);stroke-width:2}
.box{fill:var(--amber);stroke:var(--ink);stroke-width:2}
.legend{font-size:13px;color:var(--mute);margin:8px 2px 0}
.ctl{display:grid;grid-template-columns:3.6em 1fr 7em;gap:10px;align-items:center;margin-bottom:12px}
.ctl label{font-weight:700}
.ctl input[type=range]{width:100%;accent-color:var(--flow)}
.ctl .n{display:flex;align-items:center;gap:4px;color:var(--mute)}
.ctl input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:right}
.ctl input[type=number]{}.ctl select{grid-column:2/4;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.fx{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:15px}.fx span{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 8px;margin:4px 6px 0 0}.ctl input.tx{grid-column:2/4;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}[hidden]{display:none!important}.hc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.hc h2{font-size:20px}.hc p{margin:8px 0}.chip{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:4px 6px 0 0;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.btns button{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.res div{background:var(--bg);border-radius:8px;padding:8px 10px}
.res b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.res span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.steps{font-size:14px;margin-top:16px}
.steps p{margin:0 0 8px}.steps .f{color:var(--mute)}.steps .v{font-variant-numeric:tabular-nums}
h2{font-size:16px;margin:0 0 8px}
.simbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;margin-bottom:10px}#stime{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}#stime.amb{color:var(--amber)}#stime.red{color:var(--red);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.55}}#sprog{flex:1;color:var(--mute);font-size:14px}.swarn{color:var(--red);font-weight:600;margin:6px 0}
.sbtn,.sbtn2{font:inherit;padding:9px 16px;border-radius:12px;border:1px solid var(--acc);cursor:pointer}.sbtn{background:var(--acc);color:#fff}.sbtn2{background:transparent;color:var(--acc)}
.smix{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.smix div{flex:1 1 130px;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}.smix b{font-size:24px;color:var(--acc)}.sck{display:block;margin:12px 0}
.stabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.stabs .chip[aria-pressed=true]{background:var(--acc);color:#fff}.sht{margin:4px 0}.sstep{margin:12px 0;padding:10px 0;border-top:1px solid var(--line)}.sstep p{margin:0 0 6px}
.sbig{font-size:42px;margin:6px 0}.sverd{font-size:22px;font-weight:700;margin:0 0 6px}.sres.pass .sverd{color:var(--ok)}.sres.fail .sverd{color:var(--red)}
.sbars>div{display:grid;grid-template-columns:minmax(0,11em) 1fr auto;gap:10px;align-items:center;margin:8px 0}.sbars i{display:block;height:12px;border-radius:8px;background:var(--line);overflow:hidden}.sbars u{display:block;height:100%;background:var(--acc);text-decoration:none}
.sdet{margin-top:12px}.sdet summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.sr{border-left:4px solid var(--line);padding:2px 10px;margin:10px 0}.sr.ok{border-color:var(--ok)}.sr.bad{border-color:var(--red)}.sr p{margin:4px 0}.ssol{background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:10px;padding:4px 10px}.okt{color:var(--ok);font-weight:700}.badt{color:var(--red);font-weight:700}.amt{color:var(--amber);font-weight:700}.shist{padding-left:18px}.sh{margin:16px 0 4px}
@media(max-width:600px){.sbars>div{grid-template-columns:1fr auto}.sbars i{grid-column:1/3;order:3}}

:root{--acc:#3b82f6;--r:16px;--sh:0 1px 2px rgba(20,40,58,.06),0 10px 28px rgba(20,40,58,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4)}}
body[data-f="Physik"]{--acc:#3b82f6}body[data-f="Chemie"]{--acc:#10a37f}body[data-f="Statistik"]{--acc:#8b5cf6}body[data-f="Umrechnen"]{--acc:#f97316}body[data-f="Energie"]{--acc:#d97706}
body{background-image:radial-gradient(1000px 420px at 12% -8%,color-mix(in srgb,var(--acc) 20%,transparent),transparent),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px;background-attachment:fixed;transition:background .3s}
@media(max-width:899px){.grid{grid-template-columns:minmax(0,1fr)}}.grid>*{min-width:0}.panel,.legend{overflow-wrap:anywhere}
h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.03em;margin-bottom:16px}
h1::before{content:"";display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--acc);margin-right:.3em;vertical-align:.08em;box-shadow:0 0 0 .16em color-mix(in srgb,var(--acc) 25%,transparent)}
.seg{border-radius:14px;box-shadow:var(--sh)}
.seg button{border-radius:10px;transition:background .15s,color .15s,transform .15s}
.seg button:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 50%,transparent)}
#fs button{font-weight:800}
.panel,.hc,.fx{border-radius:var(--r);box-shadow:var(--sh)}
.panel{border-top:3px solid var(--acc);animation:in .35s ease both}
.fx{border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.fx span{background:var(--card);border:1px solid var(--line);font-weight:600}
svg{border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,var(--card)),var(--card))}
.ctl input[type=range]{accent-color:var(--acc)}
.ctl input[type=number],.ctl select,.ctl input.tx{border-radius:8px;transition:border-color .15s}
.ctl input:focus,.ctl select:focus{border-color:var(--acc)}
.btns button{border-radius:10px;transition:background .15s,border-color .15s}
.btns button:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--bg))}
.res div{border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card));border-radius:10px}
.res b{font-size:19px}
th{color:var(--mute);font-weight:600;font-size:13px}
.hg{display:grid;gap:16px}
@media(min-width:900px){.hg{grid-template-columns:1fr 1fr}}
.hc{margin:0;border-top:4px solid var(--acc);animation:in .4s ease both}
.hc[data-f="Physik"]{--acc:#3b82f6}.hc[data-f="Chemie"]{--acc:#10a37f}.hc[data-f="Statistik"]{--acc:#8b5cf6}.hc[data-f="Umrechnen"]{--acc:#f97316}.hc[data-f="Energie"]{--acc:#d97706}
.hc h2{display:flex;align-items:center;gap:10px;font-size:22px;margin:0}
.hc h2 .ic{font-size:26px}.hc h2 small{margin-left:auto;font-size:13px;font-weight:600;color:var(--mute)}
.hc .hs{color:var(--mute);font-size:14px;margin:2px 0 8px}
.hc p b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.chip{border-radius:999px;padding:6px 12px;transition:all .15s}
.chip:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg));transform:translateY(-1px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel,.hc{animation:none}*{transition:none!important}}

.sbox{position:relative;margin:0 0 12px}.sbox input{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--ink)}
#sr{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}#sr small{color:var(--mute)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.ph h2{margin:0}.ph select{font:inherit;padding:5px 8px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}#sc{margin-left:auto;font-weight:700;color:var(--acc)}
.pq{font-size:19px;line-height:1.45;margin:14px 0}.pa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pa input{font:inherit;font-size:18px;width:11em;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pa button,.pb button{font:inherit;font-weight:700;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}#pck{background:var(--acc)!important;color:#fff!important;border-color:transparent!important}
#pfb{font-weight:700;min-height:1.5em;margin:10px 0}.pb{display:flex;gap:8px;flex-wrap:wrap}#psol{margin-top:12px;font-size:15px}#psol p{margin:4px 0}.ok{color:var(--ok)}.bad{color:var(--red)}.qk{margin-bottom:16px}
.pq{white-space:pre-line}#popts{display:grid;gap:8px;margin:0 0 12px}.opt{font:inherit;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:all .15s}.opt b{display:inline-block;width:1.6em;color:var(--acc)}.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg))}.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg))}.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--bg))}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.17}
main{position:relative;z-index:1}
.panel,.hc,.fx,.seg{background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.res div{background:color-mix(in srgb,var(--acc) 9%,color-mix(in srgb,var(--card) 80%,transparent))}
</style>

stroke-linejoin="round"><use href="#s-sun" x="20" y="20" width="110" height="110"/><use href="#s-bolt" x="230" y="30" width="60" height="100"/><use href="#s-turb" x="30" y="200" width="130" height="130"/><use href="#s-bolt" x="200" y="220" width="50" height="85" transform="rotate(14 225 262)"/><use href="#s-sun" x="270" y="270" width="60" height="60"/></g></pattern></defs><rect id="bgr" width="100%" height="100%" fill="url(#p-home)"/></svg><main>

<script>
const $=s=>document.querySelector(s),PI=Math.PI,G=9.81,rad=d=>d*PI/180;
const PRE=[['M',1e6],['k',1e3],['',1],['m',1e-3],['µ',1e-6]];
const nf=(v,d=3)=>String(+Number(v).toPrecision(d)).replace('.',',');
const fmt=(v,u)=>{if(!isFinite(v))return '–';if(v===0)return '0 '+u;const a=Math.abs(v),p=PRE.find(x=>a>=x[1]*.9995)||PRE[4];return nf(v/p[1])+' '+p[0]+u};
const T=(x,y,s,c='t1',a='start')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const AR=(x,y,dx,dy,col,lab)=>{const l=Math.hypot(dx,dy);if(l<4)return '';const ux=dx/l,uy=dy/l,X=x+dx,Y=y+dy;return `<line x1="${x}" y1="${y}" x2="${X-ux*8}" y2="${Y-uy*8}" stroke="${col}" stroke-width="3.5"/><polygon points="${X},${Y} ${X-ux*11-uy*5},${Y-uy*11+ux*5} ${X-ux*11+uy*5},${Y-uy*11-ux*5}" fill="${col}"/>`+(lab?T(Math.min(X+6,600),Math.max(Y-6,14),lab,'t2'):'')};
const sub=['₁','₂','₃','₄'],pr=(a,b)=>a*b/(a+b);
const sup=n=>String(n).replace('-','⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const sc=v=>{const e=Math.floor(Math.log10(v));return nf(v/10**e,2)+' · 10'+sup(e)};
const chg=n=>n==0?'':(Math.abs(n)==1?'':sup(Math.abs(n)))+(n>0?'⁺':'⁻');
const M=[];
/* Elektrik */
const circ=m=>({g:'Elektrik',name:['Reihe','Parallel','Gemischt R₁+(R₂∥R₃)','Gemischt (R₁+R₂)∥R₃','Gemischt R₁+(R₂∥R₃)+R₄','Gemischt (R₁+R₂)∥(R₃+R₄)'][m],
 desc:['Überall derselbe Strom, die Spannung teilt sich auf.','An jedem Zweig liegt dieselbe Spannung, der Strom teilt sich auf.','Erst den Parallelteil zusammenfassen, dann in Reihe addieren.','Erst die Reihenzweige addieren, dann parallel zusammenfassen.','Parallelblock R₂∥R₃ zusammenfassen, dann R₁ und R₄ in Reihe addieren.','Zwei Reihenzweige (R₁+R₂) und (R₃+R₄) bilden eine Parallelschaltung.'][m],
 leg:'Blaue Punkte zeigen den Stromfluss (schneller = mehr Strom). Je dunkler Gelb, desto größer der Leistungsanteil.',
 p:[['U','U',1,48,.5,'V',12],['R1','R₁',1,1000,1,'Ω',100],['R2','R₂',1,1000,1,'Ω',200],['R3','R₃',1,1000,1,'Ω',300]].concat(m>=4?[['R4','R₄',1,1000,1,'Ω',400]]:[]),
 f(s){
  const R=m>=4?[s.R1,s.R2,s.R3,s.R4]:[s.R1,s.R2,s.R3],[a,b,c,e4]=R,U=s.U,F=x=>fmt(x,'Ω');let Rg,I,i,u,st;
  if(m==0){Rg=a+b+c;I=U/Rg;i=[I,I,I];u=R.map(r=>I*r);st=[['R_ges = R₁ + R₂ + R₃',F(Rg)]]}
  else if(m==1){Rg=1/(1/a+1/b+1/c);i=R.map(r=>U/r);I=i[0]+i[1]+i[2];u=[U,U,U];st=[['1/R_ges = 1/R₁ + 1/R₂ + 1/R₃',F(Rg)]]}
  else if(m==2){const Rp=pr(b,c);Rg=a+Rp;I=U/Rg;const Up=I*Rp;i=[I,Up/b,Up/c];u=[I*a,Up,Up];st=[['R₂₃ = R₂·R₃ / (R₂+R₃)',F(Rp)],['R_ges = R₁ + R₂₃',F(Rg)]]}
  else if(m==3){const Ra=a+b;Rg=pr(Ra,c);const i12=U/Ra,i3=U/c;I=i12+i3;i=[i12,i12,i3];u=[i12*a,i12*b,U];st=[['R₁₂ = R₁ + R₂',F(Ra)],['R_ges = R₁₂·R₃ / (R₁₂+R₃)',F(Rg)]]}else if(m==4){const Rp=pr(b,c);Rg=a+Rp+e4;I=U/Rg;const Up=I*Rp;i=[I,Up/b,Up/c,I];u=[I*a,Up,Up,I*e4];st=[['R₂₃ = R₂·R₃ / (R₂+R₃)',F(Rp)],['R_ges = R₁ + R₂₃ + R₄',F(Rg)]]}else{const Ra=a+b,Rb=c+e4;Rg=pr(Ra,Rb);const iA=U/Ra,iB=U/Rb;I=iA+iB;i=[iA,iA,iB,iB];u=[iA*a,iA*b,iB*c,iB*e4];st=[['R₁₂ = R₁ + R₂, R₃₄ = R₃ + R₄',F(Ra)+' und '+F(Rb)],['R_ges = R₁₂·R₃₄ / (R₁₂+R₃₄)',F(Rg)]]}
  st.push(['I = U / R_ges',`${fmt(U,'V')} / ${F(Rg)} = ${fmt(I,'A')}`],['U_n = I_n · R_n, P = U · I',`P_ges = ${fmt(U*I,'W')}`]);
  const p=u.map((x,k)=>x*i[k]),P=U*I;
  const g=[
   {r:[[200,80,'h'],[330,80,'h'],[460,80,'h']],d:[],s:[['M70 150V80H590V260H70V190',I]]},
   {r:[[250,170,'v'],[370,170,'v'],[490,170,'v']],d:[[250,80],[370,80],[250,260],[370,260]],s:[['M70 150V80H250',I],['M250 80H370',i[1]+i[2]],['M370 80H490',i[2]],['M250 80V260',i[0]],['M370 80V260',i[1]],['M490 80V260',i[2]],['M490 260H370',i[2]],['M370 260H250',i[1]+i[2]],['M250 260H70V190',I]]},
   {r:[[220,80,'h'],[380,170,'v'],[500,170,'v']],d:[[380,80],[380,260]],s:[['M70 150V80H380',I],['M380 80H500',i[2]],['M380 80V260',i[1]],['M500 80V260',i[2]],['M500 260H380',i[2]],['M380 260H70V190',I]]},
   {r:[[300,125,'v'],[300,215,'v'],[470,170,'v']],d:[[300,80],[300,260]],s:[['M70 150V80H300',I],['M300 80H470',i[2]],['M300 80V260',i[0]],['M470 80V260',i[2]],['M470 260H300',i[2]],['M300 260H70V190',I]]},
   {r:[[170,80,'h'],[300,170,'v'],[420,170,'v'],[180,260,'h']],d:[[300,80],[300,260]],s:[['M70 150V80H300',I],['M300 80H420',i[2]],['M300 80V260',i[1]],['M420 80V260',i[2]],['M420 260H300',i[2]],['M300 260H70V190',I]]},
   {r:[[300,125,'v'],[300,215,'v'],[470,125,'v'],[470,215,'v']],d:[[300,80],[300,260]],s:[['M70 150V80H300',I],['M300 80H470',i[2]],['M300 80V260',i[0]],['M470 80V260',i[2]],['M470 260H300',i[2]],['M300 260H70V190',I]]}][m];
  let h=g.s.map(x=>`<path class="w" d="${x[0]}"/>`).join('')+g.s.map(x=>`<path class="fl" d="${x[0]}" style="animation-duration:${(11/(12+28*Math.log10(1+x[1]*1000))).toFixed(3)}s"/>`).join('')+g.d.map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="5" fill="var(--ink)"/>`).join('');
  h+=`<line x1="52" x2="88" y1="150" y2="150" stroke="var(--ink)" stroke-width="3"/><line x1="60" x2="80" y1="190" y2="190" stroke="var(--ink)" stroke-width="6"/>${T(96,146,'+','t2')}${T(96,186,fmt(U,'V'))}`;
  g.r.forEach(([x,y,o],k)=>{const w=o=='h'?70:26,hh=o=='h'?26:52,q=`x="${x-w/2}" y="${y-hh/2}" width="${w}" height="${hh}" rx="4"`;
   h+=`<rect class="rb" ${q}/><rect class="ra" ${q} opacity="${(.12+.78*p[k]/P).toFixed(2)}"/><rect ${q} fill="none" stroke="var(--ink)" stroke-width="2"/>`;
   const l1=`R${sub[k]} ${fmt(R[k],'Ω')}`,l2=`${fmt(u[k],'V')} · ${fmt(i[k],'A')}`;
   h+=o=='h'?(y>200?T(x,y-48,l1,'t1','middle')+T(x,y-30,l2,'t2','middle'):T(x,y-26,l1,'t1','middle')+T(x,y+40,l2,'t2','middle')):T(x+22,y-2,l1)+T(x+22,y+16,l2,'t2')});
  return{vb:'0 0 640 300',svg:h,res:[[F(Rg),'R_ges'],[fmt(I,'A'),'I_ges'],[fmt(P,'W'),'P_ges']],th:['R','Wert','U','I','P'],rows:R.map((r,k)=>[`R${sub[k]}`,F(r),fmt(u[k],'V'),fmt(i[k],'A'),fmt(p[k],'W')]),st}}});
[0,1,2,3,4,5].forEach(m=>M.push(circ(m)));
/* Hydraulik */
M.push({g:'Mechanik',name:'Hydraulik',desc:'Pascal: Der Druck ist in der Flüssigkeit überall gleich. Kleine Kraft auf kleiner Fläche ergibt große Kraft auf großer Fläche, dafür ist der Weg kürzer.',leg:'Kolbenwege sind vergrößert dargestellt, nicht maßstäblich.',
 p:[['F1','F₁',1,2000,1,'N',200],['d1','d₁',1,10,.1,'cm',2],['d2','d₂',1,40,.5,'cm',10],['s1','s₁',0,10,.1,'cm',5],['eta','η',50,100,1,'%',95]],
 f(s){
  const A1=PI*(s.d1/100)**2/4,A2=PI*(s.d2/100)**2/4,p=s.F1/A1,F2=s.eta/100*p*A2,s2=s.s1*A1/A2,W1=s.F1*s.s1/100,W2=F2*s2/100,A=x=>nf(x*1e4)+' cm²';
  const w1=14+s.d1*4.6,w2=14+s.d2*4.6,c1=170,c2=450,a=c1-w1/2,b=c1+w1/2,d=c2-w2/2,e=c2+w2/2,y1=110+Math.min(s.s1*8,64),y2=180-Math.min(s2*8,70),q=Math.min(w2-14,26+10*Math.log10(1+F2/10));
  const h=`<rect class="fluid" x="${a}" y="${y1+14}" width="${w1}" height="${251-y1}"/><rect class="fluid" x="${d}" y="${y2+14}" width="${w2}" height="${251-y2}"/><rect class="fluid" x="${b}" y="235" width="${d-b}" height="30"/><path class="wall" d="M${a} 90V265H${e}V90M${b} 90V235H${d}V90"/><rect class="pst" x="${a+3}" y="${y1}" width="${w1-6}" height="14"/><line x1="${c1}" x2="${c1}" y1="${y1}" y2="${y1-50}" stroke="var(--ink)" stroke-width="6"/><rect x="${c1-24}" y="${y1-56}" width="48" height="8" fill="var(--ink)"/>${AR(c1,y1-92,0,32,'var(--flow)')}${T(c1+16,y1-72,'F₁ = '+fmt(s.F1,'N'))}<rect class="pst" x="${d+3}" y="${y2}" width="${w2-6}" height="14"/><rect class="box" x="${c2-q/2}" y="${y2-q}" width="${q}" height="${q}" rx="3"/>${T(c2,y2-q-10,`F₂ = ${fmt(F2,'N')} (≈ ${nf(F2/G)} kg)`,'t1','middle')}${T(275,224,'p = '+fmt(p,'Pa'),'t1','middle')}${T(c1,286,'d₁ = '+nf(s.d1)+' cm','t2','middle')}${T(c2,286,'d₂ = '+nf(s.d2)+' cm','t2','middle')}`;
  return{vb:'0 0 640 300',svg:h,res:[[fmt(p,'Pa'),'Druck p'],[fmt(F2,'N'),'Kraft F₂'],['× '+nf(F2/s.F1),'Übersetzung']],th:['Kolben','A','F','s','W'],rows:[['1',A(A1),fmt(s.F1,'N'),nf(s.s1)+' cm',fmt(W1,'J')],['2',A(A2),fmt(F2,'N'),nf(s2)+' cm',fmt(W2,'J')]],
  st:[['A = π · d² / 4',`A₁ = ${A(A1)}, A₂ = ${A(A2)}`],['p = F₁ / A₁',`${fmt(p,'Pa')} (${nf(p/1e5)} bar)`],['F₂ = p · A₂ · η',fmt(F2,'N')],['s₂ = s₁ · A₁ / A₂',nf(s2)+' cm'],['W = F · s','Mehr Kraft heißt weniger Weg, die Arbeit bleibt (bis auf Verluste) gleich.']]}}});
/* Hebel */
M.push({g:'Mechanik',name:'Hebel',desc:'Hebelgesetz: Im Gleichgewicht ist das linksdrehende Drehmoment so groß wie das rechtsdrehende (Kraft mal Hebelarm).',leg:'Die Seite mit dem größeren Drehmoment M = F · l sinkt.',
 p:[['F1','F₁',1,1000,1,'N',100],['l1','l₁',.1,3,.05,'m',1.5],['F2','F₂',1,1000,1,'N',150],['l2','l₂',.1,3,.05,'m',1]],
 btn:[['F₂ ausgleichen',s=>s.F2=Math.round(Math.min(1000,Math.max(1,s.F1*s.l1/s.l2))*10)/10],['l₂ ausgleichen',s=>s.l2=Math.round(Math.min(3,Math.max(.1,s.F1*s.l1/s.F2))*100)/100]],
 f(s){
  const M1=s.F1*s.l1,M2=s.F2*s.l2,bal=Math.abs(M1-M2)/Math.max(M1,M2)<.005,dg=bal?0:20*Math.tanh(3*(M1-M2)/Math.max(M1,M2)),r=-rad(dg),px=320,py=150,sc=80,co=Math.cos(r),si=Math.sin(r);
  let h=`<polygon points="${px},${py} ${px-34},215 ${px+34},215" fill="var(--mute)" stroke="var(--ink)" stroke-width="2"/><line x1="${px-60}" x2="${px+60}" y1="215" y2="215" stroke="var(--ink)" stroke-width="4"/><g transform="rotate(${-dg} ${px} ${py})"><line x1="${px-s.l1*sc-14}" x2="${px+s.l2*sc+14}" y1="${py}" y2="${py}" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>${T(px-s.l1*sc/2,py-14,'l₁ = '+nf(s.l1)+' m','t2','middle')}${T(px+s.l2*sc/2,py-14,'l₂ = '+nf(s.l2)+' m','t2','middle')}</g><circle cx="${px}" cy="${py}" r="7" fill="var(--amber)" stroke="var(--ink)" stroke-width="2"/>`;
  [[[px-s.l1*sc*co,py-s.l1*sc*si],s.F1,'F₁'],[[px+s.l2*sc*co,py+s.l2*sc*si],s.F2,'F₂']].forEach(([p,F,n])=>{const q=22+14*Math.cbrt(F/100);
   h+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ink)"/><line x1="${p[0]}" x2="${p[0]}" y1="${p[1]}" y2="${p[1]+18}" stroke="var(--ink)" stroke-width="2"/><rect class="box" x="${p[0]-q/2}" y="${p[1]+18}" width="${q}" height="${q}" rx="3"/>${T(p[0],p[1]+23+q/2,n,'t1','middle')}${T(p[0],p[1]+34+q,fmt(F,'N'),'t2','middle')}`});
  h+=T(320,30,bal?'Gleichgewicht':M1>M2?'Links sinkt (M₁ > M₂)':'Rechts sinkt (M₂ > M₁)','t1','middle')+T(20,64,'M₁ = '+fmt(M1,'N·m'),'t2')+T(620,64,'M₂ = '+fmt(M2,'N·m'),'t2','end');

'Auftrieb und Dichte':r=>{const V=rg(r,1,20),x=9.81*V;return[`Ein Körper mit ${V} dm³ Volumen ist ganz in Wasser getaucht. Wie groß ist der Auftrieb?`,x,'N',['F_A = ρ · g · V',`= 1000 · 9,81 · ${V/1000} m³ = ${nf(x)} N`]]},
'Gleichförmige Bewegung':r=>{const v=rg(r,5,30),s=rg(r,100,900,50),t=s/v;return[`Ein Fahrzeug fährt mit ${v} m/s. Wie lange braucht es für ${s} m?`,t,'s',['t = s / v',`= ${s} / ${v} = ${nf(t)} s`]]},
'Beschleunigung & Bremsen':r=>{const v=rg(r,30,120,10),a=rg(r,3,9),s=(v/3.6)**2/(2*a);return[`Ein Auto fährt ${v} km/h und bremst mit a = ${a} m/s². Wie lang ist der Bremsweg?`,s,'m',['v in m/s: v / 3,6','s = v² / (2 · a)',`= (${nf(v/3.6)})² / ${2*a} = ${nf(s)} m`]]},
'Kraftgesetz F = m · a':r=>{const F=rg(r,50,500,50),m=rg(r,5,50,5);return[`Auf eine Masse von ${m} kg wirkt die Nettokraft ${F} N. Wie groß ist die Beschleunigung?`,F/m,'m/s²',['a = F / m',`= ${F} / ${m} = ${nf(F/m)} m/s²`]]},
'Arbeit & Leistung':r=>{const F=rg(r,50,500,50),s=rg(r,2,20),t=rg(r,2,20),P=F*s/t;return[`Eine Kraft von ${F} N verschiebt einen Körper um ${s} m in ${t} s (Kraft in Wegrichtung). Wie groß ist die Leistung?`,P,'W',['W = F · s, P = W / t',`P = ${F*s} J / ${t} s = ${nf(P)} W`]]},
'Energieformen & Erhaltung':r=>{const h=rg(r,2,40,2),v=Math.sqrt(2*9.81*h);return[`Ein Körper fällt ohne Reibung aus ${h} m Höhe. Mit welcher Geschwindigkeit kommt er unten an?`,v,'m/s',['m · g · h = ½ · m · v²',`v = √(2 · 9,81 · ${h}) = ${nf(v)} m/s`]]},
'Wirkungsgrad':r=>{const W=rg(r,100,1000,100),e=rg(r,20,95,5),x=W*e/100;return[`Einer Maschine werden ${W} J zugeführt, der Wirkungsgrad beträgt ${e} %. Wie viel Nutzenergie entsteht?`,x,'J',['η = W_nutz / W_zu',`W_nutz = ${W} · ${e/100} = ${nf(x)} J`]]},
'Wärmekapazität':r=>{const m=rg(r,.5,5,.5),d=rg(r,10,80,10),Q=m*4.182*d;return[`Wie viel Wärme braucht man, um ${m} kg Wasser um ${d} K zu erwärmen? (c = 4,182 kJ/(kg·K))`,Q,'kJ',['Q = m · c · ΔT',`= ${m} · 4,182 · ${d} = ${nf(Q)} kJ`]]},
'Mischungstemperatur':r=>{const m1=rg(r,1,5),m2=rg(r,1,5),a=rg(r,60,95,5),b=rg(r,5,25,5),T=(m1*a+m2*b)/(m1+m2);return[`${m1} kg Wasser mit ${a} °C werden mit ${m2} kg Wasser mit ${b} °C gemischt. Welche Mischtemperatur ergibt sich?`,T,'°C',['T_m = (m₁T₁ + m₂T₂) / (m₁ + m₂)',`= (${m1}·${a} + ${m2}·${b}) / ${m1+m2} = ${nf(T)} °C`]]},
'Wärmeausdehnung':r=>{const L=rg(r,5,50,5),d=rg(r,20,80,10),x=12e-6*L*d*1000;return[`Eine Stahlschiene ist ${L} m lang (α = 12·10⁻⁶ /K) und wird um ${d} K wärmer. Um wie viel dehnt sie sich aus?`,x,'mm',['ΔL = α · L₀ · ΔT',`= 12·10⁻⁶ · ${L} · ${d} m = ${nf(x)} mm`]]},
'Elektrische Arbeit & Leistung':r=>{const P=rg(r,500,3000,100),t=rg(r,1,10),k=P*t/1000*.35;return[`Ein Gerät mit ${P} W läuft ${t} h. Was kostet das bei 35 ct pro kWh?`,k,'€',['W = P · t',`= ${P/1000} kW · ${t} h = ${nf(P*t/1000)} kWh`,`Kosten = ${nf(P*t/1000)} · 0,35 € = ${nf(k)} €`]]},
'Schiefe Ebene':r=>{const m=rg(r,20,200,10),h=rg(r,.5,1.5,.1),l=rg(r,2,5,.5),F=m*9.81*h/l;return[`Eine Last von ${m} kg wird über eine reibungsfreie Rampe (Länge ${l} m, Höhe ${h} m) nach oben geschoben. Welche Kraft ist nötig?`,F,'N',['F = G · h / l',`= ${nf(m*9.81)} N · ${h} / ${l} = ${nf(F)} N`]]},
'Rolle & Flaschenzug':r=>{const m=rg(r,20,200,10),n=pk(r,[2,3,4,5,6]),F=m*9.81/n;return[`Ein Flaschenzug mit ${n} tragenden Seilstücken hebt ${m} kg (ohne Reibung). Welche Zugkraft braucht man?`,F,'N',['F = G / n',`= ${nf(m*9.81)} N / ${n} = ${nf(F)} N`]]},
'Gleit-, Haft- & Rollreibung':r=>{const m=rg(r,10,100,10),u=rg(r,.1,.6,.05),F=u*m*9.81;return[`Ein Körper (${m} kg) gleitet über eine Fläche mit μ = ${u}. Wie groß ist die Gleitreibungskraft?`,F,'N',['F_R = μ · F_N, F_N = m · g',`= ${u} · ${nf(m*9.81)} N = ${nf(F)} N`]]},
'Kreisbewegung':r=>{const R=rg(r,.5,3,.5),n=rg(r,30,300,30),v=2*PI*n/60*R;return[`Ein Punkt läuft auf einem Kreis mit r = ${R} m und ${n} Umdrehungen pro Minute. Wie groß ist die Bahngeschwindigkeit?`,v,'m/s',['ω = 2π · n / 60','v = ω · r',`= ${nf(2*PI*n/60)} · ${R} = ${nf(v)} m/s`]]},
'Sinus & Kosinus':r=>{const c=rg(r,5,20),a=pk(r,[30,40,50,60]),x=c*Math.sin(a*PI/180);return[`In einem rechtwinkligen Dreieck ist die Hypotenuse ${c} lang, der Winkel α = ${a}°. Wie lang ist die Gegenkathete?`,x,'',['sin α = Gegenkathete / Hypotenuse',`a = ${c} · sin ${a}° = ${nf(x)}`]]},
'Säuren & Basen':r=>{const a=pk(r,[1,2,5]),k=rg(r,1,5),pH=-Math.log10(a*10**-k);return[`Eine starke Säure hat die Konzentration c(H₃O⁺) = ${a} · 10${sup(-k)} mol/L. Wie groß ist der pH-Wert?`,pH,'',['pH = −log₁₀ c(H₃O⁺)',`= −log₁₀(${a} · 10${sup(-k)}) = ${nf(pH)}`],{abs:.1}]},
'Neutralisation & Titration':r=>{const ca=pk(r,[.1,.2,.5]),Va=rg(r,10,50,5),cb=pk(r,[.1,.2,.25]),x=ca*Va/cb;return[`${Va} mL Salzsäure (${ca} mol/L) werden mit Natronlauge (${cb} mol/L) titriert. Bei welchem Volumen Lauge liegt der Äquivalenzpunkt?`,x,'mL',['n(Säure) = n(Base)','V_L = c_S · V_S / c_L',`= ${ca} · ${Va} / ${cb} = ${nf(x)} mL`]]},
'Reaktionsgleichungen & Mol':r=>{const m=rg(r,2,20,2),x=m/2.016*18.015;return[`Bei 2 H₂ + O₂ → 2 H₂O reagieren ${m} g Wasserstoff vollständig. Wie viel Wasser entsteht? (M(H₂) = 2,016 g/mol, M(H₂O) = 18,015 g/mol)`,x,'g',['n(H₂) = m / M',`n = ${m} / 2,016 = ${nf(m/2.016)} mol = n(H₂O)`,`m(H₂O) = n · M = ${nf(x)} g`]]},
'Wasserhärte':r=>{const ca=rg(r,40,160,10),mg=rg(r,5,40,5),x=(ca/40.08+mg/24.31)*5.6;return[`Ein Wasser enthält ${ca} mg/L Calcium und ${mg} mg/L Magnesium. Wie groß ist die Gesamthärte in °dH? (1 mmol/L ≙ 5,6 °dH)`,x,'°dH',['c = ρ(Ca) / 40,08 + ρ(Mg) / 24,31',`= ${nf(ca/40.08+mg/24.31)} mmol/L`,`× 5,6 = ${nf(x)} °dH`]]},
'Oxidationszahlen':r=>{const L=[['Mn','KMnO₄',7],['S','H₂SO₄',6],['Cr','K₂Cr₂O₇',6],['N','NH₄⁺',-3],['O','H₂O₂',-1],['C','CO₂',4],['C','CH₄',-4],['Fe','Fe₂O₃',3],['S','SO₄²⁻',6]],q=pk(r,L);return[`Welche Oxidationszahl hat ${q[0]} in ${q[1]}?`,q[2],'',['Summe der Oxidationszahlen = Ladung','O meist −2, H meist +1, K +1',`Ergebnis: ${q[2]}`],{abs:.01}]},
'Galvanische Zelle & Spannungsreihe':r=>{const i=rg(r,0,9),j=(i+rg(r,1,9))%10,A=ME[i],B=ME[j],U=Math.abs(A[1]-B[1]);return[`Eine galvanische Zelle besteht aus ${A[0]} (E° = ${A[1]} V) und ${B[0]} (E° = ${B[1]} V). Wie groß ist die Zellspannung?`,U,'V',['Kathode ist das Metall mit dem größeren E° (edler), Anode das mit dem kleineren E°.','U = E°(Kathode) − E°(Anode)',`Kathode: ${(A[1]>B[1]?A:B)[0]}, Anode: ${(A[1]>B[1]?B:A)[0]}`,`U = ${String(Math.max(A[1],B[1])).replace('-','−')} V − (${String(Math.min(A[1],B[1])).replace('-','−')} V) = ${nf(U)} V`]]},
'Elektrolyse':r=>{const I=rg(r,1,5),t=rg(r,10,60,10),m=63.55*I*t*60/(2*96485);return[`Aus CuSO₄-Lösung wird mit ${I} A über ${t} min Kupfer abgeschieden. Wie viel Kupfer scheidet sich ab? (M = 63,55 g/mol, F = 96485 C/mol)`,m,'g',['Q = I · t',`n(e⁻) = Q / F = ${nf(I*t*60/96485)} mol`,'n(Cu) = n(e⁻) / 2, m = n · M',`m = ${nf(m)} g`]]},
'Periodensystem':r=>{const L=[[3,1],[11,1],[12,2],[13,3],[14,4],[15,5],[16,6],[17,7],[19,1],[20,2]],q=pk(r,L);return[`Wie viele Valenzelektronen hat ${NA[q[0]-1]} (Z = ${q[0]})?`,q[1],'',['Valenzelektronen = Elektronen der äußersten Schale',`Ergebnis: ${q[1]}`],{abs:.01}]},
'Mittelwert, Median & Modalwert':r=>{const v=[1,2,3,4,5].map(()=>rg(r,10,40)),m=v.reduce((a,b)=>a+b,0)/5;return[`Messwerte: ${v.join('; ')}. Wie groß ist der Mittelwert?`,m,'',['x̄ = Σx / n',`= ${v.reduce((a,b)=>a+b,0)} / 5 = ${nf(m)}`]]},
'Spannweite, Varianz & Standardabweichung':r=>{const v=[1,2,3,4,5].map(()=>rg(r,10,40)),d=SS(v),s=Math.sqrt(d.s2);return[`Messwerte: ${v.join('; ')}. Wie groß ist die Standardabweichung s (Stichprobe, n − 1)?`,s,'',['x̄ = '+nf(d.m),'s² = Σ(x − x̄)² / (n − 1) = '+nf(d.s2),`s = √s² = ${nf(s)}`],{rel:.03}]},
'Normalverteilung':r=>{const mu=rg(r,40,60,5),sd=rg(r,2,10),k=pk(r,[-2,-1,.5,1,1.5,2]),x=mu+k*sd;return[`Eine Größe ist normalverteilt mit μ = ${mu} und σ = ${sd}. Wie groß ist der z-Wert von x = ${nf(x)}?`,k,'',['z = (x − μ) / σ',`= (${nf(x)} − ${mu}) / ${sd} = ${k}`],{abs:.02}]},
'σ-Bereiche':r=>{const k=pk(r,[1,2,3]),a=[68.3,95.4,99.73][k-1];return[`Wie viel Prozent der Werte einer Normalverteilung liegen im Bereich μ ± ${k}σ?`,a,'%',['Merkregel: 68,3 % / 95,4 % / 99,73 %',`Ergebnis: ${a} %`],{rel:.01}]},
'Prozess- & Maschinenfähigkeit':r=>{const mu=pk(r,[49.8,50,50.2,50.4]),sd=pk(r,[.3,.4,.5,.6]),x=Math.min(52-mu,mu-48)/(3*sd);return[`Toleranz: USG = 48, OSG = 52. Der Prozess hat x̄ = ${mu} und s = ${sd}. Wie groß ist Cpk?`,x,'',['Cpk = min(OSG − x̄, x̄ − USG) / (3 · s)',`= min(${nf(52-mu)}; ${nf(mu-48)}) / ${nf(3*sd)} = ${nf(x)}`]]},
'Qualitätsregelkarte (x̄-Karte)':r=>{const mu=rg(r,40,60,5),sd=rg(r,1,4),n=pk(r,[4,9,16,25]),x=mu+3*sd/Math.sqrt(n);return[`Ein Prozess hat μ = ${mu} und σ = ${sd}. Stichprobenumfang n = ${n}. Wie hoch liegt die obere Eingriffsgrenze der x̄-Karte?`,x,'',['OEG = μ + 3 · σ / √n',`= ${mu} + 3 · ${sd} / ${nf(Math.sqrt(n))} = ${nf(x)}`]]},
'Histogramm':r=>{const n=pk(r,[20,50,100,200]),k=Math.round(1+3.32*Math.log10(n));return[`Wie viele Klassen schlägt die Sturges-Regel für n = ${n} Messwerte vor? (k ≈ 1 + 3,32 · lg n, gerundet)`,k,'',['k = 1 + 3,32 · lg n',`= 1 + 3,32 · ${nf(Math.log10(n))} = ${nf(1+3.32*Math.log10(n))} ≈ ${k}`],{abs:.01}]},
'Einheiten umrechnen':r=>{const c=pk(r,['Länge','Masse','Volumen','Fläche','Zeit','Druck','Energie','Leistung','Geschwindigkeit']),u=UN[c][0],i=rg(r,0,u.length-1),j=(i+rg(r,1,u.length-1))%u.length,A=u[i],B=u[j],v=pk(r,[.5,2,25,340,1.5,12]),x=v*A[1]/B[1];return[`Rechne ${nf(v)} ${A[0]} in ${B[0]} um.`,x,B[0],[`1 ${A[0]} = ${fnum(A[1]/B[1])} ${B[0]}`,`${nf(v)} · ${fnum(A[1]/B[1])} = ${fnum(x)} ${B[0]}`],{rel:.005}]}};

const shuf=(q,o,why,r)=>{const a=o.map((t,i)=>[t,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return{q,opts:a.map(x=>x[0]),ok:a.findIndex(x=>x[1]===0),why}};
const numMC=(g,r)=>{const a=g[1],u=g[2],f=x=>nf(x,3)+(u?' '+u:''),O=[f(a)],int=Number.isInteger(a)&&Math.abs(a)<=12,c=int?[a+1,a-1,a+2,-a,a*2]:[a*2,a/2,a*10,a/10,a*1.5,a*.75,a+Math.abs(a)*.25];for(const x of c){if(O.length>=4)break;if(!O.includes(f(x)))O.push(f(x))}return shuf(g[0],O,g[3].join('; ')+` = ${f(a)}`,r)};

'Wärmekapazität':r=>{const m=rg(r,1,5),d=rg(r,20,80,10),P=pk(r,[1,2,3]),Q=m*4.182*d;return{intro:`${m} kg Wasser werden um ${d} K erwärmt (c = 4,182 kJ/(kg·K)). Der Wasserkocher hat ${P} kW.`,steps:[['Wie viel Wärme wird benötigt?',Q,'kJ',[`Q = m · c · ΔT = ${m} · 4,182 · ${d} = ${nf(Q)} kJ`]],['Wie lange dauert das Erwärmen?',Q/P,'s',[`t = Q / P = ${nf(Q)} kJ / ${P} kW = ${nf(Q/P)} s`]],['Wie viele Minuten sind das?',Q/P/60,'min',[`${nf(Q/P)} s / 60 = ${nf(Q/P/60)} min`]]]}},
'Neutralisation & Titration':r=>{const ca=pk(r,[.1,.2,.5]),Va=rg(r,10,50,5),cb=pk(r,[.1,.2,.25]),n=ca*Va;return{intro:`${Va} mL Salzsäure (${ca} mol/L) werden mit Natronlauge (${cb} mol/L) neutralisiert.`,steps:[['Welche Stoffmenge HCl liegt vor?',n,'mmol',[`n = c · V = ${ca} mol/L · ${Va} mL = ${nf(n)} mmol`]],['Welches Volumen Lauge braucht man bis zum Äquivalenzpunkt?',n/cb,'mL',[`n(NaOH) = n(HCl) ⇒ V = n / c = ${nf(n)} / ${cb} = ${nf(n/cb)} mL`]],['Wie viel Salz NaCl entsteht?',n,'mmol',['HCl + NaOH → NaCl + H₂O, Verhältnis 1 : 1 : 1',`n(NaCl) = ${nf(n)} mmol`]]]}},
'Reaktionsgleichungen & Mol':r=>{const m=rg(r,2,20,2),n=m/2.016;return{intro:`Bei 2 H₂ + O₂ → 2 H₂O reagieren ${m} g Wasserstoff vollständig (M(H₂) = 2,016 g/mol, M(H₂O) = 18,015 g/mol).`,steps:[['Welche Stoffmenge H₂ ist das?',n,'mol',[`n = m / M = ${m} / 2,016 = ${nf(n)} mol`]],['Welche Stoffmenge H₂O entsteht?',n,'mol',['Aus 2 H₂ entstehen 2 H₂O, Verhältnis 1 : 1',`n(H₂O) = ${nf(n)} mol`]],['Welche Masse Wasser entsteht?',n*18.015,'g',[`m = n · M = ${nf(n)} · 18,015 = ${nf(n*18.015)} g`]]]}},
'Prozess- & Maschinenfähigkeit':r=>{const mu=pk(r,[49.6,50.2,50.4]),sd=pk(r,[.3,.4,.5]),cp=4/(6*sd),cpk=Math.min(52-mu,mu-48)/(3*sd);return{intro:`Toleranz USG = 48, OSG = 52. Prozess mit x̄ = ${mu} und s = ${sd}.`,steps:[['Wie groß ist Cp?',cp,'',[`Cp = (OSG − USG) / (6 · s) = 4 / ${nf(6*sd)} = ${nf(cp)}`]],['Wie groß ist Cpk?',cpk,'',[`Cpk = min(OSG − x̄, x̄ − USG) / (3 · s) = min(${nf(52-mu)}; ${nf(mu-48)}) / ${nf(3*sd)} = ${nf(cpk)}`]],['Um wie viel ist Cpk kleiner als Cp?',cp-cpk,'',[`Cp − Cpk = ${nf(cp)} − ${nf(cpk)} = ${nf(cp-cpk)}`,'Die Differenz zeigt, wie weit der Prozess aus der Mitte liegt.'],{abs:.03}]]}},
'Elektrische Arbeit & Leistung':r=>{const P=rg(r,500,3000,100),t=rg(r,1,8),I=P/230,W=P*t/1000;return{intro:`Ein Gerät mit ${P} W läuft an 230 V für ${t} h. Strompreis 35 ct/kWh.`,steps:[['Wie groß ist die Stromstärke?',I,'A',[`I = P / U = ${P} / 230 = ${nf(I)} A`]],['Wie viel Energie wird verbraucht?',W,'kWh',[`W = P · t = ${P/1000} kW · ${t} h = ${nf(W)} kWh`]],['Was kostet das?',W*.35,'€',[`Kosten = ${nf(W)} · 0,35 € = ${nf(W*.35)} €`]]]}},
'Wasserhärte':r=>{const ca=rg(r,40,160,10),mg=rg(r,5,40,5),a=ca/40.08,b=mg/24.31;return{intro:`Ein Wasser enthält ${ca} mg/L Calcium und ${mg} mg/L Magnesium (M(Ca) = 40,08 g/mol, M(Mg) = 24,31 g/mol).`,steps:[['Wie groß ist c(Ca²⁺)?',a,'mmol/L',[`c = ${ca} / 40,08 = ${nf(a)} mmol/L`]],['Wie groß ist c(Mg²⁺)?',b,'mmol/L',[`c = ${mg} / 24,31 = ${nf(b)} mmol/L`]],['Wie groß ist die Gesamthärte in °dH? (1 mmol/L ≙ 5,6 °dH)',(a+b)*5.6,'°dH',[`(${nf(a)} + ${nf(b)}) · 5,6 = ${nf((a+b)*5.6)} °dH`]]]}}};

const EXW=[
['Schaltschrank auf Transportbrett: Kippen oder Rutschen',r=>{const b=rg(r,.3,.6,.05),h=rg(r,.8,1.4,.05),mu=rg(r,.25,.6,.05),m=rg(r,150,400,10),aR=Math.atan(mu)*180/PI,aK=Math.atan(b/h)*180/PI,Gw=m*9.81,FH=Gw*Math.sin(aR*PI/180);return{intro:`Ein Schaltschrank (m = ${m} kg) steht auf einem Transportbrett, das langsam an einer Seite angehoben wird. Sein Schwerpunkt liegt ${de(h)} m über dem Brett und ${de(b)} m (waagerecht gemessen) von der unteren Kippkante entfernt. Die Haftreibungszahl zwischen Schrank und Brett beträgt μ₀ = ${de(mu)}.`,steps:[STP('Bei welchem Neigungswinkel beginnt der Schrank zu rutschen?',aR,'°',[`Rutschen beginnt, wenn F_H = μ₀ · F_N`,`G · sin α = μ₀ · G · cos α ⇒ tan α = μ₀ = ${de(mu)}`,`α_Rutsch = ${nf(aR)}°`],'Hangabtriebskraft F_H = G · sin α, Normalkraft F_N = G · cos α. Das Gewicht G kürzt sich heraus.',{abs:.3}),STP('Bei welchem Winkel kippt der Schrank über die Kante?',aK,'°',[`Gekippt wird, wenn der Schwerpunkt senkrecht über der Kippkante steht`,`tan α = b / h = ${de(b)} / ${de(h)}`,`α_Kipp = ${nf(aK)}°`],'Zeichne ein rechtwinkliges Dreieck: Gegenkathete b (zur Kante), Ankathete h (Schwerpunkthöhe).',{abs:.3}),STP('Um wie viel Grad liegt der Kippwinkel über dem Rutschwinkel? (positiv: Der Schrank rutscht zuerst.)',aK-aR,'°',[`${nf(aK)}° − ${nf(aR)}° = ${nf(aK-aR)}°`,aK>aR?'Der Schrank rutscht zuerst.':'Der Schrank kippt zuerst.'],'Der kleinere der beiden Winkel wird beim Anheben zuerst erreicht.',{abs:.3}),STP('Wie groß ist die Hangabtriebskraft F_H kurz vor dem Rutschen?',FH,'N',[`G = m · g = ${nf(Gw)} N`,`F_H = G · sin α = ${nf(Gw)} · sin ${nf(aR)}° = ${nf(FH)} N`],'Zuerst die Gewichtskraft G = m · g, dann mit dem Rutschwinkel F_H = G · sin α.')]}}],
['Langloch stanzen: Scherfläche und Schneidkraft',r=>{const L=rg(r,30,60,5),d=rg(r,10,20,2),t=rg(r,1.5,4,.5),tau=rg(r,200,350,10),g=L-d,U=2*g+PI*d,S=U*t,F=S*tau/1000;return{intro:`In ein Stahlblech (Dicke t = ${de(t)} mm) wird ein Langloch gestanzt: zwei gerade Kanten und zwei Halbkreise. Gesamtlänge ${L} mm, Breite ${d} mm. Die Scherfestigkeit des Blechs beträgt τ_aB = ${tau} N/mm².`,steps:[STP('Wie lang ist eine gerade Kante des Langlochs?',g,'mm',[`Die beiden Halbkreise haben zusammen die Länge d, also bleibt für die geraden Teile L − d`,`${L} − ${d} = ${g} mm`],'Der Halbkreis am Ende nimmt in Längsrichtung den Radius d/2 ein, an beiden Enden zusammen d.'),STP('Wie groß ist der Umfang U der Schnittlinie?',U,'mm',[`U = 2 · (L − d) + π · d`,`= 2 · ${g} + π · ${d} = ${nf(U)} mm`],'Zwei gerade Kanten plus ein ganzer Kreis (zwei Halbkreise).'),STP('Wie groß ist die Scherfläche S?',S,'mm²',[`S = U · t = ${nf(U)} · ${de(t)} = ${nf(S)} mm²`],'Scherfläche = Schnittlänge mal Blechdicke.'),STP('Welche Schneidkraft F wird mindestens benötigt?',F,'kN',[`F = S · τ_aB = ${nf(S)} mm² · ${tau} N/mm² = ${nf(F*1000)} N`,`= ${nf(F)} kN`],'F = S · τ_aB. 1000 N = 1 kN.')]}}],
['Hochbehälter befüllen: Pumpe und Motor',r=>{const H=rg(r,12,40,2),Q=rg(r,4,12,1),eP=rg(r,60,80,5),eM=rg(r,85,95,5),t=rg(r,2,8,1),Ph=Q/1000*1000*9.81*H,Pw=Ph/(eP/100),Pe=Pw/(eM/100),W=Pe*t/1000;return{intro:`Eine Kreiselpumpe fördert ${Q} l/s Wasser in einen Hochbehälter, der ${H} m höher steht. Der Pumpenwirkungsgrad beträgt ${eP} %, der des Antriebsmotors ${eM} %. Reibungsverluste in der Leitung werden vernachlässigt.`,steps:[STP('Welche Hubleistung P_Hub braucht das Wasser (nutzbare Leistung)?',Ph,'W',[`${Q} l/s = ${Q} kg/s`,`P_Hub = m · g · h / t = ${Q} · 9,81 · ${H} = ${nf(Ph)} W`],'1 l Wasser hat 1 kg. Pro Sekunde werden Q Kilogramm um die Höhe H angehoben.'),STP('Welche Wellenleistung muss der Motor an die Pumpe abgeben?',Pw,'W',[`P_Pumpe = P_Hub / η_P = ${nf(Ph)} / ${eP/100} = ${nf(Pw)} W`],'Der Wirkungsgrad ist Nutzen durch Aufwand. Die Zufuhr ist also größer als der Nutzen.'),STP('Welche elektrische Leistung nimmt der Motor auf?',Pe,'W',[`P_el = P_Pumpe / η_M = ${nf(Pw)} / ${eM/100} = ${nf(Pe)} W`],'Ketten von Wirkungsgraden: η_ges = η_P · η_M.'),STP(`Wie viel Energie wird in ${t} h Betrieb verbraucht?`,W,'kWh',[`W = P_el · t = ${nf(Pe/1000)} kW · ${t} h = ${nf(W)} kWh`],'W = P · t. Leistung in kW, Zeit in h ergibt kWh.')]}}],
['Härteölbad aufheizen: Gasbedarf',r=>{const m=rg(r,200,600,50),a=rg(r,15,25),b=rg(r,60,90,5),e=rg(r,60,80,5),pr=rg(r,.08,.14,.01),c=1.9,Q=m*c*(b-a),Qk=Q/3600,Qz=Qk/(e/100),Vg=Qz/10,K=Qz*pr;return{intro:`Ein Härteölbad mit ${m} kg Öl (c = 1,9 kJ/(kg·K)) wird von ϑ₁ = ${a} °C auf ϑ₂ = ${b} °C erwärmt. Der Gasbrenner arbeitet mit einem Wirkungsgrad von ${e} %. Erdgas hat einen Heizwert von 10 kWh/m³ und kostet ${de(pr)} € je kWh.`,steps:[STP('Wie viel Wärme braucht das Öl?',Qk,'kWh',[`Q = m · c · Δϑ = ${m} · 1,9 · ${b-a} = ${nf(Q)} kJ`,`1 kWh = 3600 kJ ⇒ Q = ${nf(Qk)} kWh`],'Q = m · c · ΔT. Die Temperaturdifferenz in K ist gleich der in °C.'),STP('Wie viel Energie muss dem Brenner zugeführt werden?',Qz,'kWh',[`Q_zu = Q_nutz / η = ${nf(Qk)} / ${e/100} = ${nf(Qz)} kWh`],'η = Q_nutz / Q_zu.'),STP('Wie viel Erdgas wird verbraucht?',Vg,'m³',[`V = Q_zu / H = ${nf(Qz)} / 10 = ${nf(Vg)} m³`],'Je m³ stecken 10 kWh im Gas.'),STP('Was kostet das Aufheizen?',K,'€',[`Kosten = Q_zu · Preis = ${nf(Qz)} kWh · ${de(pr)} €/kWh = ${nf(K)} €`],'Kosten = Energie · Preis je kWh.')]}}],

['Hydrauliköltank befüllen: Füllzeit',r=>{const L=rg(r,.8,1.4,.1),B=rg(r,.5,.9,.1),h1=rg(r,10,30,5),h2=rg(r,50,80,5),Q=rg(r,12,40,2),A=L*B,dV=A*(h2-h1)/100*1000,t=dV/Q;return{intro:`Ein rechteckiger Hydrauliköltank hat die Innenmaße ${de(L)} m × ${de(B)} m. Er soll von einem Füllstand von ${h1} cm bis zum maximal zulässigen Füllstand von ${h2} cm befüllt werden. Die Pumpe fördert ${Q} l/min.`,steps:[STP('Wie groß ist die Grundfläche A des Tanks?',A,'m²',[`A = L · B = ${de(L)} · ${de(B)} = ${nf(A)} m²`],'Rechteck: Länge mal Breite.'),STP('Wie viel Öl muss eingefüllt werden?',dV,'l',[`Δh = ${h2} − ${h1} = ${h2-h1} cm = ${de((h2-h1)/100)} m`,`V = A · Δh = ${nf(A)} · ${de((h2-h1)/100)} = ${nf(dV/1000)} m³ = ${nf(dV)} l`],'1 m³ = 1000 l. Volumen = Grundfläche mal Füllhöhendifferenz.'),STP('Wie lange dauert das Befüllen?',t,'min',[`t = V / Q = ${nf(dV)} l / ${Q} l/min = ${nf(t)} min`],'Zeit = Volumen durch Volumenstrom.'),STP('Wie viele Stunden sind das?',t/60,'h',[`${nf(t)} min / 60 = ${nf(t/60)} h`],'60 min = 1 h.')]}}],
