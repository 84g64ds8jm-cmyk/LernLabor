function toggleFav(n){FAV=FAV.includes(n)?FAV.filter(x=>x!==n):[...FAV,n];store.set('ll_fav',FAV)}
function go(i){prac=false;cur=i;fi=FA.indexOf(M[i].F);clock=0;touch(i);nav();build()}
const IC={Physik:'⚙️',Chemie:'⚗️',Statistik:'📊',Umrechnen:'🔁'},SUBT={Physik:'Mechanik, Hydraulik, Wärme, Elektrotechnik',Chemie:'Atome, Bindungen, Reaktionen, Redox, Wasser',Statistik:'Kennwerte, Verteilungen, Qualität',Umrechnen:'Länge, Volumen, Masse, Druck, Energie, Temperatur'};
function chipRow(t,names){const ix=names.map(byName).filter(i=>i>=0);return ix.length?`<div class="hc qk"><h2>${t}</h2><p>${ix.map(i=>`<button type="button" class="chip" data-i="${i}">${M[i].name}</button>`).join('')}</p></div>`:''}
function homeView(){
 $('#home').innerHTML='<p class="sub">Wähle ein Fach und tippe auf ein Unterthema. Jeder Simulator lässt sich live einstellen und zeigt Grundgleichungen und Rechenweg. Im Übungsmodus gibt es Aufgaben zum Selbsttest.</p>'+chipRow('★ Favoriten',FAV)+chipRow('Zuletzt benutzt',REC.slice(0,6))+'<div class="hg">'+FA.map(f=>`<div class="hc" data-f="${f}"><h2><span class="ic">${IC[f]}</span>${f}<small>${M.filter(m=>m.F===f).length} Themen</small></h2><p class="hs">${SUBT[f]}</p>`+ORD[f].map(g=>{const ms=M.map((m,i)=>[m,i]).filter(([m])=>m.F===f&&m.g===g);return ms.length?`<p><b>${g}</b><br>`+ms.map(([m,i])=>`<button type="button" class="chip" data-i="${i}">${m.name}</button>`).join('')+'</p>':''}).join('')+'</div>').join('')+'</div>';
 $('#home').querySelectorAll('.chip').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function nav(){
 const hm=cur<0&&!prac;document.body.dataset.f=cur>=0?M[cur].F:'';
 $('#bgr').setAttribute('fill','url(#p-'+(cur>=0?({Physik:'phys',Chemie:'chem',Statistik:'stat',Umrechnen:'unit'}[M[cur].F]||'home'):'home')+')');
 $('#home').hidden=!hm;$('#app').hidden=cur<0;$('#practice').hidden=!prac;$('#desc').hidden=cur<0;$('#gs').hidden=$('#ms').hidden=cur<0;if(cur<0)$('#fx').hidden=true;
 if(hm)homeView();
 const last=FA.length+1;
 $('#fs').innerHTML=['Übersicht',...FA,'✎ Üben','🎓 Prüfungsaufgaben'].map((n,k)=>`<button type="button" data-k="${k}" aria-pressed="${k===0?hm:k===last?prac&&!PS.exam:k===last+1?prac&&!!PS.exam:(cur>=0&&k===fi+1)}">${n}</button>`).join('');
 $('#fs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k===0){cur=-1;prac=false;nav()}else if(k===last)openPractice('Alle');else if(k===last+1)openExam();else go(M.findIndex(m=>m.F===FA[k-1]))});
 if(cur<0)return;
 const f=M[cur].F;
 $('#gs').innerHTML=ORD[f].filter(g=>M.some(m=>m.F===f&&m.g===g)).map(g=>`<button type="button" data-g="${g}" aria-pressed="${M[cur].g===g}">${g}</button>`).join('');
 $('#gs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(M.findIndex(m=>m.F===f&&m.g===b.dataset.g)));
 $('#ms').innerHTML=M.map((m,i)=>m.F===f&&m.g===M[cur].g?`<button type="button" data-i="${i}" aria-pressed="${i===cur}">${m.name}</button>`:'').join('');
 $('#ms').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
/* Suche */
const nz=s=>String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
const HAY=M.map(m=>nz([m.name,m.g,m.F,m.desc,(FX[m.name]||[]).join(' ')].join(' ')));
function search(){const q=nz($('#q').value).trim().split(/\s+/).filter(Boolean),sr=$('#sr');if(!q.length){sr.hidden=true;return}
 const res=M.map((m,i)=>[i,q.every(w=>HAY[i].includes(w))?(nz(m.name).includes(q[0])?0:1):9]).filter(x=>x[1]<9).sort((a,b)=>a[1]-b[1]).slice(0,12);
 sr.innerHTML=res.length?res.map(([i])=>`<button type="button" class="chip" data-i="${i}">${M[i].name} <small>${M[i].F}</small></button>`).join(''):'<span class="sub">Nichts gefunden. Versuche ein anderes Stichwort oder eine Formel.</span>';sr.hidden=false;
 sr.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('#q').value='';sr.hidden=true;go(+b.dataset.i)})}
$('#q').oninput=search;$('#q').onkeydown=e=>{if(e.key==='Enter'){const b=$('#sr').querySelector('.chip');if(b&&b.click)b.click()}else if(e.key==='Escape'){$('#q').value='';search()}};
/* Übungsmodus */
const gfach=n=>n==='Einheiten umrechnen'?FU:(M.find(m=>m.name===n)||{}).F,unitMod=()=>M.findIndex(m=>m.F===FU);
const hasPr=m=>m.F===FU||!!GEN[m.name]||!!STEPS[m.name]||MCQ.some(x=>x[0]===m.name);
let KIND='all';
const KT=[['all','Alle Aufgabentypen'],['num','Rechnen'],['steps','Mehrschritt'],['mc','Ankreuzen'],['und','Verständnis']];
function buildSel(){if(PS.exam){const o=[['W:*','Schriftlich: zufällige Aufgabe'],...EXW.map((t,i)=>['W:'+i,t[0]]),['O:*','Mündlich: Fragen mit Musterantwort']];$('#pf').innerHTML=o.map(([v,t])=>`<option value="${v}"${v===PS.sel?' selected':''}>${t}</option>`).join('');$('#pk').innerHTML=['Alle','Chemie','Physik','Elektrotechnik','Statistik'].map(c=>`<option value="${c}"${c===PS.cat?' selected':''}>${c==='Alle'?'Alle Themen':c}</option>`).join('');$('#pk').hidden=!PS.sel.startsWith('O:');return}$('#pk').hidden=false;const o=[['Alle','Alle Fächer'],...FA.map(f=>['F:'+f,f])];if(PS.sel.startsWith('M:'))o.push([PS.sel,'Dieses Thema: '+PS.sel.slice(2)]);
 $('#pf').innerHTML=o.map(([v,t])=>`<option value="${v}"${v===PS.sel?' selected':''}>${t}</option>`).join('');
 $('#pk').innerHTML=KT.map(([v,t])=>`<option value="${v}"${v===KIND?' selected':''}>${t}</option>`).join('')}
function openPractice(sel,kind){prac=true;cur=-1;PS.exam=false;PS.sel=sel;KIND=kind||'all';$('#ph2').textContent='✎ Übungsmodus';buildSel();nav();newQ()}
function openExam(){prac=true;cur=-1;PS.exam=true;PS.sel='W:*';PS.cat='Alle';$('#ph2').textContent='🎓 Prüfungsaufgaben';buildSel();nav();newQ()}
function match(n){const s=PS.sel;if(s==='Alle')return true;if(s.startsWith('F:'))return gfach(n)===s.slice(2);const t=s.slice(2),mm=M.find(m=>m.name===t);return n===t||(n==='Einheiten umrechnen'&&!!mm&&mm.F===FU)}
function poolQ(){const p=[],add=(k,n)=>{if((KIND==='all'||KIND===k)&&match(n))p.push([k,n])};Object.keys(GEN).forEach(n=>{add('num',n);add('mc',n)});Object.keys(STEPS).forEach(n=>add('steps',n));[...new Set(MCQ.map(x=>x[0]))].forEach(n=>add('und',n));return p}
function newExamQ(){const s=PS.sel,r=mk(Math.floor(Math.random()*1e9)+1);let c;if(s.startsWith('O:')){const L=ORAL.filter(x=>PS.cat==='Alle'||x[0]===PS.cat),x=L[Math.floor(Math.random()*L.length)];c={k:'oral',n:x[0],q:x[1],a:x[2]}}else{const i=s==='W:*'?Math.floor(Math.random()*EXW.length):+s.slice(2),t=EXW[i][1](r);c={k:'steps',n:EXW[i][0],intro:t.intro,steps:t.steps,i:0,log:[],exam:true}}c.tried=false;PS.cur=c;renderQ()}
function newQ(){if(PS.exam)return newExamQ();const p=poolQ(),[k,n]=p.length?p[Math.floor(Math.random()*p.length)]:['num','Ohmsches Gesetz'],r=mk(Math.floor(Math.random()*1e9)+1);let c;
 if(k==='num')c={k,n,q:GEN[n](r)};
 else if(k==='steps'){const d=STEPS[n](r);c={k,n,intro:d.intro,steps:d.steps,i:0,log:[]}}
 else if(k==='mc')c={k,n,...numMC(GEN[n](r),r)};
 else{const L=MCQ.filter(x=>x[0]===n),x=L[Math.floor(r()*L.length)];c={k,n,...shuf(x[1],x[2],x[3],r)}}
 c.tried=false;PS.cur=c;renderQ()}
function item(){const c=PS.cur;if(c.k==='num')return{a:c.q[1],u:c.q[2],t:c.q[4]||{rel:.02},s:c.q[3]};const s=c.steps[c.i];return{a:s[1],u:s[2],t:s[4]||{rel:.02},s:s[3]}}
function score(ok){const sc=store.get('ll_score',{ok:0,n:0});sc.n++;if(ok)sc.ok++;store.set('ll_score',sc);$('#sc').textContent=`Richtig: ${sc.ok} von ${sc.n}`}
function fb(t,ok){$('#pfb').textContent=t;$('#pfb').className=ok?'ok':'bad'}
function renderQ(){const c=PS.cur,sc=store.get('ll_score',{ok:0,n:0}),mcq=c.k==='mc'||c.k==='und',orl=c.k==='oral',i=c.n==='Einheiten umrechnen'?unitMod():byName(c.n);
 if(c.exam||orl){$('#pt').innerHTML=`<span class="chip">${orl?'Mündliche Frage':'Prüfungsaufgabe'}: ${c.n}</span>`}else{$('#pt').innerHTML=`<button type="button" class="chip" id="pgo">Thema: ${c.n} →</button>`;$('#pgo').onclick=()=>go(i)}
 if(orl){const o=store.get('ll_oral',{k:0,n:0});$('#sc').textContent=`Mündlich gewusst: ${o.k} von ${o.n}`}else $('#sc').textContent=`Richtig: ${sc.ok} von ${sc.n}`;
 $('#psol').hidden=true;$('#pfb').textContent='';$('#pfb').className='';$('#ptipt').textContent='';$('#pck').textContent='Prüfen';$('#pck').hidden=orl;$('#psh').textContent=orl?'Musterantwort':'Lösungsweg';c.done=false;c.sel=-1;$('#pin').hidden=$('#pu').hidden=mcq||orl;$('#ptip').hidden=true;
 if(orl){$('#pq').textContent=c.q;$('#popts').innerHTML='';$('#ptol').textContent='Überlege zuerst, wie Du antworten würdest. Dann die Musterantwort ansehen und Dich ehrlich einschätzen.';return}
 if(mcq){$('#pq').textContent=(c.k==='und'?'Verständnis: ':'Ankreuzen: ')+c.q;$('#popts').innerHTML=c.opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><b>${'ABCD'[j]}</b> ${o}</button>`).join('');$('#popts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(+b.dataset.j));$('#ptol').textContent='Wähle eine Antwort und tippe auf Prüfen.'}
 else{$('#popts').innerHTML='';const it=item(),t=it.t;$('#pq').textContent=c.k==='steps'?c.intro+(c.log.length?'\n'+c.log.join('\n'):'')+`\nSchritt ${c.i+1} von ${c.steps.length}: `+c.steps[c.i][0]:c.q[0];$('#pu').textContent=it.u;$('#pin').value='';$('#ptol').textContent=t.abs!=null?`Toleranz ±${String(t.abs).replace('.',',')}`:`Toleranz ±${(t.rel||.02)*100} % (Dezimalkomma ist erlaubt)`;$('#ptip').hidden=!(c.k==='steps'&&c.steps[c.i][5])}}
function pickOpt(j){const c=PS.cur;if(!c||c.done)return;c.sel=j;$('#popts').querySelectorAll('.opt').forEach((b,k)=>b.className='opt'+(k===j?' sel':''))}
function finishStep(c,it){c.done=true;if(c.k==='steps'){c.log.push(`Ergebnis ${c.i+1}: ${nf(it.a)} ${it.u}`);$('#pck').textContent=c.i<c.steps.length-1?'Weiter ▶':'Nächste Aufgabe'}else $('#pck').textContent='Nächste Aufgabe'}
function checkQ(){const c=PS.cur;if(!c)return;
 if(c.done){if(c.k==='steps'&&c.i<c.steps.length-1){c.i++;c.tried=false;renderQ()}else newQ();return}
 if(c.k==='mc'||c.k==='und'){if(c.sel<0){fb('Bitte eine Antwort wählen.',false);return}const ok=c.sel===c.ok;if(!c.tried){c.tried=true;score(ok)}c.done=true;
  $('#popts').querySelectorAll('.opt').forEach((b,k)=>b.className='opt'+(k===c.ok?' right':k===c.sel?' wrong':''));fb(ok?'✓ Richtig!':'✗ Leider nicht. Richtig ist '+'ABCD'[c.ok]+'.',ok);$('#psol').innerHTML='<b>Erklärung</b><p>'+c.why+'</p>';$('#psol').hidden=false;$('#pck').textContent='Nächste Aufgabe';return}
 const u=parseFloat(String($('#pin').value).replace(',','.')),it=item();
 if(!isFinite(u)){fb('Bitte eine Zahl eingeben.',false);return}
 const ok=Math.abs(u-it.a)<=(it.t.abs!=null?it.t.abs:(it.t.rel||.02)*Math.abs(it.a));
 if(!c.tried){c.tried=true;score(ok)}
 if(ok){fb(c.k==='steps'&&c.i===c.steps.length-1?'✓ Richtig! Alle Schritte geschafft.':'✓ Richtig!',true);finishStep(c,it)}else fb('✗ Noch nicht. Prüfe Einheit und Rundung oder öffne den Lösungsweg.',false)}

 if(c.k==='mc'||c.k==='und'){c.done=true;if(!c.tried){c.tried=true;score(false)}$('#popts').querySelectorAll('.opt').forEach((b,k)=>b.className='opt'+(k===c.ok?' right':''));$('#psol').innerHTML='<b>Richtig ist '+'ABCD'[c.ok]+'</b><p>'+c.why+'</p>';$('#psol').hidden=false;$('#pck').textContent='Nächste Aufgabe';return}
 const it=item();if(!c.tried){c.tried=true;score(false)}
 $('#psol').innerHTML='<b>Lösungsweg</b>'+it.s.map(x=>`<p>${x}</p>`).join('')+`<p><b>Ergebnis: ${nf(it.a,4)} ${it.u}</b></p>`;$('#psol').hidden=false;if(!c.done)finishStep(c,it)}
$('#ptip').onclick=()=>{const c=PS.cur;if(c&&c.k==='steps'&&c.steps[c.i][5])$('#ptipt').textContent='💡 '+c.steps[c.i][5]};$('#pck').onclick=checkQ;$('#pnx').onclick=newQ;$('#psh').onclick=showSol;$('#pin').onkeydown=e=>{if(e.key==='Enter')checkQ()};$('#pf').onchange=e=>{PS.sel=e.target.value;if(PS.exam)$('#pk').hidden=!PS.sel.startsWith('O:');newQ()};$('#pk').onchange=e=>{if(PS.exam)PS.cat=e.target.value;else KIND=e.target.value;newQ()};
function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;if(cur>=0&&M[cur].anim&&play){clock+=dt;render()}requestAnimationFrame(loop)}
nav();requestAnimationFrame(loop);
